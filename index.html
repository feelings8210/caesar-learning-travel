tical line of symmetry survives. The horizontal one survives too, because each painted column is painted top to bottom.\n(d) My panel's perimeter is 2 x (4 + 9) = 26 tiles. The 3 by 12 panel would need 2 x (3 + 12) = 30, which is 4 more. The rejected 6 by 6 would have needed only 24, so the symmetry rule actually cost me 2 tiles of edging.","acceptable_range":"Any of the four allowed rectangles may be chosen. The blue count must be 12. The described arrangement must genuinely preserve a line of symmetry and must be specific enough to check - vague answers like 'put them symmetrically' are not sufficient. Perimeter must match the chosen panel. Noting in (d) that the rejected square would have been the most efficient of all is a strong observation but is not required.","insufficient":"Rejects the 6 by 6 for the wrong reason (for example claiming its area is wrong); gives a blue count other than 12; describes an arrangement that does not actually preserve a mirror line, or is too vague to check; or gives a perimeter that does not match the panel chosen."},"challenge_justification":"This is the synthesis item for the whole pack and there is no procedure that produces it. The child must reuse Day 6's factor-pair list, apply a Day 7 symmetry constraint to eliminate a member of it, compute a Day 3 fraction of a quantity, invent a tile arrangement that satisfies a symmetry requirement he must verify himself, and then compare Day 6 perimeters across the remaining options. Four constraints interact - and the fourth deliberately conflicts with efficiency, since the rejected square would have had the smallest perimeter, so the design is not simply 'pick the best'. Every part requires justification rather than calculation."}],"today_you_learned":"A line of symmetry is a mirror line, and the test is the fold, not the area. Equal halves are not enough - they have to land on each other, which is why the diagonal of a rectangle fails but the diagonal of a square works. Regular shapes with n sides have n lines of symmetry, and the smallest turn that hides the movement is 360 divided by n. Symmetry is also a checking tool: if a pattern is meant to mirror and one tile is wrong, the fold finds it. And a real design problem is not one calculation - it is several requirements that have to be true at the same time, sometimes pulling against each other.","passage":null,"vocabulary":[]}],"content_version":"6ab6a246ff2e27ee"}</script>
<script>window.__TRAVEL_PACK__ = JSON.parse(document.getElementById("pack-data").textContent);</script>
<script>
/* Caesar Learning - Step by Step : Spain Travel Pack
 * Offline-first. All content is embedded in this page; nothing is fetched.
 * Open responses are SAVED, never graded. Closed answers get deterministic
 * feedback only. Nothing here sets DONE, REVIEWED, or mastery.
 */
(function () {
  "use strict";

  var PACK = window.__TRAVEL_PACK__;
  var SCHEMA = "travel_evidence_v1";
  var DB_NAME = "caesar-travel-" + PACK.pack_id;
  var DB_VERSION = 1;
  var PASTE_RUN_WORDS = 8; // verbatim run that triggers the own-words nudge

  // ---------------------------------------------------------------- storage
  var dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv", { keyPath: "k" });
        if (!d.objectStoreNames.contains("lessons")) d.createObjectStore("lessons", { keyPath: "machine_id" });
        if (!d.objectStoreNames.contains("responses")) d.createObjectStore("responses", { keyPath: "id" });
        if (!d.objectStoreNames.contains("events")) d.createObjectStore("events", { keyPath: "seq", autoIncrement: true });
        if (!d.objectStoreNames.contains("feedback")) d.createObjectStore("feedback", { keyPath: "id" });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbp;
  }

  function tx(store, mode, fn) {
    return db().then(function (d) {
      return new Promise(function (resolve, reject) {
        var t = d.transaction(store, mode);
        var s = t.objectStore(store);
        var out = fn(s);
        t.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error); };
      });
    });
  }

  function put(store, value) { return tx(store, "readwrite", function (s) { return s.put(value); }); }
  function getAll(store) {
    return tx(store, "readonly", function (s) { return s.getAll(); }).then(function (r) { return r || []; });
  }
  function get(store, key) {
    return tx(store, "readonly", function (s) { return s.get(key); });
  }

  function now() { return new Date().toISOString(); }

  function logEvent(type, detail) {
    return put("events", {
      at: now(), type: type, detail: detail || {}
    }).catch(function () { /* evidence logging must never block the child */ });
  }

  // ---------------------------------------------------------------- state
  var LESSONS = {};
  PACK.lessons.forEach(function (l) { LESSONS[l.machine_id] = l; });

  var progress = {};   // machine_id -> record
  var responses = {};  // responseId -> record
  var feedback = {};   // feedbackId -> record

  function blankProgress(id) {
    return {
      machine_id: id, pack_id: PACK.pack_id, schema_version: SCHEMA,
      status: "not_started", current_step: 0, active_seconds: 0,
      started_at: null, last_opened_at: null, completed_on_device_at: null,
      challenge_reached: false, hints: {}
    };
  }
  function prog(id) {
    if (!progress[id]) progress[id] = blankProgress(id);
    return progress[id];
  }
  function saveProg(id) { return put("lessons", prog(id)); }

  function respId(mid, itemId, fieldKey) {
    return mid + "|" + itemId + (fieldKey ? "|" + fieldKey : "");
  }
  function resp(mid, itemId, fieldKey) {
    var id = respId(mid, itemId, fieldKey);
    if (!responses[id]) {
      responses[id] = {
        id: id, schema_version: SCHEMA, pack_id: PACK.pack_id,
        machine_id: mid, item_id: itemId, field_key: fieldKey || null,
        value: null, attempts: 0, correct: null, first_attempt_correct: null,
        attempt_log: [], first_answered_at: null, updated_at: null,
        own_words_flagged: false
      };
    }
    return responses[id];
  }

  function fbId(mid, kind) { return mid + "|" + kind; }
  function fb(mid, kind) {
    var id = fbId(mid, kind);
    if (!feedback[id]) {
      feedback[id] = {
        id: id, schema_version: SCHEMA, pack_id: PACK.pack_id,
        machine_id: mid, kind: kind, current: {}, versions: [], updated_at: null
      };
    }
    return feedback[id];
  }
  function saveFeedback(mid, kind, values, source) {
    var rec = fb(mid, kind);
    rec.current = values;
    rec.updated_at = now();
    rec.versions.push({
      version_id: "v" + (rec.versions.length + 1),
      values: JSON.parse(JSON.stringify(values)),
      source: source, saved_at: rec.updated_at
    });
    return put("feedback", rec).then(function () {
      return logEvent(kind + "_feedback_saved", { machine_id: mid, version: rec.versions.length });
    });
  }

  function loadAll() {
    return Promise.all([getAll("lessons"), getAll("responses"), getAll("feedback")])
      .then(function (r) {
        r[0].forEach(function (x) { progress[x.machine_id] = x; });
        r[1].forEach(function (x) { responses[x.id] = x; });
        r[2].forEach(function (x) { feedback[x.id] = x; });
      });
  }

  // ------------------------------------------------------------ active time
  var timer = { mid: null, since: null };
  function startTimer(mid) { timer.mid = mid; timer.since = Date.now(); }
  function flushTimer() {
    if (!timer.mid || !timer.since) return Promise.resolve();
    var secs = Math.round((Date.now() - timer.since) / 1000);
    timer.since = Date.now();
    if (secs <= 0 || secs > 3600) return Promise.resolve(); // ignore absurd gaps
    var p = prog(timer.mid);
    p.active_seconds += secs;
    return saveProg(timer.mid);
  }
  function stopTimer() { var p = flushTimer(); timer.mid = null; timer.since = null; return p; }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { flushTimer(); timer.since = null; }
    else if (timer.mid) { timer.since = Date.now(); }
  });
  window.addEventListener("pagehide", function () { flushTimer(); });
  setInterval(function () { if (timer.mid && !document.hidden) flushTimer(); }, 20000);

  // ------------------------------------------------------------ own-words guard
  function words(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
  }
  /* Longest run of consecutive words shared by the response and the source text.
     Purely deterministic string comparison - not grading, not AI. */
  function longestSharedRun(responseText, sourceText) {
    var a = words(responseText), b = words(sourceText);
    if (!a.length || !b.length) return 0;
    var prev = new Array(b.length + 1).fill(0), best = 0;
    for (var i = 1; i <= a.length; i++) {
      var cur = new Array(b.length + 1).fill(0);
      for (var j = 1; j <= b.length; j++) {
        if (a[i - 1] === b[j - 1]) {
          cur[j] = prev[j - 1] + 1;
          if (cur[j] > best) best = cur[j];
        }
      }
      prev = cur;
    }
    return best;
  }
  function lessonSourceText(lesson) {
    var parts = [];
    if (lesson.passage) {
      lesson.passage.blocks.forEach(function (b) { if (b.text) parts.push(b.text); });
    }
    return parts.join(" ");
  }

  // ---------------------------------------------------------------- steps
  function stepsFor(lesson) {
    var steps = [];
    lesson.sections.forEach(function (s, i) {
      steps.push({ kind: "read", heading: s.heading, body: s.body, idx: i });
    });
    lesson.items.forEach(function (it) { steps.push({ kind: "item", item: it }); });
    steps.push({ kind: "learned" });
    steps.push({ kind: "student_feedback" });
    steps.push({ kind: "finish" });
    return steps;
  }

  // ---------------------------------------------------------------- helpers
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function paras(text) {
    return String(text).split(/\n\n+/).map(function (p) { return el("p", { text: p }); });
  }
  function statusOf(mid) {
    var p = progress[mid];
    if (!p || p.status === "not_started") return "not_started";
    return p.status;
  }
  var STATUS_LABEL = {
    not_started: "Not Started",
    in_progress: "In Progress",
    completed_on_device: "Completed on device"
  };

  var root = document.getElementById("app");
  function mount(node) { root.innerHTML = ""; root.appendChild(node); window.scrollTo(0, 0); }

  function topbar(crumb, opts) {
    opts = opts || {};
    var kids = [];
    if (opts.back) kids.push(el("button", { class: "btn small ghost", text: "← " + opts.back.label, onclick: opts.back.go }));
    kids.push(el("div", { class: "crumb", text: crumb }));
    kids.push(el("div", { class: "spacer" }));
    (opts.actions || []).forEach(function (a) { kids.push(a); });
    return el("div", { class: "topbar" }, kids);
  }

  // ---------------------------------------------------------------- home
  function renderHome() {
    stopTimer();
    var days = {};
    PACK.lessons.forEach(function (l) { (days[l.day] = days[l.day] || []).push(l); });

    var cards = Object.keys(days).sort(function (a, b) { return a - b; }).map(function (d) {
      var list = days[d].slice().sort(function (a, b) { return a.subject < b.subject ? -1 : 1; });
      var doneCount = list.filter(function (l) { return statusOf(l.machine_id) === "completed_on_device"; }).length;
      var tiles = list.map(function (l) {
        var st = statusOf(l.machine_id);
        var cls = "tile" + (st === "completed_on_device" ? " done" : st === "in_progress" ? " progress" : "");
        return el("button", { class: cls, onclick: function () { location.hash = "#/lesson/" + l.machine_id; } }, [
          el("div", { class: "subject", text: l.subject === "math" ? "Math" : "English" }),
          el("div", { class: "title", text: l.child_title }),
          el("div", { class: "status" }, [
            el("span", { class: "dot" + (st === "completed_on_device" ? " done" : st === "in_progress" ? " progress" : "") }),
            el("span", { text: STATUS_LABEL[st] })
          ])
        ]);
      });
      return el("section", { class: "day" }, [
        el("h2", null, [
          el("span", { class: "daynum", text: "Day " + d }),
          el("span", { class: "daytag", text: doneCount === 2 ? "both done" : doneCount === 1 ? "1 of 2 done" : "" })
        ]),
        el("div", { class: "tiles" }, tiles)
      ]);
    });

    mount(el("div", null, [
      topbar("Spain Travel Pack", {
        actions: [el("button", { class: "btn small ghost", text: "Grown-ups", onclick: function () { location.hash = "#/parent"; } })]
      }),
      el("div", { class: "wrap" }, [
        el("div", { class: "hero" }, [
          el("div", { class: "kicker", text: "Caesar Learning · Step by Step" }),
          el("h1", { text: "Spain Travel Pack" }),
          el("p", { class: "sub", text: "Seven days. One Math lesson and one English lesson each day. Everything works with no internet." })
        ])
      ].concat(cards).concat([
        el("p", { class: "footnote", text: "“Completed on device” means you finished it here on the iPad. Your written answers are saved for a grown-up to read later — nothing is marked automatically." })
      ]))
    ]));
  }

  // ---------------------------------------------------------------- drawer
  var drawerOpen = false;
  function openDrawer(lesson) {
    if (drawerOpen) return;
    drawerOpen = true;
    var body = [];
    if (lesson.passage) {
      if (lesson.passage.subtitle) body.push(el("p", { class: "sub", text: lesson.passage.subtitle }));
      lesson.passage.blocks.forEach(function (b) {
        if (b.kind === "heading") body.push(el("h3", { text: b.text }));
        else body.push(el("p", { text: b.text }));
      });
    } else {
      lesson.sections.forEach(function (s) {
        if (/orientation|bridge|feedback return/i.test(s.heading)) return;
        body.push(el("h3", { text: s.heading }));
        paras(s.body).forEach(function (p) { body.push(p); });
      });
    }
    if (lesson.vocabulary && lesson.vocabulary.length) {
      var dl = el("dl", { class: "vocab" });
      dl.appendChild(el("h3", { text: "Words to know" }));
      lesson.vocabulary.forEach(function (v) {
        dl.appendChild(el("dt", { text: v.term }));
        dl.appendChild(el("dd", { text: v.gloss }));
      });
      body.push(dl);
    }
    function close() {
      drawerOpen = false;
      var d = document.getElementById("drawer"); if (d) d.remove();
      var b = document.getElementById("drawer-bd"); if (b) b.remove();
    }
    document.body.appendChild(el("div", { class: "drawer-backdrop", id: "drawer-bd", onclick: close }));
    document.body.appendChild(el("aside", { class: "drawer", id: "drawer" }, [
      el("header", null, [
        el("h2", { text: lesson.passage ? (lesson.passage.title || "Passage") : "Lesson notes" }),
        el("button", { class: "btn small", text: "Close", onclick: close })
      ]),
      el("div", { class: "body" }, body)
    ]));
    logEvent("reference_opened", { machine_id: lesson.machine_id, kind: lesson.passage ? "passage" : "notes" });
  }

  // ---------------------------------------------------------------- answers
  function normNumber(s) {
    if (s === null || s === undefined) return null;
    var t = String(s).trim().replace(/[$,\s]/g, "").replace(/^\+/, "");
    if (t === "" || !/^-?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
    return parseFloat(t);
  }
  function normText(s) {
    return String(s || "").trim().toLowerCase().replace(/\s+/g, "");
  }
  function gradeClosed(spec, value) {
    var kind = spec.type || spec.kind;
    if (kind === "choice") return value === spec.answer;
    if (kind === "multi") {
      if (!Array.isArray(value)) return false;
      var a = value.slice().sort().join(","), b = spec.answer.slice().sort().join(",");
      return a === b;
    }
    if (kind === "numeric") {
      var n = normNumber(value);
      if (n === null) return false;
      return Math.abs(n - spec.answer) < 1e-9;
    }
    if (kind === "short_exact") {
      var got = normText(value);
      return (spec.answer || []).some(function (a) { return normText(a) === got; });
    }
    return null;
  }

  function recordAnswer(lesson, item, spec, fieldKey, value) {
    var r = resp(lesson.machine_id, item.id, fieldKey);
    var kind = spec.type || spec.kind;
    r.value = value;
    r.updated_at = now();
    if (!r.first_answered_at) r.first_answered_at = r.updated_at;
    r.attempts += 1;
    if (kind === "open") {
      r.correct = null;
      var src = lessonSourceText(lesson);
      if (src) {
        var run = longestSharedRun(value, src);
        r.longest_copied_run_words = run;
        r.own_words_flagged = run >= PASTE_RUN_WORDS;
      }
    } else {
      var ok = gradeClosed(spec, value);
      r.correct = ok;
      if (r.first_attempt_correct === null) r.first_attempt_correct = ok;
      // Keep the sequence of tries, not just the last one - a child who gets
      // there on the third attempt has produced different evidence from one
      // who got it first time, and the final value alone hides that.
      if (!r.attempt_log) r.attempt_log = [];
      r.attempt_log.push({ at: r.updated_at, correct: ok, value: value });
      if (r.attempt_log.length > 12) r.attempt_log = r.attempt_log.slice(-12);
    }
    var p = prog(lesson.machine_id);
    if (item.phase === "challenge") p.challenge_reached = true;
    return Promise.all([
      put("responses", r),
      saveProg(lesson.machine_id),
      logEvent("item_attempted", {
        machine_id: lesson.machine_id, item_id: item.id, field: fieldKey || null,
        attempt: r.attempts, correct: r.correct, phase: item.phase
      })
    ]).then(function () { return r; });
  }

  // ---------------------------------------------------------------- lesson
  function renderLesson(mid) {
    var lesson = LESSONS[mid];
    if (!lesson) { location.hash = "#/"; return; }
    var p = prog(mid);
    var steps = stepsFor(lesson);
    if (p.status === "not_started") {
      p.status = "in_progress";
      p.started_at = now();
      logEvent("lesson_opened", { machine_id: mid });
    }
    p.last_opened_at = now();
    if (p.current_step >= steps.length) p.current_step = steps.length - 1;
    saveProg(mid);
    startTimer(mid);
    drawStep(lesson, steps);
  }

  function drawStep(lesson, steps) {
    var p = prog(lesson.machine_id);
    var i = Math.max(0, Math.min(p.current_step, steps.length - 1));
    var step = steps[i];
    var pct = Math.round((i / (steps.length - 1)) * 100);

    var actions = [
      el("button", {
        class: "btn small", text: lesson.passage ? "View Passage" : "Lesson notes",
        onclick: function () { openDrawer(lesson); }
      })
    ];

    var content;
    if (step.kind === "read") content = viewRead(lesson, step);
    else if (step.kind === "item") content = viewItem(lesson, steps, step.item);
    else if (step.kind === "learned") content = viewLearned(lesson);
    else if (step.kind === "student_feedback") content = viewStudentFeedback(lesson);
    else content = viewFinish(lesson);

    function go(delta) {
      flushTimer().then(function () {
        var pp = prog(lesson.machine_id);
        pp.current_step = Math.max(0, Math.min(pp.current_step + delta, steps.length - 1));
        return saveProg(lesson.machine_id);
      }).then(function () { drawStep(lesson, steps); });
    }

    var nav = el("div", { class: "navrow" }, [
      i > 0 ? el("button", { class: "btn", text: "Back", onclick: function () { go(-1); } }) : null,
      el("div", { class: "spacer" }),
      i < steps.length - 1 ? el("button", { class: "btn primary", text: "Next", onclick: function () { go(1); } }) : null
    ]);

    mount(el("div", null, [
      topbar(lesson.family_display_label, {
        back: { label: "Home", go: function () { flushTimer().then(function () { location.hash = "#/"; }); } },
        actions: actions
      }),
      el("div", { class: "wrap" }, [
        el("div", { class: "progressbar" }, [el("i", { style: "width:" + pct + "%" })]),
        content,
        step.kind === "finish" ? null : nav
      ])
    ]));
  }

  function viewRead(lesson, step) {
    var kids = [el("h2", { text: step.heading })].concat(paras(step.body));
    return el("div", null, [
      el("div", { class: "step-kicker", text: lesson.child_title }),
      el("div", { class: "card read" }, kids)
    ]);
  }

  function viewLearned(lesson) {
    return el("div", null, [
      el("div", { class: "step-kicker", text: "Today you learned" }),
      el("div", { class: "card read" }, paras(lesson.today_you_learned))
    ]);
  }

  // ------------------------------------------------------------ item views
  function hintBlock(lesson, item) {
    if (!item.hint) return null;
    var d = el("details", { class: "hint" }, [
      el("summary", { text: "Hint" }),
      el("p", { text: item.hint })
    ]);
    d.addEventListener("toggle", function () {
      if (!d.open) return;
      var p = prog(lesson.machine_id);
      var h = p.hints[item.id] || { views: 0, first_shown_at: null, last_shown_at: null };
      h.views += 1;
      h.last_shown_at = now();
      if (!h.first_shown_at) h.first_shown_at = h.last_shown_at;
      p.hints[item.id] = h;
      saveProg(lesson.machine_id);
      logEvent("hint_shown", { machine_id: lesson.machine_id, item_id: item.id, views: h.views });
    });
    return d;
  }

  function feedbackNote(item, correct) {
    var note = el("div", { class: "note " + (correct ? "ok" : "no") });
    note.appendChild(el("b", { text: correct ? "Correct" : "Not quite — try again, then read this" }));
    note.appendChild(el("span", { text: item.explanation || "" }));
    return note;
  }

  function choiceControl(lesson, item, spec, fieldKey, onGraded) {
    var r = resp(lesson.machine_id, item.id, fieldKey);
    var box = el("div", { class: "opts" });
    var multi = (spec.type || spec.kind) === "multi";
    var selected = multi ? (Array.isArray(r.value) ? r.value.slice() : []) : r.value;

    function paint() {
      box.innerHTML = "";
      spec.choices.forEach(function (c) {
        var isSel = multi ? selected.indexOf(c.value) >= 0 : selected === c.value;
        var cls = "opt" + (isSel ? " sel" : "");
        if (r.correct !== null && r.correct !== undefined && isSel) {
          cls = "opt " + (r.correct ? "right" : "wrong");
        }
        box.appendChild(el("button", {
          class: cls,
          onclick: function () {
            if (multi) {
              var k = selected.indexOf(c.value);
              if (k >= 0) selected.splice(k, 1); else selected.push(c.value);
            } else { selected = c.value; }
            r.correct = null;
            paint();
            if (!multi) submit();
          }
        }, [
          el("span", { class: "mark", text: c.value }),
          el("span", { text: c.text })
        ]));
      });
      if (multi) {
        box.appendChild(el("button", {
          class: "btn primary", text: "Check my answer",
          onclick: submit
        }));
      }
    }
    function submit() {
      recordAnswer(lesson, item, spec, fieldKey, multi ? selected.slice() : selected)
        .then(function (rec) { paint(); onGraded(rec); });
    }
    paint();
    return box;
  }

  function textControl(lesson, item, spec, fieldKey, onSaved) {
    var r = resp(lesson.machine_id, item.id, fieldKey);
    var kind = spec.type || spec.kind;
    var isOpen = kind === "open";
    var input = isOpen
      ? el("textarea", { "aria-label": spec.label || item.id })
      : el("input", { type: "text", inputmode: kind === "numeric" ? "decimal" : "text", "aria-label": spec.label || item.id });
    if (r.value !== null && r.value !== undefined) input.value = r.value;

    var saved = el("span", { class: "saved", text: "" });
    var wrapNote = el("div");
    var t = null;
    function persist(immediate) {
      clearTimeout(t);
      t = setTimeout(function () {
        recordAnswer(lesson, item, spec, fieldKey, input.value).then(function (rec) {
          saved.textContent = input.value.trim() ? "Saved" : "";
          wrapNote.innerHTML = "";
          if (isOpen && rec.own_words_flagged) {
            wrapNote.appendChild(el("div", { class: "note warn" }, [
              el("b", { text: "That looks copied from the passage" }),
              el("span", { text: "About " + rec.longest_copied_run_words + " words in a row match the text exactly. Cover the passage with your hand and say the idea your own way — you can still leave it as it is if you want to." })
            ]));
          }
          if (onSaved) onSaved(rec);
        });
      }, immediate ? 0 : 600);
    }
    input.addEventListener("input", function () { persist(false); });
    input.addEventListener("blur", function () { persist(true); });
    return el("div", null, [input, el("div", { style: "margin-top:6px" }, [saved]), wrapNote]);
  }

  function viewItem(lesson, steps, item) {
    var kids = [
      el("div", { class: "step-kicker", text: item.phase.replace(/_/g, " ") }),
      el("div", { class: "prompt", text: item.prompt })
    ];
    var noteHost = el("div");

    function graded(rec) {
      noteHost.innerHTML = "";
      if (rec.correct === true || rec.correct === false) {
        noteHost.appendChild(feedbackNote(item, rec.correct));
      }
    }

    if (item.type === "choice" || item.type === "multi") {
      kids.push(choiceControl(lesson, item, item, null, graded));
      var existing = resp(lesson.machine_id, item.id, null);
      if (existing.correct === true || existing.correct === false) graded(existing);
    } else if (item.type === "numeric" || item.type === "short_exact") {
      var host = el("div");
      kids.push(host);
      host.appendChild(textControl(lesson, item, item, null, graded));
      host.appendChild(el("button", {
        class: "btn primary", style: "margin-top:12px", text: "Check my answer",
        onclick: function () {
          var inp = host.querySelector("input");
          recordAnswer(lesson, item, item, null, inp.value).then(graded);
        }
      }));
      var ex = resp(lesson.machine_id, item.id, null);
      if (ex.correct === true || ex.correct === false) graded(ex);
    } else if (item.type === "open") {
      kids.push(textControl(lesson, item, item, null, null));
      kids.push(el("div", { class: "note info" }, [
        el("b", { text: "This one is not marked" }),
        el("span", { text: "Your answer is saved exactly as you write it, for a grown-up to read later." })
      ]));
    } else if (item.type === "structured") {
      item.fields.forEach(function (f) {
        var fieldNote = el("div");
        var control;
        if (f.kind === "choice") {
          control = choiceControl(lesson, item, f, f.key, function (rec) {
            fieldNote.innerHTML = "";
            if (rec.correct === true || rec.correct === false) {
              fieldNote.appendChild(el("div", { class: "note " + (rec.correct ? "ok" : "no") }, [
                el("b", { text: rec.correct ? "Correct" : "Not quite — try again" })
              ]));
            }
          });
        } else if (f.kind === "open") {
          control = textControl(lesson, item, f, f.key, null);
        } else {
          var h = el("div");
          h.appendChild(textControl(lesson, item, f, f.key, function (rec) {
            fieldNote.innerHTML = "";
            if (rec.correct === true || rec.correct === false) {
              fieldNote.appendChild(el("div", { class: "note " + (rec.correct ? "ok" : "no") }, [
                el("b", { text: rec.correct ? "Correct" : "Not quite — try again" })
              ]));
            }
          }));
          h.appendChild(el("button", {
            class: "btn small primary", style: "margin-top:10px", text: "Check",
            onclick: function () {
              recordAnswer(lesson, item, f, f.key, h.querySelector("input").value).then(function (rec) {
                fieldNote.innerHTML = "";
                fieldNote.appendChild(el("div", { class: "note " + (rec.correct ? "ok" : "no") }, [
                  el("b", { text: rec.correct ? "Correct" : "Not quite — try again" })
                ]));
              });
            }
          }));
          control = h;
        }
        kids.push(el("div", { class: "field" }, [
          el("label", { text: f.label }), control, fieldNote
        ]));
      });
      if (item.explanation) {
        kids.push(el("details", { class: "hint" }, [
          el("summary", { text: "Show me how it works (after you have tried)" }),
          el("p", { text: item.explanation })
        ]));
      }
    }

    kids.push(noteHost);
    var hint = hintBlock(lesson, item);
    if (hint) kids.push(hint);
    return el("div", null, [el("div", { class: "card" }, kids)]);
  }

  // ------------------------------------------------------ student feedback
  var STUDENT_FIELDS = [
    { key: "difficulty", label: "How hard was this?", options: [["too_easy", "Too easy"], ["about_right", "About right"], ["too_hard", "Too hard"]] },
    { key: "interest", label: "How interesting was it?", options: [["low", "Not much"], ["okay", "Okay"], ["high", "Really interesting"]] },
    { key: "hint_usage", label: "Did you use hints?", options: [["never", "Never"], ["sometimes", "Sometimes"], ["often", "Often"]] }
  ];
  var STUDENT_TEXT = [
    { key: "confusing_part", label: "Which part was confusing? (you can leave this empty)" },
    { key: "what_felt_new", label: "What felt new today?" },
    { key: "what_would_you_like_more_of", label: "What would you like more of?" },
    { key: "optional_comment", label: "Anything else? (optional)" }
  ];

  function viewStudentFeedback(lesson) {
    var rec = fb(lesson.machine_id, "student");
    var values = Object.assign({}, rec.current);
    var kids = [
      el("h2", { text: "How was that?" }),
      el("p", { class: "sub", text: "Three quick taps, then anything you feel like typing. Nothing here is marked, and you can go on to the next lesson whether you fill this in or not." })
    ];
    STUDENT_FIELDS.forEach(function (f) {
      var row = el("div", { class: "chips" });
      function paint() {
        row.innerHTML = "";
        f.options.forEach(function (o) {
          row.appendChild(el("button", {
            class: "chip" + (values[f.key] === o[0] ? " sel" : ""),
            text: o[1],
            onclick: function () { values[f.key] = o[0]; paint(); save("student_partial"); }
          }));
        });
      }
      paint();
      kids.push(el("div", { class: "field" }, [el("label", { text: f.label }), row]));
    });
    STUDENT_TEXT.forEach(function (f) {
      var ta = el("textarea", { style: "min-height:78px", "aria-label": f.label });
      ta.value = values[f.key] || "";
      var t = null;
      ta.addEventListener("input", function () {
        values[f.key] = ta.value;
        clearTimeout(t); t = setTimeout(function () { save("student_partial"); }, 700);
      });
      kids.push(el("div", { class: "field" }, [el("label", { text: f.label }), ta]));
    });
    var savedMsg = el("div", { class: "saved" });
    function save(source) {
      saveFeedback(lesson.machine_id, "student", values, source).then(function () {
        savedMsg.textContent = "Saved on this iPad";
      });
    }
    kids.push(savedMsg);
    return el("div", null, [el("div", { class: "card" }, kids)]);
  }

  // ---------------------------------------------------------------- finish
  function viewFinish(lesson) {
    var p = prog(lesson.machine_id);
    var done = p.status === "completed_on_device";
    var kids = [
      el("h2", { text: done ? "Finished on this iPad" : "Ready to finish?" }),
      el("p", { text: done
        ? "You finished this one. You can still come back and change anything you wrote."
        : "Marking it finished just tells you where you got to. Your answers stay exactly as you wrote them, and you can reopen this lesson whenever you like." })
    ];
    var msg = el("div", { class: "saved" });
    kids.push(el("div", { class: "navrow" }, [
      el("button", {
        class: "btn primary", text: done ? "Finished ✓" : "Mark finished on this iPad",
        onclick: function () {
          p.status = "completed_on_device";
          p.completed_on_device_at = p.completed_on_device_at || now();
          saveProg(lesson.machine_id)
            .then(function () { return logEvent("lesson_completed_on_device", { machine_id: lesson.machine_id }); })
            .then(function () { msg.textContent = "Saved."; location.hash = "#/"; });
        }
      }),
      el("div", { class: "spacer" }),
      el("button", { class: "btn", text: "Back to all days", onclick: function () { flushTimer().then(function () { location.hash = "#/"; }); } })
    ]));
    kids.push(msg);
    kids.push(el("p", { class: "footnote", text: "This does not mark the lesson correct, reviewed or mastered. A grown-up reads your written answers later." }));
    return el("div", null, [el("div", { class: "card" }, kids)]);
  }

  // ---------------------------------------------------------------- parent
  var PARENT_COMMON = [
    { key: "difficulty", label: "Difficulty for Caesar", options: [["too_easy", "Too easy"], ["about_right", "About right"], ["too_hard", "Too hard"]] }
  ];
  var PARENT_MATH = [
    { key: "concept_understanding", label: "Concept understanding", options: [["secure", "Secure"], ["partial", "Partial"], ["not_yet", "Not yet"]] },
    { key: "fluency", label: "Calculation fluency", options: [["strong", "Strong"], ["ok", "Okay"], ["shaky", "Shaky"]] },
    { key: "main_issue", label: "Main issue", options: [["none", "None"], ["setup", "Setting up"], ["arithmetic", "Arithmetic"], ["explanation", "Explaining"], ["checking", "Checking"]] }
  ];
  var PARENT_ENGLISH = [
    { key: "vocabulary_load", label: "Vocabulary load", options: [["light", "Light"], ["right", "About right"], ["heavy", "Heavy"]] },
    { key: "evidence_use", label: "Use of evidence", options: [["precise", "Precise"], ["partial", "Partial"], ["vague", "Vague"]] },
    { key: "main_issue", label: "Main issue", options: [["none", "None"], ["copying", "Copying the text"], ["limitation", "Empty limitation"], ["writing_load", "Writing load"], ["reasoning", "Reasoning"]] }
  ];

  function renderParent() {
    stopTimer();
    var rows = PACK.lessons.slice().sort(function (a, b) {
      return a.day - b.day || (a.subject < b.subject ? -1 : 1);
    }).map(function (l) {
      var p = progress[l.machine_id] || blankProgress(l.machine_id);
      var answered = Object.keys(responses).filter(function (k) {
        return responses[k].machine_id === l.machine_id && responses[k].value !== null && responses[k].value !== "";
      }).length;
      var sf = feedback[fbId(l.machine_id, "student")];
      var pf = feedback[fbId(l.machine_id, "parent")];
      var mins = Math.round((p.active_seconds || 0) / 60);
      return el("tr", null, [
        el("td", null, [
          el("div", { text: l.family_display_label, style: "font-weight:600" }),
          el("div", { class: "footnote", style: "margin:0", text: l.child_title })
        ]),
        el("td", { text: STATUS_LABEL[p.status || "not_started"] }),
        el("td", { text: String(answered) }),
        el("td", { text: mins ? mins + " min" : "—" }),
        el("td", { text: sf && sf.versions.length ? "yes" : "—" }),
        el("td", { text: pf && pf.versions.length ? "yes" : "—" }),
        el("td", null, [el("button", {
          class: "btn small", text: pf && pf.versions.length ? "Edit note" : "Add note",
          onclick: function () { location.hash = "#/parent/" + l.machine_id; }
        })])
      ]);
    });

    mount(el("div", null, [
      topbar("Grown-ups", { back: { label: "Home", go: function () { location.hash = "#/"; } } }),
      el("div", { class: "wrap" }, [
        el("div", { class: "hero" }, [
          el("div", { class: "kicker parent-badge", text: "Parent area" }),
          el("h1", { text: "Trip record" }),
          el("p", { class: "sub", text: "Everything is stored on this iPad only. Nothing is sent anywhere, and nothing here marks a lesson correct, reviewed or mastered." })
        ]),
        el("div", { class: "card" }, [
          el("h2", { text: "Bring the evidence home" }),
          el("p", { text: "Export one file containing all progress, answers, feedback and timings from this trip. Import it on the Mac with scripts/import_travel_evidence.py." }),
          el("div", { class: "navrow" }, [
            el("button", { class: "btn primary", text: "Export Trip Data", onclick: exportTrip }),
            el("div", { class: "spacer" })
          ]),
          el("p", { class: "footnote", text: "The export contains Caesar’s written answers and your notes. Keep it private — do not put it in Git or upload it anywhere." })
        ]),
        el("div", { class: "card" }, [
          el("h2", { text: "Lessons" }),
          el("div", { class: "scroll-x" }, [
            el("table", { class: "summary" }, [
              el("thead", null, [el("tr", null, [
                el("th", { text: "Lesson" }), el("th", { text: "Status" }), el("th", { text: "Answers" }),
                el("th", { text: "Active" }), el("th", { text: "Child fb" }), el("th", { text: "Your note" }), el("th", { text: "" })
              ])]),
              el("tbody", null, rows)
            ])
          ])
        ])
      ])
    ]));
  }

  function renderParentLesson(mid) {
    var lesson = LESSONS[mid];
    if (!lesson) { location.hash = "#/parent"; return; }
    var rec = fb(mid, "parent");
    var values = Object.assign({}, rec.current);
    var spec = PARENT_COMMON.concat(lesson.subject === "math" ? PARENT_MATH : PARENT_ENGLISH);
    var kids = [
      el("h2", { text: lesson.family_display_label + " — your observation" }),
      el("p", { class: "sub", text: "Optional, and it can be filled in at any time — now, later, or after reopening a finished lesson. It never blocks Caesar." })
    ];
    spec.forEach(function (f) {
      var row = el("div", { class: "chips" });
      function paint() {
        row.innerHTML = "";
        f.options.forEach(function (o) {
          row.appendChild(el("button", {
            class: "chip" + (values[f.key] === o[0] ? " sel" : ""), text: o[1],
            onclick: function () { values[f.key] = o[0]; paint(); save(); }
          }));
        });
      }
      paint();
      kids.push(el("div", { class: "field" }, [el("label", { text: f.label }), row]));
    });
    var ta = el("textarea", { "aria-label": "Note" });
    ta.value = values.optional_note || "";
    var t = null;
    ta.addEventListener("input", function () {
      values.optional_note = ta.value;
      clearTimeout(t); t = setTimeout(save, 700);
    });
    kids.push(el("div", { class: "field" }, [el("label", { text: "Note (optional)" }), ta]));

    var savedMsg = el("div", { class: "saved" });
    function save() {
      saveFeedback(mid, "parent", values, "parent_note").then(function () {
        savedMsg.textContent = "Saved on this iPad";
      });
    }
    kids.push(savedMsg);

    var answers = PACK.lessons && lesson.items ? lesson.items.map(function (it) {
      var parts = [];
      if (it.type === "structured") {
        it.fields.forEach(function (f) {
          var r = responses[respId(mid, it.id, f.key)];
          if (r && r.value !== null && r.value !== "") parts.push(f.label + ": " + (Array.isArray(r.value) ? r.value.join(", ") : r.value));
        });
      } else {
        var r = responses[respId(mid, it.id, null)];
        if (r && r.value !== null && r.value !== "") parts.push(Array.isArray(r.value) ? r.value.join(", ") : String(r.value));
      }
      if (!parts.length) return null;
      var rr = responses[respId(mid, it.id, null)];
      var flag = rr && rr.own_words_flagged;
      return el("tr", null, [
        el("td", { text: it.id.toUpperCase() }),
        el("td", null, [
          el("div", { text: parts.join("\n"), style: "white-space:pre-wrap" }),
          flag ? el("div", { class: "footnote", style: "margin:4px 0 0;color:#b8722a", text: "flagged: " + rr.longest_copied_run_words + " words copied verbatim" }) : null
        ])
      ]);
    }).filter(Boolean) : [];

    mount(el("div", null, [
      topbar("Parent note", { back: { label: "Trip record", go: function () { location.hash = "#/parent"; } } }),
      el("div", { class: "wrap" }, [
        el("div", { class: "card" }, kids),
        answers.length ? el("div", { class: "card" }, [
          el("h2", { text: "What Caesar wrote" }),
          el("div", { class: "scroll-x" }, [
            el("table", { class: "summary" }, [el("tbody", null, answers)])
          ])
        ]) : el("div", { class: "card" }, [el("p", { text: "No answers saved for this lesson yet." })])
      ])
    ]));
  }

  // ---------------------------------------------------------------- export
  function exportTrip() {
    return Promise.all([getAll("lessons"), getAll("responses"), getAll("feedback"), getAll("events")])
      .then(function (r) {
        var payload = {
          schema_version: SCHEMA,
          pack_id: PACK.pack_id,
          pack_title: PACK.pack_title,
          content_version: PACK.content_version,
          exported_at: now(),
          device_note: "Exported from the offline travel PWA. Device state only.",
          governance: {
            done_status: "NOT_DONE", reviewed_status: "NOT_REVIEWED",
            mastery_status: "NOT_SET", automatic_mastery: false, ai_grading: false,
            provenance: "TRAVEL_OFFLINE_IPAD"
          },
          lessons: r[0], responses: r[1], feedback: r[2], events: r[3]
        };
        var name = "caesar-travel-evidence-" + PACK.pack_id + "-" +
          now().replace(/[-:]/g, "").replace(/\..+/, "Z") + ".json";
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
        return logEvent("evidence_exported", { file: name, lessons: r[0].length, responses: r[1].length });
      });
  }
  window.__exportTrip = exportTrip;

  // ---------------------------------------------------------------- router
  function route() {
    var h = location.hash || "#/";
    var m = h.match(/^#\/lesson\/(.+)$/);
    if (m) return renderLesson(decodeURIComponent(m[1]));
    m = h.match(/^#\/parent\/(.+)$/);
    if (m) return renderParentLesson(decodeURIComponent(m[1]));
    if (h.indexOf("#/parent") === 0) return renderParent();
    return renderHome();
  }
  window.addEventListener("hashchange", route);

  loadAll()
    .then(function () {
      return put("kv", { k: "pack", pack_id: PACK.pack_id, content_version: PACK.content_version, schema_version: SCHEMA, first_opened_at: now() });
    })
    .catch(function () { /* storage may be unavailable; the lesson still renders */ })
    .then(function () { route(); });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline install is optional */ });
    });
  }
})();

</script>
</body>
</html>
