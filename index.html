 full turn. If you know all but one of the angles, subtraction gives you the last one. No protractor required.\n\nOne more fact you will need in the challenge: turning 360 degrees puts you back exactly where you began. So a turn of 400 degrees leaves you facing the same way as a turn of 40 degrees, and a turn of 540 leaves you facing the same way as a turn of 180."},{"heading":"Worked Example","body":"Two angles sit on a straight line. One is 65 degrees. Find the other.\n\nThe two together make a half turn, so they add to 180. The missing angle is 180 - 65 = 115 degrees. Check: 65 + 115 = 180. Classify: 65 is acute (under 90) and 115 is obtuse (over 90 but under 180). That pairing makes sense - if one angle on a line is sharp, the other has to be wide to make up the half turn.\n\nThree angles meet at a point and fill it completely: 90, 130 and an unknown. All the way round is 360, so the unknown is 360 - 90 - 130 = 140 degrees. Check: 90 + 130 + 140 = 360.\n\nNotice what you did NOT do: you did not measure anything. The totals did the work."},{"heading":"Common Mistake","body":"Nina draws two angles. Both are 40 degrees, but she draws the arms of the first one twice as long. She says the first angle is bigger.\n\nIt is not. The arms are just how far you chose to draw the lines - you could extend them across the room and the angle would not change by one degree. The angle is the amount of TURN between the two arms, and that turn is 40 degrees in both drawings.\n\nA way to feel this: open a door 40 degrees. Now imagine the door is twice as wide. It is still open by the same amount - a wider door swinging through 40 degrees sweeps a longer path, but the opening angle is identical. Length of arm and size of angle are two different things, and confusing them is the single most common geometry error there is."}],"items":[{"id":"m1","phase":"retrieval","type":"numeric","prompt":"Day 3 retrieval, put to work. What is 1/4 of 360?","answer":90,"hint":"Cut 360 into 4 equal parts.","explanation":"360 divided by 4 = 90. That is why a quarter turn is 90 degrees - the quarter turn IS a quarter of a full turn.","verify":{"kind":"fraction_of","frac":[1,4],"quantity":360,"expect":90}},{"id":"m2","phase":"guided","type":"choice","prompt":"Which of these angles is OBTUSE?","choices":[{"value":"A","text":"45 degrees"},{"value":"B","text":"90 degrees"},{"value":"C","text":"130 degrees"},{"value":"D","text":"180 degrees"}],"answer":"C","hint":"Obtuse means more than a right angle but not yet a straight line.","explanation":"Obtuse is strictly between 90 and 180. 45 is acute, 90 is exactly right, 180 is exactly straight, and only 130 lands in the obtuse band.","verify":{"kind":"angle_class","candidates":{"A":45,"B":90,"C":130,"D":180},"expect_class":"obtuse","expect":["C"]}},{"id":"m3","phase":"guided","type":"numeric","prompt":"Two angles sit together on a straight line. One measures 65 degrees. How many degrees is the other one?","answer":115,"hint":"Angles on a straight line make a half turn.","explanation":"A straight line is 180 degrees, so the missing angle is 180 - 65 = 115. Check: 65 + 115 = 180.","verify":{"kind":"angle_sum","total":180,"known":[65],"expect":115}},{"id":"m4","phase":"guided","type":"structured","prompt":"Three angles meet at one point and fill it completely. Two of them are 90 degrees and 130 degrees. Fill in BOTH boxes.","fields":[{"key":"value","label":"The third angle, in degrees","kind":"numeric","answer":140,"verify":{"kind":"angle_sum","total":360,"known":[90,130],"expect":140}},{"key":"check","label":"Your check - how do you know 140 is right?","kind":"open","rubric":{"should_include":"Adds the three angles back to 360 (90 + 130 + 140 = 360), or reasons that 90 + 130 = 220 leaves 140 of the full turn, or classifies and shows the sizes are consistent with filling one full turn.","sample":"I added them all back: 90 + 130 + 140 = 360, which is one full turn, so it fits exactly with nothing left over.","acceptable_range":"Any verification that could have failed. Adding back to 360 is the natural one.","insufficient":"Repeats the subtraction that produced the answer, or writes only 'because 360'."}}],"hint":"All the way round a point is one full turn.","explanation":"360 - 90 - 130 = 140. Check by adding back: 90 + 130 + 140 = 360."},{"id":"m5","phase":"error_analysis","type":"open","prompt":"Nina draws two 40-degree angles, but she draws the arms of the first one twice as long as the second. She says the first angle is bigger. In one or two sentences, explain why Nina is wrong and say what an angle actually measures.","hint":"If you extended the arms all the way across the room, would the corner get wider?","rubric":{"should_include":"States that an angle measures the amount of TURN (or the opening) between the two arms, not the length of the arms; extending the arms does not change the angle, so both are 40 degrees.","sample":"An angle measures how far you turn between the two arms, not how long you draw them. You could stretch the arms right across the room and the corner would still be open by the same amount, so both angles are 40 degrees.","acceptable_range":"Any clear statement that arm length is irrelevant and that turn or opening is what is measured. A door or clock-hand image is a strong addition.","insufficient":"Says only 'they are both 40' without explaining what an angle measures, or explains without rejecting the arm-length idea."}},{"id":"m6","phase":"independent","type":"multi","prompt":"Select EVERY pair of angles below that could sit together on a straight line.","choices":[{"value":"A","text":"40 degrees and 140 degrees"},{"value":"B","text":"55 degrees and 125 degrees"},{"value":"C","text":"90 degrees and 90 degrees"},{"value":"D","text":"70 degrees and 100 degrees"},{"value":"E","text":"30 degrees and 160 degrees"}],"answer":["A","B","C"],"hint":"Add each pair. Only one total counts.","explanation":"A, B and C each total exactly 180. D totals 170, which leaves a 10-degree gap. E totals 190, which is more than a half turn - the arms would overlap. Two right angles do make a straight line, which is worth noticing.","verify":{"kind":"pair_sum","target":180,"candidates":{"A":[40,140],"B":[55,125],"C":[90,90],"D":[70,100],"E":[30,160]},"expect":["A","B","C"]}},{"id":"m7","phase":"independent","type":"structured","prompt":"You are standing facing NORTH. You turn 90 degrees clockwise, and then turn a further 135 degrees clockwise.","fields":[{"key":"total","label":"Total degrees turned","kind":"numeric","answer":225,"verify":{"kind":"sum","values":[90,135],"expect":225}},{"key":"facing","label":"Which direction are you now facing?","kind":"choice","choices":[{"value":"A","text":"South-east"},{"value":"B","text":"South-west"},{"value":"C","text":"West"},{"value":"D","text":"North-west"}],"answer":"B","verify":{"kind":"turn_compass","start":"N","turns":[90,135],"rotation":"clockwise","expect_facing":"SW"}}],"hint":"90 clockwise from north puts you on east. Then keep going another 135 from there. Each compass point is 45 degrees from its neighbour.","explanation":"90 + 135 = 225 degrees of turning. Starting at north and going clockwise: 90 lands on east, 135 lands on south-east, 180 lands on south, and 225 lands on south-west."},{"id":"m8","phase":"challenge","type":"open","prompt":"CHALLENGE - three parts. There is no protractor and nothing to measure.\n\nFour angles meet at a single point and completely surround it. Three of them are 85 degrees, 100 degrees and 65 degrees.\n\n(a) Find the fourth angle. Then classify all four as acute, right or obtuse, and show one check that your four angles really do surround the point.\n\n(b) Rosa says: 'If I make the 100-degree angle 20 degrees bigger, the fourth angle must get bigger too, because everything around the point is growing.' Explain why Rosa is wrong, and say exactly what the fourth angle becomes and what it is then called.\n\n(c) Starting again from the original four angles, what is the LARGEST whole number of degrees the 100-degree angle could grow to, if the fourth angle must still be obtuse? Explain how you know.","hint":"For (a), all the way round is 360. For (b), ask whether the 360 can change. For (c), work out what the fourth angle needs to be in order to stay obtuse, and then see how much room that leaves.","rubric":{"should_include":"(a) Fourth angle = 360 - 85 - 100 - 65 = 110 degrees. Classifications: 85 acute, 100 obtuse, 65 acute, 110 obtuse. Check: 85 + 100 + 65 + 110 = 360. (b) Rejects Rosa: the total around a point is FIXED at 360 and cannot grow, so if one angle takes 20 more degrees, that 20 must come out of another angle. The fourth angle becomes 110 - 20 = 90 degrees, which is a RIGHT angle. (c) The fourth angle must stay above 90 to be obtuse. With 85 and 65 fixed, the fourth angle is 360 - 85 - 65 - (new angle) = 210 - (new angle). For that to exceed 90, the new angle must be below 120, so the largest whole number is 119 degrees, leaving a fourth angle of 91 degrees, which is still obtuse.","sample":"(a) 360 - 85 - 100 - 65 = 110. So the angles are 85 (acute), 100 (obtuse), 65 (acute) and 110 (obtuse). Check: 85 + 100 + 65 + 110 = 360, exactly one full turn.\n(b) Rosa is wrong because the total around a point cannot change - it is always 360. It is a fixed amount being shared out, so if the 100 takes 20 more degrees, some other angle has to give up 20. The fourth angle goes from 110 down to 90, which makes it exactly a right angle.\n(c) The fourth angle has to stay above 90 to be obtuse. 85 and 65 do not move, and together they take 150, leaving 210 for the other two. So the fourth angle is 210 minus the growing angle. For the fourth to be more than 90, the growing angle has to be less than 120. The largest whole number is 119, and then the fourth angle is 91, which is still obtuse.","acceptable_range":"(a) must reach 110 with correct classifications and a genuine check. (b) must contain the fixed-total argument, not just the number 90. (c) must reach 119; an answer of 120 shows the boundary was included when it should not be, since that would make the fourth angle exactly 90 and therefore right, not obtuse.","insufficient":"Correct numbers with no reasoning in (b); or answering (b) with 'she just is wrong'; or in (c) giving a value without showing what constraint produced it."},"challenge_justification":"Part (a) alone would be practice. Parts (b) and (c) are not. (b) requires reasoning about a CONSERVED total - understanding that a fixed 360 forces a trade-off between angles - which no practice item rehearses, and it rewards the child with a classification change (obtuse becomes right) that only appears if the reasoning is carried through. (c) is a boundary problem: the child must invert the constraint 'fourth angle stays obtuse' into a limit on a different angle, and must handle the strict inequality correctly, where 120 is the tempting wrong answer. This is constraint reasoning and reverse reasoning, not the practice procedure with larger numbers."}],"today_you_learned":"A degree measures turn, not length - Nina's long arms change nothing. One full turn is 360 degrees, a half turn is 180, a quarter turn is 90. Angles are named against those benchmarks: acute below 90, right at exactly 90, obtuse between 90 and 180. Angles on a straight line total 180 and angles around a point total 360, which lets you find a missing angle by subtraction with nothing to measure. And because the total is fixed, making one angle bigger always makes another smaller - the degrees have to come from somewhere.","passage":null,"vocabulary":[]},{"machine_id":"caesar-eng-022-limitations-and-qualified-claims","day":6,"subject":"english","sequence":"022","family_display_label":"English 022","child_title":"What We Don't Know About Purring","estimated_minutes":28,"sections":[{"heading":"Orientation","body":"A vague hedge can have the shape of a limitation while saying nothing useful. A real limitation names the exact thing the evidence fails to show. Today you get the vocabulary to do that - a ladder of strength words, and a short list of the ways evidence usually falls short - and then you practise on a subject where scientists genuinely do not know the answer."},{"heading":"Bridge From Yesterday","body":"Day 5 finished on a hard idea: a study reports what it measured, and cannot rule out what it never saw. That is one limitation - and today it gets a name, along with five others. It is much easier to write a good limitation when you have a list to choose from than when you are hoping something sounds cautious enough."},{"heading":"Teach","body":"First, the LADDER OF STRENGTH. These words are not decoration. Each one makes a different promise.\n\n    POSSIBLE     - nothing rules it out. A very low bar.\n    LIKELY       - the evidence leans this way, but does not settle it.\n    SUPPORTED    - evidence points here and the obvious rivals have been checked.\n    ESTABLISHED  - confirmed so often, by so many people, that it is no longer disputed.\n    PROVEN       - use with great care. In science this is close to established, and most claims never get there.\n\nAnd two words that outrank all of them:\n\n    ALWAYS / NEVER - the strongest claims you can make. A single exception destroys either one. 'Cats purr when happy' survives contact with reality; 'cats ALWAYS purr when happy' is finished the moment one cat purrs at a vet.\n\nSecond, and this is the part that fixes the empty hedge: A LIMITATION HAS A TYPE. When evidence does not carry a claim all the way, it usually fails in one of these six ways.\n\n    ONE CASE            it happened once; once tells you it is possible, not that it is usual\n    TOO FEW             a handful were looked at, which may not represent the rest\n    NO COMPARISON       nothing was measured against anything else, so there is no baseline\n    NOT MEASURED        the thing itself was never measured, only something near it\n    ANOTHER EXPLANATION a rival explanation fits and has not been ruled out\n    NOT THE SAME THING  the evidence is about a different animal, place or situation\n\nA good limitation names the type and then says what specifically is missing. Compare:\n\n    Empty:  'However, this might not be completely true.'\n    Real:   'NO COMPARISON - nobody has measured whether purring cats heal faster than non-purring cats, so the healing idea is untested.'\n\nThe second one tells you what experiment to do next. That is the test of a limitation: does it point at something?"},{"heading":"Worked Example","body":"Claim: 'Purring helps cats heal.'\n\nEvidence: low-frequency vibration has been linked with bone and tissue repair in other contexts, and a purr sits in a similar range.\n\nStrength word: this is POSSIBLE, and arguably LIKELY, but it is certainly not established and nowhere near proven.\n\nLimitation, with a type: NOT THE SAME THING - the vibration evidence comes from other contexts, not from cats. And NO COMPARISON - nobody has measured purring cats against non-purring cats, which is the comparison the claim actually needs.\n\nNow write the whole thing properly:\n\n'It is possible that purring helps cats heal, because purrs vibrate at low frequencies and low-frequency vibration has been linked with tissue repair elsewhere. However, that evidence is not from cats, and nobody has compared the healing of purring cats with non-purring cats, so the idea is proposed rather than established.'\n\nThat is longer than a hedge, and it is worth every word: it says what is claimed, why anyone believes it, exactly what is missing, and what would settle it."}],"items":[{"id":"e1","phase":"retrieval","type":"choice","prompt":"Day 5 retrieval. A vet has seen ONE cat purring while it was injured. What is the strongest conclusion she is entitled to?","choices":[{"value":"A","text":"Cats purr when they are injured."},{"value":"B","text":"At least one cat has purred while injured."},{"value":"C","text":"Purring makes injuries heal."},{"value":"D","text":"Cats never purr when they are happy."}],"answer":"B","hint":"One observation shows something is possible. What does it not show?","explanation":"One case establishes that something happens, not that it is usual - so B is exactly as far as the evidence reaches. A generalises from one animal. C adds a cause nobody has shown. D is an 'always/never' claim contradicted by everyday experience. As it happens, A is true, but it is true because MANY cats have been observed, not because of this one."},{"id":"e2","phase":"guided","type":"choice","prompt":"In this passage, what is the difference between an idea that is PROPOSED and one that is ESTABLISHED?","choices":[{"value":"A","text":"Proposed ideas are false and established ideas are true."},{"value":"B","text":"A proposed idea has been suggested but not shown to be true; an established idea has been confirmed so often it is no longer disputed."},{"value":"C","text":"Proposed ideas are newer and established ideas are older."},{"value":"D","text":"There is no real difference; the words mean the same thing."}],"answer":"B","hint":"The difference is about how much checking has been done, not about age or truth.","explanation":"The words describe how far the evidence has got, not whether the idea is right. A proposed idea may well turn out to be true - it just has not been shown yet. That is why A is wrong: proposed does not mean false. C is a common muddle, since an old idea can still be unproven and a recent one can be firmly established."},{"id":"e3","phase":"guided","type":"multi","prompt":"Select EVERY statement below that the passage treats as ESTABLISHED.","choices":[{"value":"A","text":"Purring is produced in the larynx."},{"value":"B","text":"Purring helps injured cats heal faster."},{"value":"C","text":"Cats purr in frightening situations as well as contented ones."},{"value":"D","text":"Purring is a way a cat calms itself under stress."},{"value":"E","text":"A purr is a very low-frequency sound."}],"answer":["A","C","E"],"hint":"Look at which half of the passage each statement comes from - and at the words used around it.","explanation":"A, C and E all come from WHAT IS ESTABLISHED and are stated plainly. B and D come from WHAT IS STILL OPEN, and the passage flags them with 'proposed', 'may' and 'has not been shown to be true'. D is the sharper distractor, because self-calming is a perfectly reasonable idea - being reasonable and being established are different things."},{"id":"e4","phase":"guided","type":"choice","prompt":"Which strength word fits this claim best: 'Purring helps cats heal'?","choices":[{"value":"A","text":"Proven - the vibration evidence settles it."},{"value":"B","text":"Established - many people believe it."},{"value":"C","text":"Possible - nothing rules it out, and there is a reason to wonder, but the test has not been done."},{"value":"D","text":"Impossible - there is no evidence at all."}],"answer":"C","hint":"There IS a reason to take the idea seriously, and there is also a test nobody has run. Which rung of the ladder is that?","explanation":"C is right on both counts: the low-frequency link gives a genuine reason to wonder, and the direct comparison has not been made. A misuses proven. B confuses how many people believe something with how well it has been checked - the passage is explicit that it has not been shown. D goes too far the other way; there is a reason to wonder, so 'impossible' overstates in the opposite direction."},{"id":"e5","phase":"independent","type":"structured","own_words_required":true,"prompt":"Build a complete qualified claim about purring. All four boxes, in your own words.","fields":[{"key":"claim","label":"Your claim - one sentence","kind":"open","own_words_required":true,"rubric":{"should_include":"A claim drawn from the passage, stated in the child's own words, with a strength word that matches how well the passage supports it.","sample":"It is likely that purring is not only a sign of a happy cat.","acceptable_range":"Any claim the passage speaks to, with an appropriate strength word attached.","insufficient":"Copies a passage sentence; or states an open idea as if it were established."}},{"key":"evidence","label":"Your evidence - what in the passage supports it?","kind":"open","own_words_required":true,"rubric":{"should_include":"Specific support from the passage that genuinely bears on the claim written above.","sample":"The passage says cats purr at the vet, when they are frightened, when they are injured and even when they are dying, and those are not happy situations.","acceptable_range":"Any accurate, specific support that actually backs the stated claim.","insufficient":"Restates the claim; or offers support that does not connect to it."}},{"key":"limit_type","label":"Limitation TYPE - choose the one that fits","kind":"choice","choices":[{"value":"one_case","text":"ONE CASE - it happened once"},{"value":"too_few","text":"TOO FEW - only a handful were looked at"},{"value":"no_comparison","text":"NO COMPARISON - nothing was measured against anything else"},{"value":"not_measured","text":"NOT MEASURED - the thing itself was never measured"},{"value":"another_explanation","text":"ANOTHER EXPLANATION - a rival explanation has not been ruled out"},{"value":"not_same_thing","text":"NOT THE SAME THING - the evidence is about something else"}]},{"key":"limit_text","label":"Now say the limitation in your own words - name what specifically is missing","kind":"open","own_words_required":true,"rubric":{"should_include":"A limitation that names something specific and points at what would be needed to settle it - matching the type selected above. Must not be a content-free hedge.","sample":"NOT MEASURED - the passage says cats purr in all these situations, but nobody has measured what the cat is actually feeling, so we know when they purr without knowing why.","acceptable_range":"Any specific, checkable limitation matching the chosen type. The strongest answers say what evidence would remove the limitation.","insufficient":"Writes a hedge with no content, such as 'this might not be true' or 'it could be something else' - the exact pattern from an earlier lesson that this lesson exists to repair. Also insufficient if the wording does not match the type selected."}}],"hint":"Write the claim first, then the evidence, and only then pick the type. If your limitation could be pasted onto a completely different claim without changing a word, it is too vague - make it specific to yours."},{"id":"e6","phase":"error_analysis","type":"open","prompt":"A pet website says: 'A purring cat is a happy cat.' In one or two sentences of your own, explain why the passage makes this an overclaim, and name which limitation type applies.","hint":"Where else does the passage say cats purr? And is 'happy' something anyone has measured?","rubric":{"should_include":"States that cats also purr while frightened, injured, at the vet, giving birth and while dying, so purring cannot be read as a reliable sign of happiness. Names a limitation type - ANOTHER EXPLANATION (stress or calming fits the same purring just as well) or NOT MEASURED (nobody has measured what the cat feels, only when it purrs).","sample":"It is an overclaim because the passage says cats also purr when they are frightened, hurt, or on a vet's table, and none of those is happy. ANOTHER EXPLANATION - a cat purring to calm itself down fits the same behaviour just as well, and that has not been ruled out.","acceptable_range":"Either ANOTHER EXPLANATION or NOT MEASURED is a correct type here if the reasoning matches it. The counterexamples from the passage must be present.","insufficient":"Says only 'that is not always true' without giving the counterexamples; or names a limitation type that does not fit what was written."}},{"id":"e7","phase":"independent","type":"choice","prompt":"Which limitation type best fits this statement? 'Low-frequency vibration has been linked with bone repair, so purring must repair cats' bones.'","choices":[{"value":"A","text":"ONE CASE - it only happened once."},{"value":"B","text":"NOT THE SAME THING - the vibration evidence is not from cats, so it may not carry across."},{"value":"C","text":"TOO FEW - not enough cats were studied."},{"value":"D","text":"There is no limitation; the reasoning is sound."}],"answer":"B","hint":"Where did the vibration evidence come from? Was it cats?","explanation":"The passage says the vibration link comes from other contexts, not from cats - so the evidence is about something else and may or may not transfer. That is NOT THE SAME THING. A and C both describe problems with a study of cats, and the trouble here is that there was no study of cats at all. NO COMPARISON would also be a fair answer for a different reason, but B names the specific gap in the reasoning as written."},{"id":"e8","phase":"challenge","type":"open","prompt":"CHALLENGE - three parts.\n\nA magazine prints this sentence:\n\n    'Scientists have proved that a cat's purr always heals broken bones, which is why cats recover from injuries faster than any other pet.'\n\n(a) Rewrite it so that it keeps everything the passage supports and removes everything it does not. IMPORTANT: you may only DELETE and soften - you may not add any new fact.\n\n(b) List every separate overclaim you removed, and name the limitation type for each one.\n\n(c) Now a different problem. The sentence 'Cats purr when they are content' is TRUE. Explain why it is still not the whole truth, and write a version that is.","hint":"For (a) and (b), go through the sentence word by word and stop at every word that makes a promise: 'proved', 'always', 'heals', 'faster than any other pet'. Each one is a separate claim needing separate evidence. For (c), true and complete are not the same thing.","rubric":{"should_include":"(a) A rewrite reduced to roughly: 'It has been suggested that a cat's purr may help healing.' Everything about proof, always, broken bones specifically, and the comparison with other pets must be gone. (b) Four separate overclaims, each with a type: 'proved' - the idea is proposed, not established (NO COMPARISON, since the direct test has not been done); 'always' - a universal claim that a single exception would destroy and that nothing supports; 'heals broken bones' - the vibration evidence was not about cats (NOT THE SAME THING), and no such healing has been shown in cats; 'faster than any other pet' - nobody has measured cats against other pets at all (NO COMPARISON). (c) The sentence is true but incomplete: cats also purr when frightened, injured, at the vet, giving birth and dying, so contentment is one occasion among several. A better version names more than one situation - for example 'Cats purr when they are content, and also when they are frightened, injured or being examined.'","sample":"(a) It has been suggested that a cat's purr may help with healing.\n(b) I removed four things. 'Proved' - nobody has shown it; the passage says it has not been shown to be true, because the comparison has never been done (NO COMPARISON). 'Always' - that is the strongest word there is and one cat that did not heal would destroy it; nothing in the passage supports it. 'Heals broken bones' - the bone repair evidence was not from cats at all (NOT THE SAME THING). 'Faster than any other pet' - nobody has ever measured cats against other pets (NO COMPARISON).\n(c) It is true but it is only part of the story. Cats also purr when they are frightened, when they are injured, when they are at the vet and even when they are dying, so contentment is just one of the times it happens. A fuller version: 'Cats purr when they are content, but also when they are frightened, injured or in pain, so a purr on its own does not tell you how a cat feels.'","acceptable_range":"(a) must remove all four overclaims and must not introduce a new fact. (b) must identify at least three of the four overclaims with a plausible type for each. (c) must state that the sentence is true but incomplete and must supply a fuller version. Slight variation in which type is assigned to which overclaim is acceptable where more than one genuinely applies.","insufficient":"(a) softening the sentence by adding hedging words while keeping the claims - for example 'Scientists may have proved that a purr sometimes heals bones' - which is the exact empty-hedge habit this lesson is repairing; (b) listing overclaims without naming types; (c) answering that the sentence is false, when it is true."},"challenge_justification":"The instruction to DELETE rather than hedge is what makes this hard, and it is aimed precisely at the failure recorded in an earlier lesson, where the limitation was hedge-shaped and empty. Adding 'may' to a false claim is easy; identifying that a sentence contains four separate promises, each needing its own evidence, and cutting exactly the unsupported ones, is not. Part (c) then reverses the task: instead of a false sentence to cut down, he is handed a TRUE sentence and must explain why truth is not sufficiency - a distinction no practice item rehearses."}],"today_you_learned":"Claims have strengths, and the words matter: possible, likely, supported, established - with 'always' and 'never' the strongest of all, destroyed by a single exception. A limitation is not a hedge. It has a type - ONE CASE, TOO FEW, NO COMPARISON, NOT MEASURED, ANOTHER EXPLANATION, NOT THE SAME THING - and it names the specific thing the evidence fails to show. The test is whether your limitation points at something: if it could be pasted onto any other claim without changing a word, it is not a limitation, it is just a noise that sounds careful. And a sentence can be entirely true and still not be the whole truth.","passage":{"title":"What We Don't Know About Purring","structure":"two_columns_established_versus_open","approx_words":310,"blocks":[{"kind":"heading","text":"WHAT IS ESTABLISHED"},{"kind":"para","text":"A cat's purr is made in the larynx, the part of the throat that also produces its voice. Muscles there open and close very rapidly while the cat breathes, so the sound continues on the way in and on the way out. That is why a purr can run on and on without a break, unlike almost any other animal noise."},{"kind":"para","text":"The sound is very low. Purring sits near the bottom of the range of sounds people can hear - a deep, slow vibration you can feel in your hand as much as hear."},{"kind":"para","text":"And cats do not only purr when they are content. Cats purr while being examined by a vet, while frightened, while injured, while giving birth, and sometimes while dying. This has been observed many times by many people and is not in dispute."},{"kind":"heading","text":"WHAT IS STILL OPEN"},{"kind":"para","text":"Nobody can say with confidence what purring is FOR. If it meant contentment, a cat would not purr on a vet's table. Several ideas have been proposed. Purring may be a signal asking for care or attention. It may be a way a cat calms itself under stress. It may be both, in different situations."},{"kind":"para","text":"One idea has attracted particular interest. Vibrations at low frequencies have been linked, in other contexts, with the repair of bone and tissue, and a cat's purr sits in a similar range. From this, some have suggested that purring might help a cat heal. It is a genuinely interesting suggestion. It has not been shown to be true. Nobody has demonstrated that a purring cat heals faster than a cat that is not purring, and until someone compares those two things directly, the idea remains proposed rather than established."}]},"vocabulary":[{"term":"larynx","gloss":"the part of the throat that makes sound; the voice box"},{"term":"frequency","gloss":"how fast a sound vibrates - low frequency means a deep sound"},{"term":"proposed","gloss":"suggested as a possible explanation, but not yet shown to be true"},{"term":"established","gloss":"confirmed so many times that it is no longer seriously disputed"}]},{"machine_id":"caesar-math-022-area-perimeter-constraints","day":6,"subject":"math","sequence":"022","family_display_label":"Math 022","child_title":"Same Area, Different Perimeter","estimated_minutes":28,"sections":[{"heading":"Orientation","body":"Two rectangles can hold exactly the same amount of ground and need completely different amounts of fence. That sounds impossible until you see it, and once you see it you cannot unsee it. Today is about the two measurements that shapes carry around - how much is inside, and how far it is around the edge - and the fact that they do not travel together."},{"heading":"Bridge From Yesterday","body":"Day 5 was your first geometry lesson: degrees measure turn, and fixed totals (180 on a line, 360 around a point) let you find what you cannot measure. Today a different total gets fixed - sometimes the area, sometimes the perimeter - and the same style of thinking applies: when a total is locked, the parts have to trade against each other."},{"heading":"Teach","body":"AREA is how much surface is inside. For a rectangle it is length x width, and it is counted in square units: square centimetres, square metres.\n\nPERIMETER is the distance all the way around the edge. For a rectangle it is length + width + length + width, or more quickly 2 x (length + width). It is counted in ordinary units: centimetres, metres.\n\nThey answer different questions. Area is how much turf you need to cover the garden. Perimeter is how much fence you need to go round it. There is no reason those two should rise and fall together, and they do not.\n\nHere are three rectangles, all with area 36:\n\n    1 by 36  ->  perimeter 2 x (1 + 36)  = 74\n    4 by 9   ->  perimeter 2 x (4 + 9)   = 26\n    6 by 6   ->  perimeter 2 x (6 + 6)   = 24\n\nSame amount of ground. The first needs THREE TIMES the fence of the last. Long and thin has a huge edge for its size; square-ish is efficient.\n\nNow lock the perimeter instead. Three rectangles, all with perimeter 20 (so length + width = 10):\n\n    1 by 9  ->  area 9\n    3 by 7  ->  area 21\n    5 by 5  ->  area 25\n\nSame fence. The square holds nearly three times as much ground as the long thin one.\n\nThe pattern in both directions is the same: for rectangles, the closer to a square, the more efficient - most area for a given fence, least fence for a given area. Long and thin is always the wasteful extreme.\n\nOne more tool. If you know the area and one side, the other side is found by dividing: a rectangle of area 48 with one side 6 has its other side at 48 divided by 6 = 8. Because the sides multiply to the area, whole-number sides must be FACTORS of the area. That fact is doing quiet work in today's challenge."},{"heading":"Worked Example","body":"A rectangle is 3 by 8.\n\nArea = 3 x 8 = 24 square units.\nPerimeter = 2 x (3 + 8) = 2 x 11 = 22 units.\n\nNow compare it with a 4 by 6 rectangle.\nArea = 4 x 6 = 24 square units - the same.\nPerimeter = 2 x (4 + 6) = 20 units - smaller.\n\nSo two rectangles with identical areas differ in perimeter by 2 units, and the one closer to a square is the shorter fence. Check the numbers rather than trusting the pattern: 3 x 8 = 24 and 4 x 6 = 24, so the areas really are equal; 22 is not 20, so the perimeters really are not."},{"heading":"Common Mistake","body":"Tom says: 'A rectangle with a bigger area must have a bigger perimeter. More space means more edge.'\n\nOne counterexample destroys this. Take a 1 by 10 rectangle: area 10, perimeter 22. Take a 5 by 5 square: area 25, perimeter 20. The square has more than twice the area and LESS perimeter.\n\nTom's error is assuming two different measurements must move together. They are measuring different things - one counts inside, one counts edge - and a long thin shape is nearly all edge and hardly any inside. When someone states a rule like Tom's, the fastest test is not to argue: it is to hunt for one case where it fails."}],"items":[{"id":"m1","phase":"retrieval","type":"choice","prompt":"Spaced retrieval, in error-analysis form. Ben writes: 'The tickets went up by a multiplier of 1.08, so the rate of increase is 1.08%.' Which correction is right?","choices":[{"value":"A","text":"The rate of increase is 8%."},{"value":"B","text":"The rate of increase is 108%."},{"value":"C","text":"The rate of increase is 0.08%."},{"value":"D","text":"Ben is right - the multiplier and the rate are the same number."}],"answer":"A","hint":"The rate is the distance from 1, not the multiplier itself.","explanation":"The multiplier 1.08 means the new price is 108% of the old. The rate is how far that sits from 1: 1.08 - 1 = 0.08 = 8%. Choice B mistakes the multiplier read as a percent for the rate; choice D is the confusion this thread has been repairing all week.","verify":{"kind":"multiplier_to_rate","multiplier":1.08,"direction":"increase","expect_rate_percent":8}},{"id":"m2","phase":"retrieval","type":"numeric","prompt":"Day 5 retrieval. Two angles sit together on a straight line. One is 118 degrees. How many degrees is the other?","answer":62,"hint":"A straight line is a half turn.","explanation":"180 - 118 = 62. Check: 118 + 62 = 180.","verify":{"kind":"angle_sum","total":180,"known":[118],"expect":62}},{"id":"m3","phase":"guided","type":"structured","prompt":"A rectangle measures 3 metres by 8 metres.","fields":[{"key":"area","label":"Area, in square metres","kind":"numeric","answer":24,"verify":{"kind":"rect_area","sides":[3,8],"expect":24}},{"key":"perimeter","label":"Perimeter, in metres","kind":"numeric","answer":22,"verify":{"kind":"rect_perimeter","sides":[3,8],"expect":22}}],"hint":"Area multiplies the two sides. Perimeter walks all the way round: 2 x (3 + 8).","explanation":"Area = 3 x 8 = 24 square metres. Perimeter = 2 x (3 + 8) = 22 metres. The units are different on purpose: square metres cover, metres go round."},{"id":"m4","phase":"guided","type":"choice","prompt":"Two vegetable beds both have an area of 36 square metres. One is 6 m by 6 m, the other is 4 m by 9 m. Which needs MORE fencing?","choices":[{"value":"A","text":"The 6 by 6 bed"},{"value":"B","text":"The 4 by 9 bed"},{"value":"C","text":"They need the same, because the areas are equal"}],"answer":"B","hint":"Work out both perimeters. Equal areas do not force equal perimeters.","explanation":"6 by 6 has perimeter 2 x 12 = 24 m. 4 by 9 has perimeter 2 x 13 = 26 m. The 4 by 9 bed needs 2 more metres of fence for exactly the same amount of ground, because it is further from a square. Choice C is the belief this lesson exists to break.","verify":{"kind":"perimeter_compare","candidates":{"A":[6,6],"B":[4,9]},"expect_larger":"B"}},{"id":"m5","phase":"error_analysis","type":"open","prompt":"Tom says: 'A rectangle with a bigger area must always have a bigger perimeter.' Prove Tom wrong by giving TWO specific rectangles, with their areas and perimeters, where the one with the bigger area has the SMALLER perimeter. Then say in one sentence why this is possible.","hint":"Try a very long thin rectangle against a square. Long thin shapes are almost all edge.","rubric":{"should_include":"Two concrete rectangles with dimensions, areas and perimeters, where area(A) > area(B) but perimeter(A) < perimeter(B). The lesson's pair works: 5 by 5 (area 25, perimeter 20) against 1 by 10 (area 10, perimeter 22). Plus a reason: area and perimeter measure different things, and a long thin shape has a very large edge for the small amount of space inside it.","sample":"A 5 by 5 square has area 25 and perimeter 20. A 1 by 10 rectangle has area 10 and perimeter 22. The square has more than twice the area but a smaller perimeter. This is possible because perimeter measures the edge and area measures the inside, and a long thin rectangle is almost all edge with very little inside.","acceptable_range":"Any correct counterexample pair with all four numbers stated and a reason that distinguishes edge from inside. The numbers must actually check out.","insufficient":"Says Tom is wrong without a counterexample; gives shapes without their areas and perimeters; or gives a pair where the claim does not actually fail."}},{"id":"m6","phase":"independent","type":"multi","prompt":"Select EVERY rectangle below that has a perimeter of exactly 20 units.","choices":[{"value":"A","text":"1 by 9"},{"value":"B","text":"3 by 7"},{"value":"C","text":"4 by 5"},{"value":"D","text":"5 by 5"},{"value":"E","text":"2 by 9"}],"answer":["A","B","D"],"hint":"Perimeter 20 means the two different sides must add to 10.","explanation":"Perimeter 20 means length + width = 10. A gives 1 + 9 = 10, B gives 3 + 7 = 10, D gives 5 + 5 = 10 - all correct. C gives 4 + 5 = 9, so its perimeter is 18. E gives 2 + 9 = 11, so its perimeter is 22. Notice the areas of the three correct ones: 9, 21 and 25. Same fence, very different amounts of ground.","verify":{"kind":"perimeter_set","target":20,"candidates":{"A":[1,9],"B":[3,7],"C":[4,5],"D":[5,5],"E":[2,9]},"expect":["A","B","D"]}},{"id":"m7","phase":"independent","type":"structured","prompt":"A rectangular courtyard has an area of 48 square metres. One side measures 6 metres.","fields":[{"key":"side","label":"The other side, in metres","kind":"numeric","answer":8,"verify":{"kind":"missing_side","area":48,"known_side":6,"expect":8}},{"key":"perimeter","label":"The perimeter, in metres","kind":"numeric","answer":28,"verify":{"kind":"rect_perimeter","sides":[6,8],"expect":28}}],"hint":"The sides multiply to give the area, so divide to get the missing one.","explanation":"48 divided by 6 = 8 metres. Then perimeter = 2 x (6 + 8) = 28 metres. Check the area back: 6 x 8 = 48."},{"id":"m8","phase":"challenge","type":"open","prompt":"CHALLENGE. A rectangular vegetable bed must have an area of exactly 36 square metres, and both side lengths must be whole numbers of metres. A bed that is 4 by 9 counts as the SAME bed as one that is 9 by 4.\n\n(a) List EVERY possible bed.\n(b) Give the perimeter of each one.\n(c) Explain how you KNOW your list is complete - that there is no bed you have missed. 'I could not think of any more' is not an explanation.\n(d) Which bed uses the least fencing? State the general rule your list suggests about which shape needs the least fence for a fixed area.","hint":"Both sides multiply to 36, so each side must be a factor of 36. Write out all the factors of 36 in order, then pair them up from the outside in. Ask yourself when the pairs start repeating, and why that is the moment to stop.","rubric":{"should_include":"(a) All five beds: 1 by 36, 2 by 18, 3 by 12, 4 by 9, 6 by 6. (b) Perimeters 74, 40, 30, 26, 24 respectively. (c) A real completeness argument: both sides must be whole-number FACTORS of 36; the factors of 36 are 1, 2, 3, 4, 6, 9, 12, 18, 36; pairing each factor with its partner produces exactly these five, and once you pass 6 the pairs simply repeat in the other order (9 by 4 is the same bed as 4 by 9), so 6 by 6 is where the list closes. (d) 6 by 6, using 24 m. Rule: for a fixed area, the closer a rectangle is to a square, the smaller its perimeter; long thin rectangles need the most fence.","sample":"(a) and (b):\n1 by 36, perimeter 74\n2 by 18, perimeter 40\n3 by 12, perimeter 30\n4 by 9, perimeter 26\n6 by 6, perimeter 24\n(c) Both sides multiply to 36, so both sides have to be factors of 36. The factors of 36 are 1, 2, 3, 4, 6, 9, 12, 18 and 36. I paired each one with the number it needs to reach 36: 1 with 36, 2 with 18, 3 with 12, 4 with 9, 6 with 6. After 6 the pairs start repeating backwards - 9 goes with 4, which is a bed I already have - so there is nothing new left. That is every factor checked, so the list is complete.\n(d) The 6 by 6 bed, at 24 metres of fence. The rule is that for a fixed area, the nearer the rectangle is to a square the less fence it needs, and the longer and thinner it is the more fence it needs.","acceptable_range":"(a) and (b) must be exactly the five beds with correct perimeters. (c) must contain a genuine reason for completeness - the factor argument is the expected one, and any equivalent systematic sweep (checking every whole number from 1 up to 6 and showing why nothing beyond 6 can be new) is fully acceptable. (d) must identify 6 by 6 and state the square rule.","insufficient":"A correct list with (c) answered as 'I tried them all' or 'I could not find any more'; missing 1 by 36 (commonly forgotten); listing 9 by 4 and 4 by 9 as two separate beds; or stating the rule in (d) without the list supporting it."},"challenge_justification":"Practice items in this lesson hand the child a rectangle and ask for a measurement. This item reverses that and adds a completeness burden: the child must generate the entire solution set from a constraint, and then PROVE nothing is missing. Part (c) is the real work and cannot be reached by any procedure in the lesson - it requires connecting whole-number sides to factors and recognising why the factor pairs stop producing new rectangles at the square root. Part (d) then requires generalising from the data he has produced. Constraint search, completeness argument and generalisation, none of which appear in M1-M7."}],"today_you_learned":"Area counts the inside and perimeter counts the edge, and they do not move together. Give two rectangles the same area and their perimeters can differ enormously; give them the same perimeter and their areas can differ enormously. In both directions the square is the efficient extreme - least fence for a given area, most area for a given fence - and long thin rectangles are the wasteful extreme. Because whole-number sides must multiply to the area, they have to be factors of it, which is what lets you list every possible rectangle and know that you have them all.","passage":null,"vocabulary":[]},{"machine_id":"caesar-eng-023-two-source-synthesis","day":7,"subject":"english","sequence":"023","family_display_label":"English 023","child_title":"Dust From the Sahara","estimated_minutes":30,"sections":[{"heading":"Orientation","body":"Last day. Everything from this week arrives at once. You have two sources that do not mention each other, and a question that neither can answer alone. The task is to join them into one short explanation - four sentences at most. That limit is not there to make it easy. It is there because a good explanation is usually shorter than a bad one."},{"heading":"Bridge From The Whole Week","body":"Day 1: separate what was observed from what was worked out. Day 2: judge how well evidence supports the exact claim. Day 3: say who knows a thing and how. Day 4: check the chain has no gaps. Day 5: work out which question each source actually answers. Day 6: attach the right strength word and name the limitation type. Today you use all six at once, in four sentences."},{"heading":"Teach","body":"SYNTHESIS is joining sources into one explanation. It is not summarising both and putting them next to each other - that is a list. Synthesis means each source supplies a piece the other one lacks, and the pieces lock together.\n\nA synthesis needs four things, and they have a natural order.\n\n    CLAIM         - the explanation itself, in one sentence, with a strength word that fits\n    EVIDENCE A    - the piece Source A supplies, attributed to Source A\n    EVIDENCE B    - the piece Source B supplies, attributed to Source B\n    LIMITATION    - what this explanation still does not settle, with its type named\n\nAttribution matters here more than anywhere else this week. If you write it all as one blur, nobody can tell which part rests on satellite measurements and which part rests on soil chemistry - and a reader who cannot tell cannot check you.\n\nThe test that the sources really are locked together: cover one of them with your hand. If the explanation still stands, you have not synthesised - you have decorated one source with the other. Cover Source A here and you have a forest losing phosphorus with no idea what replaces it. Cover Source B and you have dust crossing an ocean for no particular reason. Each one is genuinely half an answer.\n\nAnd the strength word must be earned. Both measurements are real, and the two figures being close is a striking fit. But 'the dust replaces the phosphorus' is SUPPORTED, not PROVEN. Two numbers matching is powerful evidence and it is not the same as watching a phosphorus atom leave Chad and enter a tree."},{"heading":"Worked Example - a synthesis about something else","body":"Two sources. Source X: a city's night-time street lighting was measured and found to have brightened sharply over twenty years. Source Y: moths in the same region were counted over the same period, and their numbers fell; moths navigate by light and are drawn off course by bright lamps.\n\nA bad answer, which is a list: 'Source X says lights got brighter. Source Y says moths declined and moths navigate by light.' Two summaries side by side. Nothing is joined.\n\nA synthesis: 'It is likely that brighter street lighting has contributed to the fall in moth numbers. Source X shows that night-time lighting in the region rose sharply over twenty years. Source Y shows that moth numbers fell over the same period and that moths navigate by light, which gives a reason why brighter lamps would harm them. However, ANOTHER EXPLANATION has not been ruled out - other things also changed over twenty years, and nobody has compared moth numbers between brightly lit and darker areas.'\n\nFour sentences. Claim with a strength word, one piece from each source with the source named, and a limitation with a type. Cover either source and it collapses - which is how you know it is a synthesis."}],"items":[{"id":"e1","phase":"retrieval","type":"choice","prompt":"Day 6 retrieval. Which strength word best fits: 'Saharan dust replaces the phosphorus that Amazon rain washes away'?","choices":[{"value":"A","text":"Proven - the two measurements match, so it is settled."},{"value":"B","text":"Supported - two separate measurements fit together well, but nobody has followed the phosphorus itself from Africa into the forest."},{"value":"C","text":"Possible - there is no real evidence either way."},{"value":"D","text":"Always - it happens every single year without variation."}],"answer":"B","hint":"Two independent measurements agreeing is strong. Is it the same as watching it happen?","explanation":"B is right: two independently measured quantities matching is genuine support, and it stops short of proof because nobody has traced the phosphorus itself along the route. A overstates. C understates badly - there is a great deal of evidence. D is contradicted by Source A, which says the amount varies enormously from year to year."},{"id":"e2","phase":"guided","type":"choice","prompt":"Source A calls the twenty-eight million tonne figure an ESTIMATE. What does that tell you?","choices":[{"value":"A","text":"The researchers were guessing."},{"value":"B","text":"It is a careful approximate figure, not an exact measurement, and the real amount varies from year to year."},{"value":"C","text":"The figure is probably wrong."},{"value":"D","text":"The figure will be exact once better satellites are built."}],"answer":"B","hint":"The passage says the researchers were careful to use that word, and then tells you why.","explanation":"An estimate is a careful approximation, and calling it one is honesty rather than weakness. A and C treat 'estimate' as an admission of failure, which it is not. D misses the real reason: the quantity is not fixed, so no instrument could ever make it exact - a year genuinely can be far above or far below the average."},{"id":"e3","phase":"guided","type":"multi","prompt":"Select EVERY statement below that comes from SOURCE A only.","choices":[{"value":"A","text":"Much of the dust comes from a dried lake bed in Chad."},{"value":"B","text":"Amazon soil loses phosphorus to heavy rain."},{"value":"C","text":"Roughly twenty-eight million tonnes of dust reaches the Amazon in a year."},{"value":"D","text":"Plants cannot grow without phosphorus."},{"value":"E","text":"Some of the dust falls on southern Europe."}],"answer":["A","C","E"],"hint":"Source A is the one with satellites in it. Source B is the one with soil in it.","explanation":"A, C and E are all in the satellite source - where the dust comes from, how much arrives, and where else it lands. B and D belong to the soil source. Keeping track of which source said what is what makes attribution possible when you write."},{"id":"e4","phase":"guided","type":"choice","prompt":"Which question needs BOTH sources to answer it?","choices":[{"value":"A","text":"Where does most of the Saharan dust come from?"},{"value":"B","text":"Why does an Amazon rainforest depend on an African desert?"},{"value":"C","text":"What mineral do plants need in order to grow?"},{"value":"D","text":"How much dust reaches the Amazon each year?"}],"answer":"B","hint":"Three of these can be answered by pointing at one source. One of them cannot.","explanation":"A and D are answered by Source A alone; C is answered by Source B alone. Only B needs the dust delivery from one source AND the phosphorus loss from the other. That is what a synthesis question looks like: no single source can be pointed at."},{"id":"e5","phase":"independent","type":"open","prompt":"In one or two sentences of your own: if you had ONLY Source B, what would be missing from your understanding of the Amazon's phosphorus?","hint":"Source B tells you what the forest loses. What does it not tell you?","rubric":{"should_include":"States that Source B alone shows the forest continuously losing phosphorus with no account of what replaces it - it would leave you unable to explain how the forest keeps growing, or where any replacement comes from.","sample":"On its own, Source B only tells me the forest keeps losing phosphorus down the rivers. It never says anything gets put back, so I would not be able to explain how the trees keep growing at all.","acceptable_range":"Any answer identifying the missing replacement or resupply. Noting the puzzle it creates - a forest that should have run out - is a strong addition.","insufficient":"Says 'it would be incomplete' without naming what is missing; or describes Source A's contents rather than Source B's gap."}},{"id":"e6","phase":"independent","type":"structured","own_words_required":true,"prompt":"Write the synthesis. FOUR SENTENCES MAXIMUM in total across the boxes - that is a cap, not a target. Your own words throughout.","fields":[{"key":"claim","label":"CLAIM - one sentence, with a strength word that fits","kind":"open","own_words_required":true,"rubric":{"should_include":"A single-sentence explanation joining the two sources - dust blown from the Sahara delivers phosphorus that replaces what Amazon rain washes out of the soil - carrying an appropriate strength word such as 'it is supported that' or 'the evidence supports'.","sample":"The evidence supports the idea that dust blown across the Atlantic from the Sahara keeps the Amazon growing by replacing the phosphorus its rain washes away.","acceptable_range":"Any accurate joined claim with a defensible strength word. 'Proven' is too strong; 'possible' is too weak.","insufficient":"Summarises only one source; omits any strength word; or copies the passage."}},{"key":"evidence_a","label":"EVIDENCE FROM SOURCE A - one sentence, and say it is from Source A","kind":"open","own_words_required":true,"rubric":{"should_include":"Attributes to Source A the satellite finding that large quantities of Saharan dust cross the Atlantic and settle over the Amazon - roughly twenty-eight million tonnes a year as an estimate.","sample":"Source A shows, using satellites, that around twenty-eight million tonnes of Saharan dust settles over the Amazon in a year.","acceptable_range":"Any accurate Source A content, explicitly attributed.","insufficient":"Gives the content without attributing it, or attributes Source B's content to Source A."}},{"key":"evidence_b","label":"EVIDENCE FROM SOURCE B - one sentence, and say it is from Source B","kind":"open","own_words_required":true,"rubric":{"should_include":"Attributes to Source B the soil finding that Amazon rain washes phosphorus out of the soil and that the phosphorus arriving in the dust is roughly enough to replace it.","sample":"Source B shows that Amazon rain washes phosphorus out of the soil, and that the phosphorus in the dust is roughly enough to replace what is lost.","acceptable_range":"Any accurate Source B content, explicitly attributed.","insufficient":"Content unattributed, or the two sources swapped."}},{"key":"limitation","label":"LIMITATION - one sentence, with its TYPE named","kind":"open","own_words_required":true,"rubric":{"should_include":"A specific limitation with a named type. Good options: NOT MEASURED - nobody has followed the phosphorus itself from Chad into a tree, so the link rests on two figures matching rather than on tracing the route; or the dust figure is an estimate that varies enormously year to year, so a match on average does not mean a match in any particular year.","sample":"NOT MEASURED - nobody has actually followed the phosphorus from Africa into an Amazon tree, so this rests on two separate figures happening to match rather than on anyone tracing the route.","acceptable_range":"Any genuine, specific limitation with a plausible type attached.","insufficient":"An empty hedge such as 'this might not be true' or 'there could be other reasons' with nothing specific named - the an earlier lesson pattern. Also insufficient if no type is given."}}],"hint":"Write the claim last if that helps - work out what the two sources jointly show, then say it. Before you finish, cover Source A with your hand and check your explanation actually falls over. If it still stands, you have not joined them."},{"id":"e7","phase":"independent","type":"choice","prompt":"Source A says the amount of dust varies enormously from year to year. Which limitation does that place on the explanation?","choices":[{"value":"A","text":"ONE CASE - the dust was only measured once."},{"value":"B","text":"The figure is an average, so the balance between dust and phosphorus loss may hold over many years without holding in any particular year."},{"value":"C","text":"NOT THE SAME THING - the dust is not really from the Sahara."},{"value":"D","text":"There is no limitation; an average is as good as an exact figure."}],"answer":"B","hint":"If a number bounces around a lot, what is the average actually telling you about any single year?","explanation":"B names the real limitation: matching averages do not guarantee a match in a given year, and a run of low-dust years could leave the forest short even though the long-run figures line up. A is false - the satellite work tracked dust over many years, which is how the variation was noticed at all. C contradicts the source. D is the overconfident reading this lesson is guarding against."},{"id":"e8","phase":"challenge","type":"open","prompt":"CHALLENGE - three parts.\n\n(a) What would have to be true for the combined explanation to be WRONG? Give TWO different discoveries that would undermine it - one that would come from Source A's side, and one that would come from Source B's side.\n\n(b) A friend says: 'So if the Sahara stopped producing dust, the Amazon would die.' Explain what is wrong with the STRENGTH of that claim, and write a version you could actually defend.\n\n(c) Saharan dust also falls on Spain, where it is called calima. Does that fact SUPPORT the explanation, WEAKEN it, or NEITHER? Explain your answer.","hint":"For (a), think about what each source would have to be wrong about. For (b), look at the words 'stopped' and 'die' and ask what evidence you have about either. For (c), remember Day 2 - a fact can be true, interesting, and about a different claim entirely.","rubric":{"should_include":"(a) TWO discoveries, one per source. From Source A's side: that the dust does not actually reach the Amazon in the quantities estimated, that it comes from somewhere else, or that most of it falls into the ocean before arriving. From Source B's side: that the dust's phosphorus is in a form plants cannot take up, that the forest has another and larger source of phosphorus, or that the loss figure was measured wrongly. (b) The claim overstates in at least two ways. 'Stopped' is an extreme that nothing in the sources speaks to, and 'would die' is an outcome nobody has observed or tested - Day 6's ladder puts this at possible at best, not established, and it also ignores that the forest might have other phosphorus sources not covered by these two sources. A defensible version: 'If Saharan dust stopped arriving, the Amazon would probably lose phosphorus faster than it is replaced, which over a long time could reduce its growth.' (c) NEITHER, or at most weak support for one small part. It confirms Source A's claim that Saharan dust travels great distances, which is a real if minor contribution. It says nothing at all about phosphorus, about Amazon soil, or about the forest - so it does not support the combined explanation, and it certainly does not weaken it. This is Day 2's trap: a true and interesting fact that belongs to a neighbouring claim.","sample":"(a) From Source A's side, it would be wrong if someone measured properly and found that most of the dust falls into the ocean and hardly any reaches the forest. From Source B's side, it would be wrong if the phosphorus in the dust turned out to be in a form the plants cannot actually absorb, so it lands there and does nothing.\n(b) 'Stopped' and 'would die' are both far too strong. Nobody has ever seen the Sahara stop making dust, so there is no evidence about what happens then, and nothing in either source says the forest dies without it - Source B only says the dust roughly replaces what is lost. A version I could defend: 'If Saharan dust stopped reaching the Amazon, the forest would probably start losing phosphorus faster than it gets replaced, and over a long time that could slow its growth.'\n(c) Neither, really. It does back up the part of Source A that says this dust travels a very long way, so it is a small piece of support for that. But it says nothing about phosphorus or about the Amazon at all, so it does not support the explanation as a whole. It is a true fact about a different claim.","acceptable_range":"(a) must give two genuinely different discoveries, correctly attached to the two sources; either may be phrased loosely as long as it would really undermine the explanation. (b) must identify at least one overclaimed word and supply a defensible rewrite. (c) 'Neither' or 'weak support for one part only' both count as correct if the reasoning separates the transport claim from the phosphorus claim; 'weakens' is incorrect.","insufficient":"(a) giving two versions of the same objection, or objections not tied to either source; (b) softening the claim by adding 'maybe' while keeping 'die', which repeats the empty-hedge habit; (c) answering 'supports' with no distinction between the transport claim and the phosphorus claim."},"challenge_justification":"Part (a) asks for falsification - what would have to be true for the explanation to be WRONG - which reverses everything the week has practised and requires the child to reason separately about the weak point of each source. Part (b) requires him to detect two overclaimed words and produce a defensible rewrite, using Day 6's ladder on a claim about a hypothetical future for which there is no evidence at all. Part (c) revives Day 2's hardest idea - a true, interesting fact that supports a neighbouring claim rather than this one - and applies it to a detail the passage mentions only in passing. Nothing in the practice items rehearses any of the three."}],"today_you_learned":"Synthesis means locking two sources together so that each supplies what the other lacks - not summarising both side by side. A synthesis carries four things: a claim with a strength word that has been earned, one piece of evidence from each source with the source named, and a limitation with its type. The test is to cover one source with your hand: if the explanation still stands, you listed rather than joined. And the strongest way to check an explanation is to ask what would have to be true for it to be wrong.","passage":{"title":"Dust From the Sahara","structure":"two_sources_plus_an_unanswered_question","approx_words":340,"blocks":[{"kind":"para","text":"Here are two pieces of research about completely different things. Nobody has joined them up for you. That is your job today."},{"kind":"heading","text":"SOURCE A - measuring dust from space"},{"kind":"para","text":"Satellites can see dust in the air. Instruments in orbit have tracked enormous plumes lifting off the Sahara and crossing the Atlantic Ocean, a journey of thousands of kilometres. Much of the dust comes from one surprisingly small area: a dried-out ancient lake bed in Chad, whose fine pale sediment is picked up easily by wind."},{"kind":"para","text":"The satellite work produced an estimate: very roughly twenty-eight million tonnes of this dust settles over the Amazon basin in a year. The researchers were careful to call it an estimate. The amount can vary enormously from one year to the next, depending on winds and rainfall, and a single year can be far above or far below the average. Some of the same dust travels north instead, and falls on southern Europe - in Spain these events are called calima, and they leave a fine orange film on cars and windows."},{"kind":"heading","text":"SOURCE B - digging in Amazon soil"},{"kind":"para","text":"Rainforest looks like the richest place on Earth, and its soil is not. Amazon soil is old and heavily washed. Heavy rain drains through it constantly and carries dissolved minerals away into the rivers and out to sea. Among the minerals lost this way is phosphorus, a nutrient that plants cannot grow without."},{"kind":"para","text":"Soil researchers have measured how much phosphorus the forest loses to rain each year, and they have measured how much phosphorus is present in Saharan dust. The two figures are close. The dust arriving from Africa carries roughly enough phosphorus to replace what the rain takes away."},{"kind":"heading","text":"THE QUESTION"},{"kind":"para","text":"Why would a rainforest on one continent depend on a desert on another? Neither source answers that on its own. Source A never mentions phosphorus. Source B never mentions satellites. Put them together."}]},"vocabulary":[{"term":"phosphorus","gloss":"a mineral that plants must have in order to grow"},{"term":"nutrient","gloss":"something a living thing needs to take in so it can grow"},{"term":"estimate","gloss":"a careful approximate figure, not an exact measurement"},{"term":"vary","gloss":"to change from one time to another"}]},{"machine_id":"caesar-math-023-symmetry-and-design-synthesis","day":7,"subject":"math","sequence":"023","family_display_label":"Math 023","child_title":"Symmetry, and a Design That Has to Work","estimated_minutes":30,"sections":[{"heading":"Orientation","body":"Last day of the pack. Today has a new idea in it - symmetry - and then a design problem that pulls in everything from all six previous days at once: fractions, the three names for one amount, angles, area, perimeter and factor pairs. The challenge today is not a question with an answer at the back. It is a thing you have to build so that four different requirements are all satisfied at the same time, and then defend."},{"heading":"Bridge From Yesterday","body":"Day 6: whole-number sides must be factors of the area, which is how you listed every rectangle with area 36 and knew the list was complete. You will need that exact list again today - and today one of those rectangles has to be thrown out for a reason that has nothing to do with area."},{"heading":"Teach","body":"A LINE OF SYMMETRY is a mirror line. Fold the shape along it and the two halves land exactly on top of each other - every corner onto a corner, every edge onto an edge. It is not enough for the two halves to be the same SIZE. They have to MATCH.\n\nCounting lines of symmetry:\n\n    Square                    4  (two through the middles of opposite sides, two along the diagonals)\n    Rectangle (not square)    2  (through the middles of opposite sides only)\n    Equilateral triangle      3\n    Regular hexagon           6\n    Regular octagon           8\n    Circle                    infinitely many\n\nThe pattern for regular shapes: a regular shape with n sides has exactly n lines of symmetry.\n\nSymmetry connects to Day 5. If you turn a regular hexagon by 360 divided by 6 = 60 degrees, it lands on itself and you cannot tell it moved. A square needs 360 divided by 4 = 90 degrees. The more symmetric a shape is, the smaller the turn that hides the movement.\n\nAnd symmetry is a CHECK, not just a description. If a pattern is supposed to be symmetric and one tile is out of place, the mirror test finds it instantly - you fold, and one square has nothing to land on. Designers use symmetry the way you use substituting an answer back into an equation."},{"heading":"Worked Example","body":"How many lines of symmetry does a 3 by 7 rectangle have?\n\nTry the vertical line through the middle of the long sides: fold, and the left half lands exactly on the right half. That one works. Try the horizontal line through the middle of the short sides: fold, and the top lands exactly on the bottom. That one works too.\n\nNow try a diagonal, corner to corner. Fold along it. The two triangles have the same area - both are half the rectangle - but they do NOT land on each other. One is long and lies flat; the other is short and stands up. The fold does not match, so the diagonal is not a line of symmetry.\n\nAnswer: 2.\n\nA square is the exception, and it is worth seeing why. In a square all four sides are the same length, so folding along a diagonal DOES make the two triangles land on each other. That is exactly why a square has 4 lines of symmetry and every other rectangle has only 2 - the diagonals only work when the sides are equal."},{"heading":"Common Mistake","body":"Marco says: 'The diagonal of a rectangle is a line of symmetry, because it cuts the rectangle into two triangles that are exactly the same size.'\n\nMarco has proved equal AREA, not symmetry. Those are different claims. Cut any shape anywhere into two equal-area pieces and you have said nothing about whether they mirror each other.\n\nThe test is the fold, not the area. Fold a 3 by 7 rectangle along its diagonal and look at what happens: the long thin triangle sticks out past the short one on two sides. Nothing lands where it should. Same area, different shape, no symmetry.\n\nThis is the same style of error as Tom's yesterday. Both men noticed one thing that was true and concluded a second thing that does not follow from it. Watch for it - it is a very common way to be wrong."}],"items":[{"id":"m1","phase":"retrieval","type":"numeric","prompt":"Days 1-3 retrieval. What is 3/4 of 48?","answer":36,"hint":"Cut 48 into 4 equal parts first.","explanation":"48 divided by 4 = 12, then 12 x 3 = 36. Sanity check: 3/4 is below 1, so the answer must be less than 48.","verify":{"kind":"fraction_of","frac":[3,4],"quantity":48,"expect":36}},{"id":"m2","phase":"guided","type":"choice","prompt":"How many lines of symmetry does a rectangle that is NOT a square have?","choices":[{"value":"A","text":"1"},{"value":"B","text":"2"},{"value":"C","text":"4"},{"value":"D","text":"Infinitely many"}],"answer":"B","hint":"Try folding it four ways: across, down, and along each diagonal. Which folds actually match?","explanation":"Two: the vertical line and the horizontal line through the middles of opposite sides. The two diagonals fail the fold test, because the triangles they create are the same area but not the same shape. Choice C is the answer for a square, where the sides are all equal and the diagonals do work.","verify":{"kind":"lines_of_symmetry","shape":"rectangle_non_square","expect":2}},{"id":"m3","phase":"guided","type":"multi","prompt":"Select EVERY shape below that has MORE than 3 lines of symmetry.","choices":[{"value":"A","text":"A square"},{"value":"B","text":"A rectangle that is not a square"},{"value":"C","text":"An equilateral triangle"},{"value":"D","text":"A regular octagon"},{"value":"E","text":"A circle"}],"answer":["A","D","E"],"hint":"For a regular shape, count the sides. For a circle, think about how many ways you could fold it in half.","explanation":"A square has 4, a regular octagon has 8, and a circle has infinitely many - every line through the centre works. A non-square rectangle has 2 and an equilateral triangle has 3, so neither is over 3. The rule for regular shapes: n sides gives n lines of symmetry.","verify":{"kind":"symmetry_filter","candidates":{"A":"square","B":"rectangle_non_square","C":"equilateral_triangle","D":"regular_octagon","E":"circle"},"condition":"more_than","threshold":3,"expect":["A","D","E"]}},{"id":"m4","phase":"error_analysis","type":"open","prompt":"Marco says: 'The diagonal of a 3 by 7 rectangle is a line of symmetry, because it splits the rectangle into two triangles of exactly the same size.' In one or two sentences, say what Marco has actually proved, what he has NOT proved, and what the real test for a line of symmetry is.","hint":"Two pieces can have the same area without being the same shape. What has to happen when you fold?","rubric":{"should_include":"States that Marco has proved the two triangles have equal AREA, which is not the same as symmetry; the real test is folding - the two halves must land exactly on top of each other, matching corner to corner - and along the diagonal of a 3 by 7 rectangle they do not.","sample":"Marco has proved the two triangles have the same area, but he has not proved they match. The real test is folding along the line: the two halves have to land exactly on top of each other, and if you fold a 3 by 7 rectangle along its diagonal the long thin triangle sticks out past the other one, so it is not a line of symmetry.","acceptable_range":"Any clear separation of equal-area from mirror-match, plus the fold test. Noting that a SQUARE's diagonal does work is a strong extra.","insufficient":"Says only 'he is wrong' or 'a rectangle has 2 lines of symmetry' without addressing what equal area does and does not prove."}},{"id":"m5","phase":"independent","type":"structured","prompt":"A regular hexagon (six equal sides).","fields":[{"key":"lines","label":"How many lines of symmetry does it have?","kind":"numeric","answer":6,"verify":{"kind":"lines_of_symmetry","shape":"regular_hexagon","expect":6}},{"key":"turn","label":"Day 5 link: what is the SMALLEST turn, in degrees, that lands it back on itself?","kind":"numeric","answer":60,"verify":{"kind":"rotation_symmetry_angle","sides":6,"expect":60}}],"hint":"A regular shape with n sides has n lines of symmetry. For the turn, share a full turn out between the sides.","explanation":"Six sides gives 6 lines of symmetry. And 360 divided by 6 = 60 degrees, so a sixth of a full turn puts the hexagon back on itself. More symmetry means a smaller hidden turn."},{"id":"m6","phase":"independent","type":"structured","prompt":"Synthesis with Day 6. A square floor tile has an area of 64 square centimetres.","fields":[{"key":"side","label":"Length of one side, in cm","kind":"numeric","answer":8,"verify":{"kind":"square_side_from_area","area":64,"expect":8}},{"key":"perimeter","label":"Perimeter, in cm","kind":"numeric","answer":32,"verify":{"kind":"rect_perimeter","sides":[8,8],"expect":32}},{"key":"lines","label":"Number of lines of symmetry","kind":"numeric","answer":4,"verify":{"kind":"lines_of_symmetry","shape":"square","expect":4}}],"hint":"For a square, both sides are the same, so you need the number that multiplies by itself to give 64.","explanation":"8 x 8 = 64, so the side is 8 cm. Perimeter = 4 x 8 = 32 cm. A square has 4 lines of symmetry: two through the middles of opposite sides, and both diagonals - the diagonals work here precisely because all four sides are equal."},{"id":"m7","phase":"independent","type":"structured","prompt":"Synthesis with Day 4. A tile panel has 12 squares in it, and 3 of them are painted red. Give the red share all three ways.","fields":[{"key":"fraction","label":"As a fraction in its simplest form (write it like 2/5)","kind":"short_exact","answer":["1/4"],"verify":{"kind":"simplify_fraction","frac":[3,12],"expect":[1,4]}},{"key":"decimal","label":"As a decimal","kind":"numeric","answer":0.25,"verify":{"kind":"fraction_to_decimal","frac":[3,12],"expect":0.25}},{"key":"percent","label":"As a percent (just the number)","kind":"numeric","answer":25,"verify":{"kind":"fraction_to_percent","frac":[3,12],"expect":25}}],"hint":"3 out of 12 - what does that simplify to? Then convert.","explanation":"3/12 simplifies to 1/4 by dividing top and bottom by 3, which is Day 1 scaling run backwards. 1/4 = 0.25 = 25%. One amount, three names."},{"id":"m8","phase":"challenge","type":"open","prompt":"CHALLENGE - a design that has to satisfy everything at once.\n\nYou are designing a rectangular tile panel on squared paper. It must meet ALL FOUR of these:\n\n  1. Both side lengths are whole numbers of tiles.\n  2. The area is exactly 36 tiles.\n  3. The panel's OUTLINE has exactly 2 lines of symmetry.\n  4. Exactly 1/3 of the tiles are painted blue, and after painting, the panel STILL has at least one line of symmetry.\n\n(a) Which rectangles have area 36 with whole-number sides? Which one must you REJECT because of requirement 3, and why?\n(b) Choose your panel. How many tiles are blue?\n(c) Describe exactly where the blue tiles go, and say which line of symmetry survives the painting and why.\n(d) Give your panel's perimeter. Would a different allowed panel have needed more or less edging around the outside? Say which and by how much.","hint":"Part (a) is Day 6's list - you have made it before. Requirement 3 rules out one shape for a symmetry reason, not an area reason. For (b), 1/3 of 36. For (c), think about painting whole columns or whole rows that sit evenly either side of the middle. For (d), the perimeters of the allowed panels are all different.","rubric":{"should_include":"(a) The five rectangles with area 36 are 1 by 36, 2 by 18, 3 by 12, 4 by 9 and 6 by 6. The 6 by 6 must be rejected because a square has 4 lines of symmetry, not exactly 2 - the rejection is about symmetry, not area. (b) 1/3 of 36 = 12 blue tiles. (c) A concrete, checkable arrangement in which the blue tiles are placed symmetrically about one of the two mirror lines - for example on a 4 by 9 panel, painting the three middle columns (columns 4, 5 and 6) gives 3 x 4 = 12 blue tiles arranged symmetrically about the vertical centre line, so that line survives. Any equivalent arrangement is fine if the count is 12 and the symmetry is genuinely preserved. (d) The perimeter of the chosen panel, correctly calculated (4 by 9 gives 26; 3 by 12 gives 30; 2 by 18 gives 40; 1 by 36 gives 74), and a correct comparison with another allowed panel including the difference.","sample":"(a) With whole-number sides and area 36 the rectangles are 1 by 36, 2 by 18, 3 by 12, 4 by 9 and 6 by 6. I have to reject the 6 by 6 because it is a square, and a square has 4 lines of symmetry, not exactly 2. The reason has nothing to do with its area - its area is fine.\n(b) I chose 4 by 9. One third of 36 is 12, so 12 tiles are blue.\n(c) The panel is 9 columns across and 4 rows down. I painted the three middle columns - columns 4, 5 and 6 - which is 3 x 4 = 12 tiles. The vertical line down the middle of column 5 is a line of symmetry of the outline, and my blue block is balanced either side of it: column 4 mirrors column 6, and column 5 is its own mirror. So the ver
