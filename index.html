e not looking."},{"id":"e4","phase":"guided","type":"multi","prompt":"Select EVERY person or group below whose knowledge of the Altamira ceiling was SECONDHAND.","choices":[{"value":"A","text":"Maria, in 1879"},{"value":"B","text":"The prehistorians who called the paintings a forgery"},{"value":"C","text":"Sautuola, after 1879"},{"value":"D","text":"Someone today reading this passage"},{"value":"E","text":"A person who reads a newspaper article about the cave"}],"answer":["B","D","E"],"hint":"Which of these people has actually stood under the ceiling?","explanation":"B, D and E all know about the ceiling through somebody else - a report, a passage, an article. A and C were both physically in the cave looking at the paintings. Notice that D includes you: everything you know about Altamira right now is secondhand, which does not make it false, but does mean there are links in the chain.","distractor_note":"Option D deliberately implicates the reader, so that secondhand cannot be read as a criticism of other people."},{"id":"e5","phase":"independent","type":"structured","own_words_required":true,"prompt":"Attribute this statement precisely: 'The Altamira paintings are a forgery.' Do not copy phrases from the passage.","fields":[{"key":"who","label":"WHO said it? (your own words)","kind":"open","own_words_required":true,"rubric":{"should_include":"Identifies the leading prehistorians or experts of the 1880s - the senior scientists of the time - as the source. Naming a specific individual is not expected, since the passage names none.","sample":"The top prehistory experts in Europe in the 1880s said it.","acceptable_range":"Any accurate identification of the expert community of the period.","insufficient":"Says 'people' or 'everyone'; or attributes it to Sautuola, who claimed the opposite."}},{"key":"how","label":"HOW did they know? (your own words)","kind":"open","own_words_required":true,"rubric":{"should_include":"States that they had read Sautuola's written report and looked at copied drawings, and had discussed it among themselves - almost none of them had visited the cave.","sample":"They had only read what Sautuola wrote and looked at drawings other people had copied, and they talked to each other about it. Nearly none of them ever went to the cave.","acceptable_range":"Any accurate account of report, drawings, and each other, with the key point that they had not been there.","insufficient":"Says 'they were experts', which describes their training rather than how they came to know about this particular ceiling."}},{"key":"type","label":"Was that firsthand or secondhand?","kind":"choice","choices":[{"value":"A","text":"Firsthand"},{"value":"B","text":"Secondhand"}],"answer":"B"}],"hint":"The HOW box is the important one. Do not write what they were - write how the information reached them."},{"id":"e6","phase":"independent","type":"open","prompt":"In one or two sentences of your own: why does it matter so much that almost none of the doubting experts had been to Altamira?","hint":"What can you find out by standing under a ceiling that you cannot find out from a drawing of it?","rubric":{"should_include":"Explains that their judgement was being applied to secondhand material - a report and copied drawings - rather than the paintings themselves, so however good their expertise was, the information reaching it was incomplete or altered. May add that things visible in the cave (the real colours, the way the rock's bulges shape the animals, the state of the surface, the position of the paintings) simply do not survive into a copied drawing.","sample":"They were judging drawings and a report instead of the actual ceiling, so all their training was being used on second-best information. A copy cannot show you the real colours or how the artist used the bumps in the rock, and those were exactly the things they were arguing about.","acceptable_range":"Any answer connecting the absence of direct access to the failure of their judgement. Naming something specific that a copy loses is a strong addition.","insufficient":"Says only 'they should have gone' without explaining what direct access would have given them; or says they were 'bad experts', which misses the point that their expertise was real and their information was not."}},{"id":"e7","phase":"independent","type":"choice","prompt":"Imagine you are a prehistorian in 1880 who doubts Sautuola's claim. Which action would be the MOST useful?","choices":[{"value":"A","text":"Read Sautuola's book again more carefully."},{"value":"B","text":"Travel to Cantabria and examine the ceiling yourself."},{"value":"C","text":"Ask three other prehistorians what they think."},{"value":"D","text":"Wait to see whether anyone else finds painted caves."}],"answer":"B","hint":"Which action changes what KIND of knowledge you have, rather than just adding more of the same kind?","explanation":"B is the only action that converts secondhand knowledge into firsthand knowledge. A and C add more secondhand material - and C in particular just multiplies opinions that are all resting on the same report, which is how the group stayed wrong for twenty years. D is not useless, and it is in fact what eventually settled the question, but it means waiting instead of finding out."},{"id":"e8","phase":"challenge","type":"open","prompt":"CHALLENGE - three parts.\n\n(a) Sautuola saw the paintings with his own eyes. Was his claim that they were made in prehistoric times FIRSTHAND knowledge? Explain your answer carefully.\n\n(b) The experts knew far more about prehistory than Sautuola did. Explain how they could be better qualified than him and still be more wrong. Use the words firsthand and secondhand in your explanation.\n\n(c) What finally changed their minds was not a better argument from Sautuola - it was caves found in France, years later, by other people. Explain why that worked when his own evidence had not.","hint":"For (a), separate what he SAW from what he CONCLUDED - that is Day 1 again. For (c), think about what a doubter could say about one cave belonging to one accused man, and whether they could still say it about several caves found by strangers in sealed rock.","rubric":{"should_include":"(a) No - or more precisely, partly. He saw the PAINTINGS firsthand, but their AGE is not something anybody can see; that was an inference built on his firsthand observation. It is stronger than the same claim made by someone who had never visited, but it is not firsthand knowledge of the age. (b) Expertise works on whatever information it is given. Theirs was secondhand - a report and copied drawings - while Sautuola's was firsthand. Being better trained does not help if the material reaching you has already lost the things being argued about. (c) The French caves removed the rival explanation. One decorated cave belonging to an accused man could be dismissed as a forgery he had arranged; several caves, found independently by different people, in caves sealed shut so that no forger could have got in, could not all be fakes. It turned a single disputed case into a pattern, and the finders had no stake in Sautuola being right.","sample":"(a) Not really. He saw the paintings firsthand, but nobody can see how old something is. He worked the age out from what he saw, so that part is an inference, not something he witnessed. It is still better than a claim from someone who never went, because at least his reasoning started from the real ceiling.\n(b) Their expertise was real, but expertise only works on the information you give it, and theirs was secondhand - a report and copied drawings. Sautuola knew less about prehistory but he had firsthand access to the actual paintings. Knowing more does not help if what reaches you has already lost the details everyone is arguing about.\n(c) Because you could not explain the French caves away. If one cave belongs to a man people have accused of cheating, a doubter can say he faked it. But the French caves were found by different people, and they had been sealed shut, so nobody could have sneaked in to paint them. Once it is a pattern instead of one story, the forgery explanation stops working.","acceptable_range":"(a) must separate seeing the paintings from concluding their age; either 'no' or 'partly' is correct if that separation is made. (b) must use the firsthand/secondhand distinction and must not simply call the experts incompetent. (c) must identify the removal of the forgery explanation - independence of the finders, or the sealed caves, or the shift from one case to a pattern. Any one of those three is sufficient; two is a strong answer.","insufficient":"(a) answered 'yes, he saw them' without separating the age claim; (b) answered as 'the experts were stupid or jealous', which the passage does not support; (c) answered as 'more evidence is better' without saying what specifically the French caves ruled out."},"challenge_justification":"The practice items ask the child to classify sources that the passage has already sorted for him. This item requires three separate constructions. Part (a) forces him to apply Day 1's observation/inference split inside Day 3's firsthand/secondhand split, and to notice that a single person can be firsthand about one thing and inferring about another. Part (b) requires him to hold two ideas that feel contradictory - real expertise, wrong conclusion - without collapsing into 'they were stupid', which is the tempting and unsupported answer. Part (c) is about why independent evidence defeats a rival explanation, which is Day 2's machinery applied to a historical reversal. None of it is retrievable from the passage."}],"today_you_learned":"Ask two questions of every statement: who says so, and how do they know? Firsthand means they were there; secondhand means it reached them through somebody else. Secondhand is not false - most of what anyone knows is secondhand - but each link in the chain is a place where detail can be lost. Being qualified and having access are different things, and expertise applied to secondhand material can go badly wrong, as it did at Altamira for twenty years. And someone can be firsthand about a thing while only inferring a claim about it: Sautuola saw the paintings, but he worked out their age.","passage":{"title":"Who Saw It First","subtitle":"Altamira, Cantabria, northern Spain","structure":"historical_narrative_with_reversal","approx_words":340,"blocks":[{"kind":"para","text":"The cave at Altamira, in Cantabria in northern Spain, was found by accident. A local hunter came across the blocked entrance in the 1860s while looking for his dog. For years afterwards nobody thought much of it."},{"kind":"para","text":"In the 1870s a landowner from the area, Marcelino Sanz de Sautuola, began digging carefully in the cave floor, looking for old tools and bones. He was not a trained scientist. He was an interested man with a shovel and patience."},{"kind":"para","text":"In 1879 he brought his young daughter Maria with him. She was about eight. While her father worked at the floor, she wandered further in with a lamp - and looked up. The low ceiling above her was covered with painted animals: great bison in red and black, curled and running, using the bulges in the rock to give them shape. Her father had been working underneath them for months without once raising his eyes."},{"kind":"para","text":"Sautuola studied the paintings and published his conclusion the following year: they had been made in the distant prehistoric past, by people who lived in the cave."},{"kind":"para","text":"The leading prehistorians of Europe rejected it. The paintings were too skilful, too fresh in colour, too well preserved. Ancient people, they held, could not have painted like that. Some suggested the whole thing was a forgery - that Sautuola had hired an artist and faked it. His reputation never recovered. He died in 1888, still disbelieved."},{"kind":"para","text":"Here is the part that matters most. Almost none of those experts had been to Altamira. They judged from Sautuola's written report, from drawings, and from each other. They were arguing about a ceiling they had never stood under."},{"kind":"para","text":"In the 1890s, painted caves began turning up in France - found by other people, in caves that had been sealed shut, where no forger could have worked. The pattern could no longer be explained away. In 1902 one of the most senior doubters published a public apology, admitting he had been wrong. Sautuola had been dead for fourteen years."}]},"vocabulary":[{"term":"firsthand","gloss":"known by being there yourself and seeing it directly"},{"term":"secondhand","gloss":"known because somebody else told you or wrote it down"},{"term":"forgery","gloss":"something faked and passed off as genuine"},{"term":"expert","gloss":"someone with a great deal of training and experience in a subject"}]},{"machine_id":"caesar-math-019-fraction-of-a-quantity","day":3,"subject":"math","sequence":"019","family_display_label":"Math 019","child_title":"A Fraction of an Amount","estimated_minutes":25,"sections":[{"heading":"Orientation","body":"So far fractions have been numbers on their own. Today they start doing work on other numbers. This is the lesson where fractions stop being about pizza and start being a tool: 3/5 of the flight, 2/3 of the group, 7/8 of the battery. There is one idea to get, and one trap that catches almost everybody."},{"heading":"Bridge From Yesterday","body":"Day 2: bigger denominator means smaller pieces, which is why 3/5 beats 3/7. Today that same fact explains why taking 3/7 of something leaves you with less than taking 3/5 of it. Day 1 also comes back: when the numbers are awkward, simplify the fraction first and the arithmetic gets easier."},{"heading":"Teach","body":"'3/4 of 20' is an instruction in two steps. The bottom number tells you how to CUT: split 20 into 4 equal parts, giving 5 in each part. The top number tells you how many parts to TAKE: take 3 of those parts, giving 15.\n\nSo 3/4 of 20 = (20 divided by 4) x 3 = 5 x 3 = 15.\n\nNow look at what you just did: you divided by 4 and multiplied by 3. That is precisely what multiplying by the fraction 3/4 means. So 'of' is multiplication:\n\n    3/4 of 20  =  3/4 x 20  =  15\n\nYou can do the two steps in either order. Divide first (20 divided by 4 = 5, then 5 x 3 = 15) or multiply first (3 x 20 = 60, then 60 divided by 4 = 15). Divide first when the division is clean - it keeps the numbers small. Multiply first when the division is not clean: for 2/7 of 21, going 21 divided by 7 = 3 then 3 x 2 = 6 is easy, but for 3/8 of 20, 20 divided by 8 is not a whole number, so 3 x 20 = 60 then 60 divided by 8 = 7.5 is the smoother path.\n\nOne more move from Day 1: simplify before you calculate. For 6/9 of 45, notice 6/9 = 2/3 first. Then 45 divided by 3 = 15 and 15 x 2 = 30. Doing it the long way, 6 x 45 = 270 then 270 divided by 9 = 30, gets the same answer with much bigger numbers."},{"heading":"Worked Example - three representations","body":"Find 2/5 of 30.\n\nEqual groups. Put 30 counters into 5 equal piles. Each pile has 6. Take 2 piles: 12.\n\nNumber line. Draw 0 to 30 and mark it in 5 equal hops, each hop 6 long: 0, 6, 12, 18, 24, 30. Land on the second hop: 12.\n\nEquation. 2/5 x 30 = (30 divided by 5) x 2 = 6 x 2 = 12.\n\nCheck it the other way round: if 12 is 2/5 of the amount, then one fifth is 6, and five fifths is 30. It closes."},{"heading":"Common Mistake","body":"Ana says: 'Multiplying always makes a number bigger, so 3/5 x 25 has to be more than 25.'\n\nThat rule is true for whole numbers above 1 and false everywhere else. Multiplying by 1 leaves a number alone - you proved that on Day 1. So multiplying by anything BELOW 1 must pull it down, and multiplying by anything ABOVE 1 pushes it up. 3/5 is below 1, so 3/5 of 25 is less than 25. It is 15.\n\nThis gives you a free check on every answer today. Before you calculate, look at the fraction. Below 1? Your answer must be smaller than the amount you started with. If it is not, something has gone wrong - and it is usually multiplying when you should have divided."}],"items":[{"id":"m1","phase":"retrieval","type":"choice","prompt":"Day 2 retrieval. Which is larger, 5/6 or 5/8?","choices":[{"value":"A","text":"5/8, because 8 is bigger than 6."},{"value":"B","text":"5/6, because sixths are bigger pieces than eighths."},{"value":"C","text":"They are equal, because both have 5 on top."},{"value":"D","text":"You need a common denominator to tell."}],"answer":"B","hint":"The tops match, so compare the piece sizes.","explanation":"Same-numerator route: you hold 5 pieces either way, and sixths are larger pieces than eighths, so 5/6 is larger. (5/6 is about 0.833 and 5/8 is 0.625.)","verify":{"kind":"compare_fractions","left":[5,6],"right":[5,8],"expect":"left"}},{"id":"m2","phase":"guided","type":"choice","prompt":"Which calculation correctly finds 3/4 of 20?","choices":[{"value":"A","text":"20 divided by 3, then multiplied by 4"},{"value":"B","text":"20 divided by 4, then multiplied by 3"},{"value":"C","text":"20 multiplied by 4, then divided by 3"},{"value":"D","text":"20 plus 3, then divided by 4"}],"answer":"B","hint":"The bottom number tells you how to cut. The top number tells you how many to take.","explanation":"Cut by the denominator, take by the numerator: 20 divided by 4 = 5, then 5 x 3 = 15. Choice A and C swap the two jobs, which would give an answer larger than 20 - impossible for a fraction below 1.","verify":{"kind":"fraction_of","frac":[3,4],"quantity":20,"expect":15}},{"id":"m3","phase":"guided","type":"numeric","prompt":"What is 2/3 of 18?","answer":12,"hint":"Cut 18 into 3 equal parts first.","explanation":"18 divided by 3 = 6, then 6 x 2 = 12. Sanity check: 2/3 is below 1, so 12 must be less than 18. It is.","verify":{"kind":"fraction_of","frac":[2,3],"quantity":18,"expect":12}},{"id":"m4","phase":"guided","type":"structured","prompt":"A tour bus holds 48 passengers. 5/6 of the seats are filled. Fill in BOTH boxes - the answer is not finished without the check.","fields":[{"key":"value","label":"How many passengers are on the bus?","kind":"numeric","answer":40,"verify":{"kind":"fraction_of","frac":[5,6],"quantity":48,"expect":40}},{"key":"check","label":"Your check - show one way you know 40 is right.","kind":"open","rubric":{"should_include":"Any genuine verification: one sixth is 8 so six sixths is 48; or the 8 empty seats are 1/6 of 48 and 40 + 8 = 48; or 40/48 simplifies to 5/6; or notes 40 must be below 48 because 5/6 is below 1 and confirms by a second route.","sample":"48 divided by 6 is 8, so one sixth is 8 seats. Five sixths is 5 x 8 = 40, and the last sixth is the 8 empty seats. 40 + 8 = 48, which matches the bus size.","acceptable_range":"Any check that could have come out wrong. The size sanity check alone (40 < 48) is weak on its own but acceptable if combined with a second route.","insufficient":"Repeats the same multiplication, or writes only 'it looks right'."}}],"hint":"48 divided by 6 tells you what one sixth is worth.","explanation":"48 divided by 6 = 8 (one sixth), then 8 x 5 = 40. Check: the remaining sixth is 8 empty seats, and 40 + 8 = 48."},{"id":"m5","phase":"error_analysis","type":"open","prompt":"Ana says: 'Multiplying always makes numbers bigger, so 3/5 x 25 must be more than 25.' In one or two sentences, explain what is wrong with Ana's rule, and give the correct value of 3/5 x 25.","hint":"What does multiplying by exactly 1 do? So what must multiplying by less than 1 do?","rubric":{"should_include":"Explains that multiplying by 1 leaves a number unchanged, so multiplying by a number BELOW 1 must make it smaller; Ana's rule only holds for multipliers above 1. Gives 3/5 x 25 = 15.","sample":"Multiplying by 1 leaves a number the same, so multiplying by anything smaller than 1 has to make it smaller. 3/5 is less than 1, so the answer shrinks: 3/5 x 25 = 15.","acceptable_range":"Any correct statement that fractions below 1 shrink the amount, with the value 15. Referring back to the multiplier idea from percent work is a strong answer.","insufficient":"Gives 15 without explaining why Ana's rule fails, or says 'fractions are different' without saying what the boundary is."}},{"id":"m6","phase":"independent","type":"multi","prompt":"Select EVERY expression below that correctly gives 3/4 of 32.","choices":[{"value":"A","text":"32 divided by 4, then times 3"},{"value":"B","text":"3 times 32, then divided by 4"},{"value":"C","text":"32 divided by 3, then times 4"},{"value":"D","text":"32 minus 3/4"},{"value":"E","text":"0.75 times 32"}],"answer":["A","B","E"],"hint":"Work each one out. Three of them land on the same number.","explanation":"A gives 8 x 3 = 24. B gives 96 divided by 4 = 24. E gives 24, because 3/4 = 0.75. C swaps the cut and the take, giving about 42.7 - larger than 32, which is impossible here. D subtracts a fraction from a whole number, which is a different operation entirely.","verify":{"kind":"expression_set","target":"3/4*32","candidates":{"A":"32/4*3","B":"3*32/4","C":"32/3*4","D":"32-3/4","E":"0.75*32"},"expect":["A","B","E"]}},{"id":"m7","phase":"independent","type":"numeric","prompt":"A plate arrives with 24 olives on it. Caesar eats 5/8 of them. How many olives are LEFT on the plate?","answer":9,"hint":"Careful - the question does not ask how many he ate. What fraction is left?","explanation":"5/8 eaten means 3/8 left. 24 divided by 8 = 3, then 3 x 3 = 9 olives left. The other route: he ate 3 x 5 = 15, and 24 - 15 = 9. Both give 9.","verify":{"kind":"fraction_of","frac":[3,8],"quantity":24,"expect":9}},{"id":"m8","phase":"challenge","type":"open","prompt":"CHALLENGE - two parts.\n\n(a) On a bus, 3/7 of the seats are TAKEN, and there are 24 EMPTY seats. How many seats does the bus have in total, and how many are taken? Check both numbers against the story.\n\n(b) A second bus also has 24 empty seats, but on that bus 3/7 of the seats are EMPTY. Does the second bus have MORE seats or FEWER seats than the first? Answer this WITHOUT working out its total, and explain how you can tell.","hint":"For (a): the 24 empty seats are not 3/7 of the bus. What fraction are they? For (b): the same 24 seats stand for a different-sized share. If a share is smaller, what does that mean about the whole it came from?","rubric":{"should_include":"(a) Recognises 24 empty seats = 4/7 of the bus, so one seventh = 6 and the total is 42; taken = 3 x 6 = 18. Checks: 18 + 24 = 42, and 18/42 simplifies to 3/7. (b) Concludes MORE seats, reasoning that on the second bus the same 24 seats represent only 3/7 of the total instead of 4/7 - a smaller share standing for the same count means the whole must be bigger. No total calculation required.","sample":"(a) If 3/7 are taken, then 4/7 are empty. So 24 seats is 4/7 of the bus. One seventh is 24 divided by 4 = 6, so the bus has 7 x 6 = 42 seats. Taken = 3 x 6 = 18. Check: 18 + 24 = 42, and 18 out of 42 simplifies to 3/7.\n(b) More seats. On the first bus 24 seats was 4/7 of the bus, but on the second bus the same 24 seats is only 3/7. The same number of seats is now a smaller slice of the whole, so the whole has to be bigger.","acceptable_range":"(a) must reach total 42 and taken 18 with a check. (b) must reach MORE with a reason based on the same amount representing a smaller share; computing 56 and comparing is a correct answer but does not meet the 'without working out its total' instruction and should be noted as a partial.","insufficient":"Treats 24 as 3/7 of the bus (giving 56 for part a) - that is the intended trap; or answers (b) correctly by guessing with no reasoning; or reverses the direction in (b)."},"challenge_justification":"Runs the lesson's procedure backwards and then abandons calculation entirely. Practice items give the whole and ask for the part; part (a) gives a part and requires the child to first work out WHICH fraction that part is - the trap that catches most children. Part (b) explicitly forbids the arithmetic route and requires proportional reasoning about how share size and whole size trade off. Neither part is reachable by copying M2-M7."}],"today_you_learned":"'Of' means multiply. A fraction of an amount is two instructions: the bottom number says how to cut, the top number says how many to take. You can divide first or multiply first, and simplifying the fraction first (Day 1) keeps the numbers small. Because a fraction below 1 is a multiplier below 1, the answer must be smaller than what you started with - that is a free check on every question. And running it backwards, if you know the part and the fraction, you can recover the whole: find what one part is worth, then build up.","passage":null,"vocabulary":[]},{"machine_id":"caesar-eng-020-cause-and-effect","day":4,"subject":"english","sequence":"020","family_display_label":"English 020","child_title":"The Tower That Grows in Summer","estimated_minutes":25,"sections":[{"heading":"Orientation","body":"Two things can happen at the same time for three completely different reasons: one causes the other, they are connected by steps that nobody bothered to say out loud, or they have nothing to do with each other at all. Those three look identical from outside. Today you learn to take them apart, using a tower that quietly changes height every year."},{"heading":"Bridge From Yesterday","body":"Day 3: ask who says a thing and how they know. Day 2: ask whether the evidence is tied to the claim. Today those combine into a sharper tool - when someone tells you A caused B, ask them to walk you from A to B one step at a time. If they cannot, either the steps are missing or there is nothing there."},{"heading":"Teach","body":"A CAUSAL CHAIN is a set of steps where each one makes the next one happen. The test is simple and hard to fake: can you walk from the start to the end without jumping? Heat arrives, particles jiggle harder, particles push apart, metal gets longer, tower gets taller. Every step touches the next.\n\nA COINCIDENCE is two things happening together with nothing running between them. Summer brings more visitors. Summer brings a taller tower. Try to walk from 'more visitors' to 'taller tower' and there is no first step - visitors do not warm the iron in any way that matters. The giveaway is that removing one thing leaves the other untouched. Empty the tower of tourists and it still grows.\n\nA MISSING LINK is a real connection stated too fast. 'Longer days make the tower taller' is not nonsense. It is a chain with its middle knocked out: longer days, more hours of sunlight, more heat absorbed, more expansion, taller tower. The repair is not to reject it but to put the steps back.\n\nWhy this matters: a coincidence should be thrown out, and a missing link should be repaired. Treating them the same way makes you wrong twice.\n\nAnd here is the test that settles arguments. If A really causes B, then taking A away should change B. That is why 'no tourists, still taller' finishes the visitor argument in one move. When you want to know whether something is a cause, do not stare harder at it - ask what would happen if it were removed."},{"heading":"Worked Example","body":"Claim: 'Ice cream sales cause sunburn. Both go up in July.'\n\nBoth halves are true. Try to walk the chain: eating ice cream leads to... nothing that reddens skin. No first step exists. So look for something sitting behind both: hot sunny weather makes people buy ice cream, and hot sunny weather delivers the sunlight that burns skin. The two are cousins, not parent and child. COINCIDENCE - or more precisely, two effects of the same hidden cause.\n\nThe removal test confirms it. Ban ice cream tomorrow and people still burn. That single move settles it.\n\nNow: 'The sun causes sunburn.' Walk the chain: sunlight carries energy, the energy reaches skin, enough of it damages the skin, damaged skin turns red and sore. No gaps. And the removal test agrees - stay indoors and you do not burn. CAUSE."}],"items":[{"id":"e1","phase":"retrieval","type":"choice","prompt":"Day 3 retrieval - attribution. Who would have FIRSTHAND knowledge that the tower is taller in summer?","choices":[{"value":"A","text":"Someone who read about it in a book"},{"value":"B","text":"An engineer who measured the tower in winter and again in summer"},{"value":"C","text":"A tour guide who tells visitors about it every day"},{"value":"D","text":"Someone who has visited the tower in summer"}],"answer":"B","hint":"Firsthand means being there for the thing itself. What is the thing here - the tower, or the change in height?","explanation":"Only B has direct access to the fact in question. The fact is a CHANGE IN HEIGHT, and you cannot see that by looking - fifteen centimetres on a tower three hundred metres tall is invisible to the eye. It has to be measured, twice. D is the sharpest distractor: standing at the tower in summer gives firsthand experience of the tower, but not of the change."},{"id":"e2","phase":"guided","type":"choice","prompt":"In this passage, what does EXPANDING mean?","choices":[{"value":"A","text":"Getting hotter"},{"value":"B","text":"Getting slightly bigger, as metal does when it is heated"},{"value":"C","text":"Becoming heavier"},{"value":"D","text":"Jiggling"}],"answer":"B","hint":"The passage names it right after describing what the particles do.","explanation":"Expanding is the getting-bigger part. A and D are steps EARLIER in the chain - heating and jiggling are what cause the expansion, not what it means. Keeping the steps distinct matters, because a chain built out of muddled steps cannot be checked."},{"id":"e3","phase":"guided","type":"choice","prompt":"Which of these puts the causal chain in the right order?","choices":[{"value":"A","text":"The iron is heated, the particles jiggle harder, the particles push further apart, the iron gets longer, the tower gets taller."},{"value":"B","text":"The tower gets taller, the iron gets longer, the iron is heated, the particles jiggle harder."},{"value":"C","text":"The particles push further apart, the iron is heated, the tower gets taller, the particles jiggle harder."},{"value":"D","text":"The tower gets taller in summer, so more people visit it."}],"answer":"A","hint":"Start with what arrives from outside, and end with what you could measure.","explanation":"A runs from the outside cause to the measurable effect with every step touching the next. B has the chain backwards - the tower getting taller does not heat the iron. C shuffles the middle so that the pushing happens before the heating that causes it. D is the coincidence, dressed up with the word 'so'.","verify":{"kind":"causal_order","expect":["heated","jiggle","push_apart","iron_longer","tower_taller"]}},{"id":"e4","phase":"guided","type":"multi","prompt":"Select EVERY pairing below that is a COINCIDENCE - two things that happen together with nothing running between them.","choices":[{"value":"A","text":"More visitors in summer, and a taller tower in summer"},{"value":"B","text":"Iron being heated, and iron getting longer"},{"value":"C","text":"More ice cream sold in July, and more sunburn in July"},{"value":"D","text":"Particles jiggling harder, and particles pushing further apart"},{"value":"E","text":"More people wearing sunglasses in summer, and a taller tower in summer"}],"answer":["A","C","E"],"hint":"For each pairing, try to say the first step out loud. If there is no first step, it is a coincidence.","explanation":"A, C and E have no route from one to the other. In A and E, summer is the thing behind both. In C, hot sunny weather is behind both. B and D are genuine links in the tower's chain, where each one really does make the other happen.","distractor_note":"E is included so that the child cannot pass by memorising the visitor example from the passage - it requires the same test to be applied to a new pairing."},{"id":"e5","phase":"independent","type":"structured","own_words_required":true,"prompt":"Write ONE cause-and-effect sentence about the tower, in your own words, with NO missing links. Then say how you know there are no gaps.","fields":[{"key":"sentence","label":"Your cause-and-effect sentence (own words)","kind":"open","own_words_required":true,"rubric":{"should_include":"A sentence running from a cause to an effect where each step makes the next happen, in the child's own words - for example heat to particle movement to expansion to height, or any consecutive stretch of that chain stated without a jump.","sample":"When the sun heats the tower's iron, the tiny particles inside it move about more and push each other further apart, which makes each piece of iron a little longer, so the whole tower ends up taller.","acceptable_range":"The chain does not have to be the full five steps, but no step it does include may be skipped over. Own wording is required.","insufficient":"Copies the passage; states 'summer makes the tower taller', which skips the middle entirely; or gives a coincidence."}},{"key":"gapcheck","label":"How do you know your sentence has no gaps?","kind":"open","own_words_required":true,"rubric":{"should_include":"Describes actually testing the sentence - walking from each step to the next and confirming that each one makes the next happen, with nothing jumped over.","sample":"I went along my sentence one step at a time and each part makes the next part happen. The heat makes the particles move, the moving makes them spread out, the spreading makes the iron longer, and the longer iron makes the tower taller. I never had to jump.","acceptable_range":"Any description of a genuine step-by-step check.","insufficient":"Writes 'because it is right' or repeats the sentence without checking it."}}],"hint":"Say your sentence out loud and stop at each 'and then'. If you ever have to guess how you got from one part to the next, that is a gap."},{"id":"e6","phase":"independent","type":"open","prompt":"'The days are longer in summer, so the tower is taller.' The passage says this is NOT a coincidence, but that it is still faulty. In one or two sentences of your own, say what is wrong with it and repair it by putting the missing steps back in.","hint":"Longer days give you more of something. What does more of that thing do to the iron?","rubric":{"should_include":"Identifies that the statement is a real chain with its middle missing rather than a coincidence, and supplies the missing steps: longer days give more hours of sunlight, more sunlight means the iron absorbs more heat, more heat means more expansion, which means a taller tower.","sample":"It is not wrong exactly, it just jumps. Longer days mean more hours of sunshine, which means the iron soaks up more heat, and the heat is what makes it expand and the tower get taller. Once you put those steps in, it works.","acceptable_range":"Any repair that inserts sunlight hours and heat between 'longer days' and 'taller tower'. Explicitly saying it is a missing link rather than a coincidence is a strong answer.","insufficient":"Says the statement is a coincidence, which is the wrong diagnosis; or says only 'it is missing steps' without supplying them."}},{"id":"e7","phase":"independent","type":"choice","prompt":"You want to prove it is the HEAT that makes the tower taller, and not the summer crowds. Which comparison would settle it best?","choices":[{"value":"A","text":"Measure the tower on a busy summer day and on a quiet summer day, at the same temperature."},{"value":"B","text":"Count the visitors every day for a year."},{"value":"C","text":"Measure the tower on a busy summer day and on a quiet winter day."},{"value":"D","text":"Ask visitors whether they think they make the tower taller."}],"answer":"A","hint":"You want only ONE thing to change between the two measurements. Which option holds the temperature still and changes only the crowd?","explanation":"A changes the crowd while holding the temperature fixed, so if the height stays the same, visitors are not the cause. C changes both the crowd and the temperature at once, so whatever you find, you cannot tell which one did it - that is the commonest mistake in comparisons. B measures only one thing and compares nothing. D collects opinions about a fact that measurement can settle."},{"id":"e8","phase":"challenge","type":"open","prompt":"CHALLENGE - three parts.\n\n(a) It is true that more people visit the tower in summer, and true that the tower is taller in summer. Explain why the first does not cause the second. Then say what would have to be true - what you would have to be able to show - for visitors to count as a real cause.\n\n(b) Here is a fact the passage has not told you: in strong sunshine the tower also leans very slightly AWAY from the sun. Build the causal chain that explains this, using what you already know about the iron. Your chain must have no missing links.\n\n(c) Someone writes: 'The tower is taller in summer because summer is hotter.' That sentence is true. Explain what is nevertheless unsatisfying about it, and write the version with the steps put back in.","hint":"For (a), use the removal test - what happens if you take the visitors away? For (b), think about which side of the tower the sunshine actually falls on, and what happens to iron that gets hotter than the iron next to it. For (c), compare it with Impostor 2.","rubric":{"should_include":"(a) There is no route from visitors to iron temperature; the removal test settles it, since the tower would still grow with nobody there, and summer is the thing sitting behind both. For visitors to be a real cause, someone would have to show a step-by-step route from crowds to warmer iron AND show that height changes when the crowd changes with temperature held still. (b) A gap-free chain: the sun falls on one side of the tower; that side's iron gets hotter than the shaded side; hotter iron expands more, so the sunlit side becomes slightly longer than the shaded side; a structure with one side longer than the other tips over towards the shorter side, which is the shaded side - so the tower leans away from the sun. (c) It is true but it is a missing link, exactly like Impostor 2: it names the first thing and the last thing and leaves out the mechanism, so it cannot be checked and does not explain anything. Repaired: summer is hotter, so the iron absorbs more heat, so its particles jiggle harder and push further apart, so each piece of iron lengthens, so the tower is taller.","sample":"(a) There is no way to get from a crowd of people to warmer iron - nothing runs between them. The quickest proof is to take the visitors away: if nobody came all August the tower would still grow, so the visitors cannot be doing it. Summer is really the thing causing both. For visitors to count as a real cause I would have to show a step-by-step route from the crowds to the iron getting hotter, and I would have to show the height changing when the crowd changes but the temperature stays the same.\n(b) The sun only shines on one side of the tower at a time. That side's iron gets hotter than the shaded side. Hotter iron expands more, so the sunny side gets slightly longer than the shady side. When one side of something is longer than the other, it tips over towards the shorter side, and the shorter side is the shaded one - so the tower leans away from the sun.\n(c) It is true but it jumps straight from the weather to the tower and misses everything in between, so it does not actually explain anything and there is nothing to check. Put back in: summer is hotter, so the iron takes in more heat, so its particles jiggle harder and push further apart, so every piece of iron gets a bit longer, so the tower is taller.","acceptable_range":"(a) must apply the removal test or an equivalent, and must state a requirement for visitors to count as a cause. (b) must reach 'leans away from the sun' via unequal heating of the two sides and unequal expansion; the final tipping step may be described loosely as long as the direction is right. (c) must diagnose it as a missing link (not a coincidence) and supply a repaired chain.","insufficient":"(a) answered as 'that is silly' without the removal test; (b) reaching the lean without explaining why one side expands more than the other, or getting the direction backwards; (c) calling the sentence false, or calling it a coincidence."},"challenge_justification":"Part (b) is genuine transfer: the child is given a NEW fact the passage never mentions and must construct a chain for it himself, including a step the lesson never demonstrates - that unequal expansion on two sides produces a lean. It cannot be retrieved. Part (a) requires him not just to reject the visitor claim but to state the conditions under which it WOULD be accepted, which is a harder and more honest move than dismissal. Part (c) tests whether he can distinguish a true-but-empty statement from a false one, the distinction that separates Impostor 1 from Impostor 2."}],"today_you_learned":"A causal chain has no gaps - you can walk from the cause to the effect one step at a time, and each step makes the next one happen. Two things imitate it. A coincidence is two things happening together with nothing between them, and the removal test exposes it: take one away and the other carries on regardless. A missing link is a real connection said too fast, and the repair is to put the steps back, not to throw the claim out. Getting the diagnosis right matters, because a coincidence should be rejected and a missing link should be mended.","passage":{"title":"The Tower That Grows in Summer","structure":"causal_chain_then_two_impostors","approx_words":320,"blocks":[{"kind":"para","text":"The Eiffel Tower in Paris is not the same height all year. In hot summer weather it stands roughly fifteen centimetres taller than it does in the cold. Nobody adds anything to it. It grows."},{"kind":"heading","text":"THE CHAIN"},{"kind":"para","text":"The tower is built of iron. Everything is made of tiny particles, far too small to see, which are always jiggling. Heat makes them jiggle harder. When they jiggle harder they push each other slightly further apart, and a piece of metal made of billions of them becomes slightly longer. This is called expanding."},{"kind":"para","text":"So the chain runs like this. Sunlight and warm air heat the iron. The particles in the iron jiggle harder. They push further apart, and every piece of iron gets a tiny bit longer. The tower is built from thousands of such pieces stacked on top of one another, and thousands of tiny stretches added together come to about fifteen centimetres."},{"kind":"para","text":"Each step here makes the next one happen. There are no gaps. That is what a causal chain is."},{"kind":"heading","text":"TWO THINGS THAT LOOK LIKE THE CHAIN BUT ARE NOT"},{"kind":"para","text":"IMPOSTOR 1. Far more people visit the tower in summer than in winter. So: summer has more visitors, and summer has a taller tower. Both are true, and they happen at the same time of year. But there is nothing joining them. Visitors do not stretch iron. If every tourist stayed at home next August, the tower would still grow. Two things happening together, with nothing running between them, is a coincidence."},{"kind":"para","text":"IMPOSTOR 2. Days are longer in summer, and the tower is taller in summer. This one is trickier, because it is not a coincidence - longer days really are part of the story. But said like that, it skips steps. Longer days mean more hours of sunlight; more hours of sunlight mean the iron takes in more heat; more heat means more expansion. That is a real chain with its middle removed. A missing link is not the same fault as no link at all, and the repair is different: you do not throw the claim away, you put the steps back in."}]},"vocabulary":[{"term":"expand","gloss":"to get bigger; for a metal, to get slightly longer when heated"},{"term":"particle","gloss":"one of the tiny pieces everything is made of, far too small to see"},{"term":"coincidence","gloss":"two things happening together with nothing connecting them"},{"term":"chain","gloss":"a set of steps where each one makes the next one happen"}]},{"machine_id":"caesar-math-020-fraction-decimal-percent-representations","day":4,"subject":"math","sequence":"020","family_display_label":"Math 020","child_title":"One Amount, Three Names","estimated_minutes":28,"sections":[{"heading":"Orientation","body":"You have spent eight lessons in percent and three days in fractions. Today those two worlds turn out to be the same world. 3/4, 0.75 and 75% are not three related numbers - they are one number with three names, like a person with a first name, a nickname and a name their grandmother uses. The new skill is not converting. It is choosing: knowing which name makes a particular job easiest."},{"heading":"Bridge From Yesterday","body":"Day 3: 'of' means multiply, and a multiplier below 1 shrinks the amount. That is exactly the percent rule you already knew - 0.80 shrinks, 1.15 grows - so today the two ideas finally shake hands. Day 1 equivalence is the machinery underneath: converting a fraction to a decimal is scaling it so the denominator becomes 10, 100 or 1000."},{"heading":"Teach","body":"The bridge is hundredths. Percent literally means 'per hundred', so 37% is 37/100. And 37/100 written in place value is 0.37. That is the whole bridge:\n\n    37/100   =   0.37   =   37%\n\nFraction to decimal: scale the denominator to 10 or 100 using Day 1. 7/20 x 5/5 = 35/100 = 0.35. When scaling will not reach a power of ten, divide instead: 3/8 = 3 divided by 8 = 0.375.\n\nDecimal to percent: multiply by 100, or slide the digits two places left. 0.35 becomes 35%. 0.375 becomes 37.5%.\n\nPercent to fraction: put it over 100 and simplify. 35% = 35/100 = 7/20.\n\nPicture it on a hundred grid: a square of 100 small boxes. Shade 35 of them. That single picture is 35/100, 0.35 and 35% simultaneously - you have not changed the shading, only what you call it. This is Day 1's idea again: the amount stays put while the name changes.\n\nBenchmarks worth knowing by heart: 1/2 = 0.5 = 50%, 1/4 = 0.25 = 25%, 3/4 = 0.75 = 75%, 1/5 = 0.2 = 20%, 1/10 = 0.1 = 10%, 1/3 = 0.333... = about 33.3%, 1/8 = 0.125 = 12.5%."},{"heading":"Worked Example - the multiplier and the rate, one more time","body":"A shop takes 25% off a jacket.\n\nThe RATE is what comes off: 25%, which is 0.25, which is 1/4.\nThe MULTIPLIER is what is left: 75%, which is 0.75, which is 3/4.\n\nThese are different numbers. Both describe the same discount. The rate answers 'how much came off'; the multiplier answers 'what fraction of the price do I still pay'. You multiply by the multiplier, never by the rate: sale price = original x 0.75.\n\nFor an increase they swap sides of 1. A 15% rise has rate 0.15 and multiplier 1.15. The rate is always the DISTANCE from 1. The multiplier is always the number you actually multiply by.\n\nValues such as 0.80 and 0.875 are multipliers, not rates. For 0.80 the rate is 20%. For 0.875 the rate is 12.5%. Say it in all three names and it becomes hard to mix up: multiplier 0.875 = 7/8 = 87.5% of the price stays; rate 0.125 = 1/8 = 12.5% comes off; and 7/8 + 1/8 = 1, which is the whole price."},{"heading":"Common Mistake","body":"Ben reasons: '1/4 = 0.25 = 25%. So 0.4 must be 4%.'\n\nBen has matched the digits instead of the place value. 0.25 is 25 HUNDREDTHS, which is why it is 25 per hundred. But 0.4 is 4 TENTHS, not 4 hundredths. Four tenths is forty hundredths, so 0.4 = 40/100 = 40%.\n\nThe repair is to always push a decimal out to hundredths before reading it as a percent: 0.4 = 0.40 = 40%. Write the extra zero. A decimal with one digit after the point is tens of percent, not units of percent. Sanity check: 0.4 is nearly a half, and 4% is nearly nothing - those cannot be the same amount."}],"items":[{"id":"m1","phase":"retrieval","type":"numeric","prompt":"Day 3 retrieval. What is 3/8 of 40?","answer":15,"hint":"Cut 40 into 8 equal parts first.","explanation":"40 divided by 8 = 5, then 5 x 3 = 15. Check: 3/8 is below 1, so 15 must be smaller than 40.","verify":{"kind":"fraction_of","frac":[3,8],"quantity":40,"expect":15}},{"id":"m2","phase":"guided","type":"choice","prompt":"Write 0.8 as a percent.","choices":[{"value":"A","text":"8%"},{"value":"B","text":"80%"},{"value":"C","text":"0.8%"},{"value":"D","text":"800%"}],"answer":"B","hint":"Push it out to hundredths first: 0.8 = 0.80.","explanation":"0.8 is eight tenths, which is eighty hundredths: 0.80 = 80/100 = 80%. Choice A is Ben's digit-matching mistake. Sanity check: 0.8 is most of a whole, and 80% is most of a whole - they agree.","verify":{"kind":"decimal_to_percent","decimal":0.8,"expect_percent":80}},{"id":"m3","phase":"guided","type":"structured","prompt":"Give 7/20 its other two names.","fields":[{"key":"decimal","label":"As a decimal","kind":"numeric","answer":0.35,"verify":{"kind":"fraction_to_decimal","frac":[7,20],"expect":0.35}},{"key":"percent","label":"As a percent (just the number)","kind":"numeric","answer":35,"verify":{"kind":"fraction_to_percent","frac":[7,20],"expect":35}},{"key":"check","label":"Your check - how do you know all three are the same amount?","kind":"open","rubric":{"should_include":"A genuine verification: scaling 7/20 by 5 to reach 35/100 and reading that as both 0.35 and 35%; or dividing 7 by 20 to get 0.35 independently of the scaling; or a hundred-grid description in which 35 of 100 boxes are shaded and the same shading is read three ways.","sample":"I scaled 7/20 by 5 to get 35/100. Then I checked it a second way by dividing 7 by 20, which also gives 0.35. Both routes agree, and 35 out of 100 is 35%.","acceptable_range":"Any check that could have come out wrong. Two independent routes agreeing is the strongest form.","insufficient":"Repeats the scaling that produced the answer, or writes only 'because percent means out of 100'."}}],"hint":"Scale 7/20 so the denominator becomes 100. What do you multiply 20 by? For the check, try reaching the decimal a second way.","explanation":"20 x 5 = 100, so 7 x 5 = 35 and 7/20 = 35/100. That is 0.35 as a decimal and 35% as a percent - the same shading on a hundred grid, read three ways."},{"id":"m4","phase":"guided","type":"structured","prompt":"A shop takes 30% off everything. Answer all three parts.","fields":[{"key":"multiplier","label":"The multiplier you would multiply the original price by","kind":"numeric","answer":0.7,"verify":{"kind":"rate_to_multiplier","rate_percent":30,"direction":"decrease","expect":0.7}},{"key":"rate","label":"The rate of discount, as a percent (just the number)","kind":"numeric","answer":30,"verify":{"kind":"multiplier_to_rate","multiplier":0.7,"direction":"decrease","expect_rate_percent":30}},{"key":"why","label":"In one sentence: why are the multiplier and the rate different numbers here?","kind":"open","rubric":{"should_include":"States that the rate is the part taken OFF (30%) while the multiplier is the part that REMAINS and is what you actually multiply by (0.70 = 70%), and that they add to the whole (30% + 70% = 100%).","sample":"The rate 30% is how much comes off, but the multiplier 0.7 is how much is left, which is what you actually multiply the price by. Together they make the whole price: 30% + 70% = 100%.","acceptable_range":"Any clear off-versus-left distinction. Mentioning that 0.30 + 0.70 = 1 is a strong answer.","insufficient":"Says the multiplier 'represents the rate', or gives both numbers without distinguishing what each one means. This is the exact an earlier lesson M3/M4 error and should be flagged for discussion if it reappears."}}],"hint":"If 30% comes off, what percent of the price do you still pay?","explanation":"30% off leaves 70%, so the multiplier is 0.70 and the rate is 30%. You multiply by 0.70, never by 0.30. The two always add to 1 for a discount: 0.30 + 0.70 = 1."},{"id":"m5","phase":"error_analysis","type":"open","prompt":"Ben reasons: '1/4 = 0.25 = 25%, so 0.4 must be 4%.' In one or two sentences, say exactly where his reasoning breaks, and give the correct percent for 0.4.","hint":"Count the place value. Is the 4 in 0.4 counting tenths or hundredths?","rubric":{"should_include":"Identifies that Ben matched the DIGITS rather than the PLACE VALUE: in 0.25 the 25 is in the hundredths, but the 4 in 0.4 is in the tenths, and four tenths is forty hundredths. Gives 0.4 = 40%.","sample":"In 0.25 the 25 counts hundredths, which is why it is 25 per hundred, but the 4 in 0.4 counts tenths, not hundredths. Four tenths is forty hundredths, so 0.4 = 40%, not 4%.","acceptable_range":"Any correct place-value explanation with the value 40%. A size sanity check (0.4 is nearly half, 4% is almost nothing) is a good addition.","insufficient":"Gives 40% with no explanation, or says 'you multiply by 100' as a rule without identifying the place-value error that caused Ben's mistake."}},{"id":"m6","phase":"independent","type":"multi","prompt":"Select EVERY name below that means the same amount as 3/8.","choices":[{"value":"A","text":"0.375"},{"value":"B","text":"37.5%"},{"value":"C","text":"3.8"},{"value":"D","text":"6/16"},{"value":"E","text":"38%"}],"answer":["A","B","D"],"hint":"Work out 3 divided by 8 first, then check each option against it.","explanation":"3 divided by 8 = 0.375, which is 37.5%. 6/16 is 3/8 scaled by 2 (Day 1), so it counts. 3.8 is a completely different size - almost 4 whole units. 38% is close to 37.5% but not equal to it, and 'close' is not 'the same'.","verify":{"kind":"same_value_set","target":"3/8","candidates":{"A":"0.375","B":"37.5%","C":"3.8","D":"6/16","E":"38%"},"expect":["A","B","D"]}},{"id":"m7","phase":"independent","type":"choice","prompt":"Put these three amounts in order from SMALLEST to LARGEST: 0.45, 2/5, 43%","choices":[{"value":"A","text":"2/5, 43%, 0.45"},{"value":"B","text":"0.45, 43%, 2/5"},{"value":"C","text":"43%, 2/5, 0.45"},{"value":"D","text":"2/5, 0.45, 43%"}],"answer":"A","hint":"Put all three into the same name first. Decimals are easiest here.","explanation":"2/5 = 0.40, 43% = 0.43, and 0.45 is already a decimal. So the order is 0.40, 0.43, 0.45 - that is 2/5, then 43%, then 0.45. Converting everything to one name before comparing is the whole method.","verify":{"kind":"order_values","values":{"2/5":"2/5","43%":"43%","0.45":"0.45"},"expect_ascending":["2/5","43%","0.45"]}},{"id":"m8","phase":"challenge","type":"open","prompt":"CHALLENGE. Here are three situations. There is no calculation to do - the whole task is choosing and defending.\n\n  (i) Sharing a 12-slice pizza equally between 4 people.\n  (ii) Deciding who is the better shooter: Rosa scored 17 out of 40 shots, Diego scored 9 out of 20.\n  (iii) Filling a water bottle to a line marked 0.75 L on a scale numbered 0, 0.25, 0.5, 0.75, 1.\n\n(a) For EACH situation, say which name - fraction, decimal, or percent - is the most useful, and why that one and not the others.\n(b) Pick the ONE situation where a different name would be almost as good, name it, and say exactly what you would LOSE by switching.","hint":"Ask what job each name is good at. Fractions handle exact equal parts. Percent puts different-sized groups on one shared scale of 100. Decimals match a measuring scale that is already in decimals. For (b), look for the situation where the second-best name is only slightly worse.","rubric":{"should_include":"(i) FRACTION - 1/4 each, or 3 slices each; the whole is naturally in equal parts and the answer is exact, whereas 25% or 0.25 of a pizza does not tell you how many slices to hand over. (ii) PERCENT - 42.5% against 45%; the two shooters have different denominators (40 and 20), and percent rescales both to the same base of 100 so they can be compared directly. (iii) DECIMAL - the bottle's scale is already printed in decimals, so 0.75 can be read straight off; converting to 3/4 or 75% means translating before you can use it. (b) A defensible choice with a real loss named - most naturally (ii), where decimals 0.425 and 0.45 are equally correct but harder to read at a glance and no longer carry the shared 'out of 100' meaning; or (i), where 25% is correct but loses the count of actual slices.","sample":"(i) Fraction. Each person gets 1/4, which is 3 slices. A fraction fits because the pizza is already in equal parts and I need a whole number of slices to hand out. Saying 25% is true but does not tell me how many slices to give anyone.\n(ii) Percent. Rosa is 17 out of 40 and Diego is 9 out of 20, and those are different-sized bottoms, so I cannot compare them directly. Percent puts both over 100: Rosa is 42.5% and Diego is 45%, so Diego is better.\n(iii) Decimal. The bottle is already marked in decimals, so 0.75 can be read straight off the scale without changing it into anything.\n(b) Situation (ii) could use decimals instead - 0.425 against 0.45 gives the same answer. What I would lose is how easy it is to read: percent tells you straight away it is roughly 43 shots out of every 100, and 0.425 needs another step in my head before it means anything.","acceptable_range":"Different defensible choices are acceptable IF the reason genuinely fits the job. The essential reasoning is: (ii) must rest on the two denominators being different and percent supplying a common base; (iii) must rest on the measuring scale already being decimal. For (b), any of the three may be chosen provided a concrete loss is named.","insufficient":"Names a representation for each without a reason; gives reasons that would apply equally to all three names ('it is easier'); converts the numbers instead of arguing about them; or in (b) names a switch without saying what is lost."},"challenge_justification":"There is no procedure in this lesson that produces this answer - the practice items all convert between names, and this item forbids that being the point. The child must reason about what each representation is FOR, tie the choice to a feature of the situation (unequal denominators; a decimal measuring scale; a countable whole), and then perform a genuine trade-off analysis in part (b). The answer is entirely justification."}],"today_you_learned":"Hundredths are the bridge. Percent means 'per hundred', so 37% is 37/100 is 0.37 - one amount, three names. Scale a fraction toward 10 or 100 to reach its decimal, or divide when scaling will not get there. Push a decimal out to hundredths before reading it as a percent, so 0.4 becomes 0.40 becomes 40%. And the multiplier is never the rate: the rate is the distance from 1, the multiplier is what you actually multiply by. Choosing a name is a real decision - percent for comparing different-sized groups, fractions for exact equal parts, decimals for reading off a decimal scale.","passage":null,"vocabulary":[]},{"machine_id":"caesar-eng-021-compare-two-sources","day":5,"subject":"english","sequence":"021","family_display_label":"English 021","child_title":"How High Can a Bird Fly?","estimated_minutes":27,"sections":[{"heading":"Orientation","body":"For the first time this week you have two sources instead of one. They are about the same subject - how high birds fly - and they do not disagree with each other. Something more interesting is going on: they are answering different questions, and neither of them notices. Working out which question a source actually answers is one of the most useful reading skills there is."},{"heading":"Bridge From Yesterday","body":"Day 3 asked who says a thing and how they know. Day 4 asked whether the steps connect. Today those two questions get pointed at two texts at once, because the way each source came into existence - one an accident, one a plan - decides what it can and cannot tell you."},{"heading":"Teach","body":"When you meet two sources on one subject, ask three things.\n\nWHAT KIND OF EVIDENCE IS THIS? Source A is a single accidental event. Nobody set out to measure it; a bird and an aeroplane happened to be in the same place. Source B is a plan carried out on purpose: many birds, many journeys, measurements recorded throughout. A record and a study are different animals.\n\nWHAT IS EACH ONE EMPHASISING? Source A is about an extreme - the highest ever confirmed. Source B is about the typical - what these geese usually do. Extremes and typicals are both real, and neither one is the truth about birds in general.\n\nWHAT QUESTION DOES EACH ACTUALLY ANSWER? This is where it becomes powerful. 'How high CAN a bird get?' is answered by Source A: at least eleven thousand three hundred metres, because one did. 'How high DO birds usually fly?' is answered by Source B, and Source A is useless for it - one vulture tells you nothing about what is normal.\n\nAnd there is a fourth question, which is the one careful readers ask last: WHAT DOES NEITHER SOURCE SETTLE? Neither tells you why that vulture was up there. Neither tells you whether some untracked goose has flown higher than any tracked one. A single study, however careful, can only report what it caught."},{"heading":"Worked Example","body":"Question: 'Are Himalayan geese able to survive very thin air?'\n\nSource B answers it well. It measured many geese at six to seven thousand metres repeatedly, which is far thinner air than anyone can breathe comfortably, and the birds were flying, not struggling. Many birds, many journeys - that is strong.\n\nSource A does not answer it. The vulture was not surviving thin air; it was hit by an aeroplane. We know it reached that height and nothing about how it was coping.\n\nNow reverse the question: 'What is the greatest height a bird has been confirmed at?'\n\nNow Source A is the only source that can answer, and Source B is silent - not because the geese cannot go higher, but because tracking geese tells you nothing about vultures. Same two sources, opposite usefulness, depending entirely on the question asked."}],"items":[{"id":"e1","phase":"retrieval","type":"choice","prompt":"Day 4 retrieval - causal chains. Source B says the geese tend to fly at night and in the early morning, when the air is colder and denser. Which chain best explains why denser air would help them?","choices":[{"value":"A","text":"Colder air is denser, so there is more air for the wings to push against, so the birds get more lift for the same effort."},{"value":"B","text":"It is dark at night, so the birds cannot see the mountains, so they fly higher to be safe."},{"value":"C","text":"The geese are tired at night, so they fly more slowly, so they use less energy."},{"value":"D","text":"Night is quieter, so the geese are less disturbed, so they fly higher."}],"answer":"A","hint":"Wings work by pushing against air. What happens if there is more air in the same space?","explanation":"A is a chain with no gaps: colder means denser, denser means more air to push against, more push means more lift. B, C and D all skip from a fact about night to a conclusion with nothing joining them - each is a missing link at best, and B also has its logic backwards."},{"id":"e2","phase":"guided","type":"choice","prompt":"In Source B, what does TYPICALLY mean?","choices":[{"value":"A","text":"The highest that has ever been recorded"},{"value":"B","text":"What usually happens, rather than what happened once"},{"value":"C","text":"Something that has been proved beyond doubt"},{"value":"D","text":"Something that surprised the researchers"}],"answer":"B","hint":"The last line of Source B contrasts it with the highest flight ever made.","explanation":"Typical is about the usual case. A is the meaning of 'record', which is Source A's territory - and keeping those two words apart is what this whole lesson turns on."},{"id":"e3","phase":"guided","type":"choice","prompt":"Which source better answers the question: 'How high do birds usually fly on a long migration?'","choices":[{"value":"A","text":"Source A, because it gives the highest altitude ever confirmed."},{"value":"B","text":"Source B, because it measured many birds over several migrations."},{"value":"C","text":"Both equally, because both give altitudes."},{"value":"D","text":"Neither, because altitude cannot be measured."}],"answer":"B","hint":"The question contains the word 'usually'. Which source measured the usual case?","explanation":"Source B measured many birds repeatedly, which is exactly what a question about the usual case needs. Source A is one bird on one day, and it was not even flying normally as far as anyone knows. C is the tempting answer, because both sources do contain numbers - but a number is not automatically an answer to your question."},{"id":"e4","phase":"guided","type":"multi","prompt":"Select EVERY statement below that is true of SOURCE B but NOT of Source A.","choices":[{"value":"A","text":"It involves many birds rather than one."},{"value":"B","text":"The measurement was planned in advance."},{"value":"C","text":"It gives an altitude in metres."},{"value":"D","text":"It describes what usually happens."},{"value":"E","text":"It concerns birds flying at high altitude."}],"answer":["A","B","D"],"hint":"Two of these are true of BOTH sources, so they are not differences at all.","explanation":"A, B and D are the real differences: many birds against one, planned against accidental, typical against extreme. C and E are true of both sources - both give altitudes and both are about high-flying birds - so neither of them tells the two sources apart. Listing something both sources share is the commonest error in comparing texts."},{"id":"e5","phase":"independent","type":"structured","own_words_required":true,"prompt":"Write one comparison, in your own words. Do not copy phrases from either source.","fields":[{"key":"comparison","label":"One sentence comparing the two sources","kind":"open","own_words_required":true,"rubric":{"should_include":"A genuine comparison naming a real difference - one bird against many, accidental against planned, extreme against typical, or record against usual case - in the child's own wording.","sample":"Source A is one accident that happened to one vulture, but Source B is a planned study that followed lots of geese across several journeys.","acceptable_range":"Any accurate comparison of the two sources, reworded. It must be a comparison rather than a description of one source alone.","insufficient":"Describes only one source; names a feature both sources share; or copies from the passage."}},{"key":"evidence_a","label":"The evidence from SOURCE A that supports your comparison","kind":"open","own_words_required":true,"rubric":{"should_include":"Something specific from Source A that genuinely backs the comparison written above - for example that it describes a single collision, that nobody was studying the bird, or that nothing similar has been recorded since.","sample":"Source A is about one crash with one bird, and it says nothing like it has ever been recorded again.","acceptable_range":"Any accurate Source A detail that actually supports the stated comparison.","insufficient":"Repeats the comparison instead of supporting it; or quotes Source B by mistake."}},{"key":"evidence_b","label":"The evidence from SOURCE B that supports your comparison","kind":"open","own_words_required":true,"rubric":{"should_include":"Something specific from Source B that genuinely backs the comparison written above - for example that trackers were fitted to many geese, that several migrations were followed, or that the study reports what the birds typically do.","sample":"Source B put tracking devices on lots of geese and followed them over several migrations, so it is about what usually happens.","acceptable_range":"Any accurate Source B detail that actually supports the stated comparison.","insufficient":"Repeats the comparison instead of supporting it; or quotes Source A by mistake."}}],"hint":"First decide what the difference IS. Then find the line in EACH source that shows it - one box for each, so a reader can tell which half rests on which source."},{"id":"e6","phase":"independent","type":"open","prompt":"In two or three sentences of your own: say what Source A can tell you that Source B cannot, AND what Source B can tell you that Source A cannot.","hint":"One of them can tell you about the limit of what is possible. The other can tell you about ordinary life. Neither can do the other's job.","rubric":{"should_include":"Source A contributes the extreme - the greatest height at which a bird has ever been confirmed, which no study of typical behaviour could establish. Source B contributes the typical - what these birds usually do, how they route themselves through passes, when they fly - which one accident could never show.","sample":"Source A can tell me the highest a bird has ever been proved to reach, because a real bird was found at that height, and no study of what geese normally do could ever show that. Source B can tell me what birds actually do on an ordinary migration - how high they usually go and that they follow the valleys - and one accident could never tell me what is normal.","acceptable_range":"Both directions must be present. Naming the goose routing strategy or the night flying as part of Source B's contribution is a strong addition.","insufficient":"Gives only one direction; or says one source is 'better' rather than saying what each contributes; or treats the sources as disagreeing, which they do not."}},{"id":"e7","phase":"independent","type":"choice","prompt":"Day 2 retrieval - evidence strength. Which source gives stronger evidence for the claim: 'A bird has reached an altitude above ten thousand metres'?","choices":[{"value":"A","text":"Source A, because remains were recovered and identified at a known altitude."},{"value":"B","text":"Source B, because it measured many birds carefully."},{"value":"C","text":"Neither, because one event proves nothing."},{"value":"D","text":"Both equally."}],"answer":"A","hint":"Read the claim very carefully. It says A bird - one is enough.","explanation":"For a claim that says 'a bird has reached' this height, a single confirmed case is exactly what is needed, and Source A supplies it with physical remains identified at a known altitude. Source B is careful and thorough and simply does not speak to it. C is a trap that punishes single cases automatically - but a single case is precisely the right evidence for a claim about whether something has ever happened. Notice this reverses E3: for the 'usually' question A was useless, and here B is."},{"id":"e8","phase":"challenge","type":"open","prompt":"CHALLENGE - three parts.\n\n(a) Here are two questions:\n      Q1. How high CAN a bird fly?\n      Q2. How high DO birds usually fly?\nSay which source answers each one, and explain why one source cannot answer both.\n\n(b) A newspaper prints the headline: BIRDS FLY AT 11,300 METRES. Using BOTH sources, explain what is misleading about that headline, and write a more accurate headline of your own.\n\n(c) Someone reads Source B and says: 'This proves geese cannot fly higher than about seven thousand metres.' Explain why that conclusion is wrong, using what a tracking study can and cannot show.","hint":"For (b), look hard at the word 'birds' - how many birds, and which kind? For (c), reread the last line of Source B, and ask what the study would have to have done in order to rule something out.","rubric":{"should_include":"(a) Source A answers Q1 and Source B answers Q2. One source cannot do both because a single extreme event says nothing about what is normal, and a study of what is normal is not designed to catch the rarest case. (b) The headline takes Source A's one-off record and states it as though it were what birds generally do. It is misleading in at least two ways: 'birds' suggests birds in general when it was a single vulture, and the present tense 'fly' suggests something that happens regularly when it has been confirmed only once. A better headline names the single case - for example 'One vulture confirmed at 11,300 metres, the highest bird flight ever recorded'. (c) The study reports what it MEASURED, not what is possible. It tracked some geese on some journeys; a goose it did not track, or a journey it did not record, could have gone higher, and the source says outright that it does not claim to have caught the highest flight ever made. Not finding something is not the same as showing it cannot happen.","sample":"(a) Source A answers Q1, because one vulture really was found at that height, so that height is possible. Source B answers Q2, because it measured lots of geese on lots of journeys, which is what tells you the usual case. One source cannot do both: a single accident cannot tell you what is normal, and a study of the normal case is not looking for the rarest flight of all.\n(b) The headline turns one vulture into all birds. It says 'birds' as if this were something birds generally do, when only a single bird has ever been confirmed that high, and it says 'fly' as if it happens all the time, when it has happened once. Source B shows that geese on a hard migration usually stay around six or seven thousand metres, which is far below the headline. A better headline: 'Highest bird ever recorded: one vulture confirmed at 11,300 metres in 1973'.\n(c) The study only shows what it managed to measure. It followed some geese on some trips, and it says itself that it is not claiming to have caught the highest flight any goose ever made. A goose that was not carrying a tracker could have gone higher and nobody would know. Not seeing something happen is not the same as proving it cannot.","acceptable_range":"(a) must match both sources to their questions with a reason. (b) must identify at least one of the two overreaches (one bird treated as birds in general, or a single event treated as routine) and must supply a rewritten headline that is actually more accurate. (c) must contain the idea that a study reports what it measured and cannot rule out what it did not observe.","insufficient":"(a) matching the sources correctly with no reason; (b) saying the headline is 'wrong' without identifying the overreach, or offering a replacement headline that repeats the same error; (c) answering 'because there might be higher ones' with no reference to what the study could and could not observe."},"challenge_justification":"Part (c) introduces a genuinely difficult idea that the lesson only gestures at in a single line - that failing to observe something is not evidence that it cannot happen - and requires the child to reason about the limits of a method rather than about its findings. Part (b) requires him to detect two separate overreaches inside a short headline and then produce a corrected version, which is a construction task rather than a selection task. Part (a) demands an explanation of why the two sources are not interchangeable, not merely which is which. None of the practice items asks for any of this."}],"today_you_learned":"Two sources on one subject may not disagree at all - they may simply be answering different questions. Ask what kind of evidence each carries (a single accident or a planned study), what each emphasises (the extreme or the typical), and which question each actually answers. A record tells you what is possible; a study tells you what is usual; and neither one can do the other's job. Then ask the question careful readers ask last: what does neither source settle? A study reports what it measured, and cannot rule out what it never saw.","passage":{"title":"How High Can a Bird Fly?","structure":"two_labelled_sources_side_by_side","approx_words":320,"blocks":[{"kind":"heading","text":"SOURCE A - an aircraft collision report, 1973"},{"kind":"para","text":"In November 1973, an airliner flying over West Africa struck a bird. The aircraft was damaged but landed safely. What made the incident famous was the altitude: the aeroplane was at roughly eleven thousand three hundred metres - higher than Everest by a wide margin, in air so thin that a person would lose consciousness in seconds."},{"kind":"para","text":"The remains recovered from the engine were sent to specialists, who identified the feathers as belonging to a Ruppell's vulture, a large African bird. It remains the highest altitude at which a bird has ever been confirmed. It is a single event. Nobody was studying that vulture, nobody knows why it was so high, and nothing like it has been recorded since."},{"kind":"heading","text":"SOURCE B - a tracking study of bar-headed geese"},{"kind":"para","text":"Bar-headed geese migrate twice a year across the Himalaya. To find out how they do it, researchers fitted geese with small tracking devices that recorded position and altitude throughout the journey, and followed many birds across several migrations."},{"kind":"para","text":"The results surprised people who expected the geese to soar over the summits. Most of the time they do not. They follow valleys and passes, keeping as low as the mountains allow, and their highest points are usually somewhere around six to seven thousand metres rather than the far greater heights often claimed for them. They also tend to fly at night and in the early morning, when the air is colder and denser."},{"kind":"para","text":"The study describes what these geese TYPICALLY do, measured many times over. It does not claim to have caught the highest flight any goose has ever made."}]},"vocabulary":[{"term":"altitude","gloss":"height above sea level"},{"term":"record","gloss":"the highest or best case ever confirmed - not the usual case"},{"term":"tracking","gloss":"following an animal's movements using a device that records where it goes"},{"term":"typical","gloss":"what usually happens, rather than what happened once"}]},{"machine_id":"caesar-math-021-angles-and-turns","day":5,"subject":"math","sequence":"021","family_display_label":"Math 021","child_title":"Angles and Turns","estimated_minutes":28,"sections":[{"heading":"Orientation","body":"Today the subject changes completely. Every lesson you have done in this system - all of percent, and the last four days of fractions - has been about numbers. Today is geometry, and it starts with one idea that surprises most people: an angle does not measure how long anything is. It measures how far something TURNED. Once you believe that, you can find angles you cannot measure, without owning a protractor."},{"heading":"Bridge From Yesterday","body":"Day 3 gave you fractions of a quantity, and today the quantity is a full turn: a quarter turn is 1/4 of 360 = 90 degrees, a half turn is 1/2 of 360 = 180, and a three-quarter turn is 3/4 of 360 = 270. Day 4 gave you benchmark comparisons; today 90 and 180 are the benchmarks, and every angle gets judged against them."},{"heading":"Teach","body":"Stand facing a door and spin all the way round until you face it again. That is one full turn, and we call it 360 degrees. The number 360 is a human choice, made thousands of years ago. Nobody is completely certain why that number was chosen, though it does divide neatly by a great many numbers, which is very convenient. Everything else follows from it.\n\n    Full turn      = 360 degrees\n    Half turn      = 180 degrees   (you now face the opposite way)\n    Quarter turn   =  90 degrees   (a right angle, the corner of a book)\n    Three quarters = 270 degrees\n\nNames by size, using 90 and 180 as benchmarks:\n\n    ACUTE   - less than 90. A sharp, narrow corner.\n    RIGHT   - exactly 90. Marked with a small square, not a curve.\n    OBTUSE  - more than 90 but less than 180. A wide, open corner.\n    STRAIGHT- exactly 180. A flat line.\n\nNow the two facts that let you find angles without measuring:\n\n    ON A STRAIGHT LINE, the angles meeting on one side add to 180.\n    AROUND A POINT, the angles filling all the way round add to 360.\n\nThese are not rules to memorise separately. They are the same fact: a straight line is a half turn, and all the way round is a
