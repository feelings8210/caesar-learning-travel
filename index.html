<style>
/* Caesar Learning - Step by Step : Spain Travel Pack
   iPad landscape first. Large touch targets. Minimal chrome. */

:root {
  /* Caesar Learning B-plus continuity. The terracotta family is reserved for
     the home-screen CD icon and tiny identity/warning accents; it is not the
     Travel app's surface or action palette. */
  color-scheme: light;
  --ink: #2f4560;
  --ink-soft: #51657d;
  --ink-faint: #77899f;
  --paper: #eef3f7;
  --card: #fefdfb;
  --surface-soft: #f8fafc;
  --line: #dee6ef;
  --line-strong: #cad5e2;
  --indigo: #3a5f88;
  --indigo-hover: #2f5278;
  --indigo-soft: #e4ecf3;
  --amber: #b04a32;
  --amber-soft: #f7efeb;
  --green: #3e8f68;
  --green-soft: #e6f5ec;
  --red: #a0524a;
  --red-soft: #f8ecea;
  --radius: 18px;
  --tap: 56px;
  --maxw: 940px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(circle at 15% -8%, rgba(255, 255, 255, .62), transparent 42%),
    radial-gradient(circle at 88% 96%, rgba(218, 228, 237, .38), transparent 45%),
    var(--paper);
  background-attachment: fixed;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 19px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 1em; }
p:last-child { margin-bottom: 0; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 20px 22px 120px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  background: rgba(238, 243, 247, .94);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar .spacer { flex: 1; }
.topbar .crumb { font-size: .95rem; color: var(--ink-soft); font-weight: 600; }

.btn {
  min-height: var(--tap); min-width: var(--tap);
  padding: 0 22px;
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: var(--radius);
  font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--indigo); color: #fff; border-color: var(--indigo); }
.btn.primary:hover { background: var(--indigo-hover); border-color: var(--indigo-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--indigo); }
.btn.small { min-height: 44px; padding: 0 16px; font-size: .95rem; }
.btn[disabled] { opacity: .38; pointer-events: none; }

/* ---------- home ---------- */
.hero { padding: 26px 0 10px; }
.hero .kicker { color: var(--amber); font-weight: 700; letter-spacing: .09em; text-transform: uppercase; font-size: .78rem; }
.hero h1 { margin-top: 6px; }
.hero .sub { color: var(--ink-soft); }

.day {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: 0 1px 2px rgba(40, 50, 65, .04), 0 10px 22px rgba(40, 50, 65, .035);
}
.day > h2 { display: flex; align-items: baseline; gap: 12px; font-size: 1.1rem; margin-bottom: 12px; }
.day .daynum { color: var(--indigo); }
.day .daytag { font-size: .85rem; font-weight: 500; color: var(--ink-faint); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .tiles { grid-template-columns: 1fr; } }

.tile {
  display: block; width: 100%; text-align: left;
  border: 1.5px solid var(--line); background: var(--surface-soft);
  border-radius: var(--radius); padding: 14px 16px; min-height: 92px;
}
.tile .subject { font-size: .76rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.tile .title { font-weight: 650; margin: 3px 0 8px; }
.tile.done { border-color: #b9d9c7; background: var(--green-soft); }
.tile.progress { border-color: var(--line-strong); background: var(--indigo-soft); }

.status { display: inline-flex; align-items: center; gap: 7px; font-size: .85rem; font-weight: 600; color: var(--ink-soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #c3d0dc; flex: none; }
.dot.progress { background: #6f8dac; }
.dot.done { background: var(--green); }

/* ---------- lesson ---------- */
.progressbar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
.progressbar > i { display: block; height: 100%; background: var(--indigo); transition: width .25s ease; }

.step-kicker { font-size: .78rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(40, 50, 65, .05), 0 10px 22px rgba(40, 50, 65, .04);
}
.card.read { font-size: 1.03rem; }
.card.read p { white-space: pre-wrap; }

.prompt { font-size: 1.1rem; font-weight: 600; white-space: pre-wrap; margin-bottom: 16px; }

.opts { display: grid; gap: 10px; margin-bottom: 8px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px;
  border: 1.5px solid var(--line); background: var(--card);
  border-radius: var(--radius); padding: 14px 16px; min-height: var(--tap);
  text-align: left; width: 100%; font-weight: 500;
}
.opt .mark {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
  font-size: .85rem; font-weight: 700; color: var(--ink-faint);
}
.opt.sel { border-color: var(--indigo); background: var(--indigo-soft); }
.opt.sel .mark { border-color: var(--indigo); background: var(--indigo); color: #fff; }
.opt.right { border-color: #a8cfb8; background: var(--green-soft); }
.opt.right .mark { border-color: var(--green); background: var(--green); color: #fff; }
.opt.wrong { border-color: #d8aaa5; background: var(--red-soft); }
.opt.wrong .mark { border-color: var(--red); background: var(--red); color: #fff; }

textarea, input[type="text"] {
  width: 100%; font: inherit; color: inherit;
  border: 1.5px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; background: var(--card); resize: vertical;
}
textarea { min-height: 128px; line-height: 1.55; }
input[type="text"] { min-height: var(--tap); }
textarea:focus, input:focus { outline: 3px solid var(--indigo-soft); border-color: var(--indigo); }

.field { margin-bottom: 18px; }
.field > label { display: block; font-weight: 600; margin-bottom: 8px; }

.note { border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; font-size: .98rem; }
.note.ok { background: var(--green-soft); border: 1.5px solid #b9d9c7; }
.note.no { background: var(--red-soft); border: 1.5px solid #dfbbb6; }
.note.info { background: var(--indigo-soft); border: 1.5px solid var(--line-strong); }
.note.warn { background: var(--amber-soft); border: 1.5px solid #dec7bc; }
.note b { display: block; margin-bottom: 4px; }

details.hint { margin-top: 14px; border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 0 16px; background: var(--card); }
details.hint > summary { cursor: pointer; padding: 14px 0; font-weight: 600; color: var(--indigo); min-height: 50px; display: flex; align-items: center; list-style: none; }
details.hint > summary::-webkit-details-marker { display: none; }
details.hint > summary::before { content: "?"; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 10px; border-radius: 50%; background: var(--indigo-soft); font-weight: 800; }
details.hint[open] > summary::before { content: "!"; }
details.hint > p { padding-bottom: 14px; margin: 0; }

.navrow { display: flex; gap: 12px; align-items: center; margin-top: 22px; }
.navrow .spacer { flex: 1; }

/* ---------- passage drawer ---------- */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(26,28,34,.45); z-index: 50; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 51;
  width: min(560px, 92vw); background: var(--paper);
  border-left: 1.5px solid var(--line);
  display: flex; flex-direction: column;
}
.drawer header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; font-size: 1.05rem; flex: 1; }
.drawer .body { overflow-y: auto; padding: 18px 20px 60px; -webkit-overflow-scrolling: touch; }
.drawer .body h3 { color: var(--indigo); letter-spacing: .04em; font-size: .95rem; text-transform: uppercase; margin-top: 22px; }
.drawer .body h3:first-child { margin-top: 0; }

.vocab { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 16px; }
.vocab dt { font-weight: 700; }
.vocab dd { margin: 0 0 12px; color: var(--ink-soft); }

/* ---------- feedback ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  border: 1.5px solid var(--line); background: var(--card);
  border-radius: 999px; padding: 0 20px; min-height: 50px;
  display: inline-flex; align-items: center; font-weight: 600;
}
.chip.sel { border-color: var(--indigo); background: var(--indigo); color: #fff; }

.saved { color: var(--green); font-weight: 600; font-size: .92rem; }

/* ---------- parent ---------- */
.parent-badge { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
table.summary { width: 100%; border-collapse: collapse; font-size: .95rem; }
table.summary th, table.summary td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.summary th { color: var(--ink-faint); font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; }

.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.footnote { color: var(--ink-faint); font-size: .88rem; margin-top: 28px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script type="application/json" id="pack-data">{"pack_id":"spain-travel-2026-07","pack_title":"Spain Travel Pack","product_name":"Caesar Learning - Step by Step","days":7,"lessons":[{"machine_id":"caesar-eng-017-observation-vs-inference","day":1,"subject":"english","sequence":"017","family_display_label":"English 017","child_title":"Reading the Ground","estimated_minutes":25,"sections":[{"heading":"Orientation","body":"You already know how to find evidence in a text. Today you learn to ask a different question about a sentence: how did anybody come to know this? Some sentences report something that was directly seen or measured. Others report a conclusion that somebody built on top of that. Both can be true. They are not the same kind of statement, and mixing them up is one of the easiest ways to be fooled."},{"heading":"Teach","body":"An OBSERVATION is something taken directly from the world. Someone looked, or measured, or counted. 'The prints are three-toed.' 'This stride is longer than that stride.' If you went to Enciso with a tape measure you could check it yourself.\n\nAn INFERENCE is a conclusion built on observations. Nobody saw it; somebody worked it out. 'That animal was moving faster.' 'These animals travelled as a group.' You cannot check an inference with a tape measure. You check it by asking whether the observations really do lead there.\n\nTwo warnings.\n\nFirst, an inference is not a guess. A good inference is tightly tied to the evidence and can be argued for. 'Heavier animals pressed deeper' is a strong inference, because more weight really does press harder into soft ground. What makes it an inference is not that it is doubtful - it is that nobody watched it happen.\n\nSecond, inferences differ in strength. 'The deep prints were made by heavier animals' rests on something that is nearly always true. 'The parallel tracks were made by a herd' has a rival explanation sitting right beside it that fits the same evidence just as well. Same evidence, two possible stories, no way for the rock to choose - that inference is much weaker, and honest writing says so.\n\nThe habit to build: when you meet a statement, ask 'was this seen, or was this worked out?' Then, if it was worked out, ask 'could the same evidence have led somewhere else?'"},{"heading":"Worked Example","body":"Statement: 'The broad rounded prints sink deeper than the narrow three-toed ones.'\n\nSeen or worked out? Seen. You could go and look at the two prints and compare them. OBSERVATION.\n\nStatement: 'The animals that made the broad prints were heavier.'\n\nSeen or worked out? Nobody weighed a dinosaur. Somebody reasoned: heavier animals press harder, so deeper prints suggest heavier animals. INFERENCE - and a fairly strong one, because the connection between weight and depth is reliable.\n\nStatement: 'The parallel trackways were made by a herd travelling together.'\n\nINFERENCE, and a weak one. The passage hands you the reason: animals crossing the same shore in separate weeks would leave the same pattern. When a rival explanation fits the evidence equally well, the inference cannot carry much weight."}],"items":[{"id":"e1","phase":"guided","type":"choice","prompt":"Which of these statements from the passage is an OBSERVATION - something taken directly from the rock?","choices":[{"value":"A","text":"The narrow three-toed prints were made by dinosaurs walking on two legs."},{"value":"B","text":"In several places the prints run in a line, all pointing the same way."},{"value":"C","text":"The animal with the longer stride was moving faster."},{"value":"D","text":"The parallel trackways were made by a group travelling together."}],"answer":"B","hint":"Which one could you check yourself if you stood on the slope and looked?","explanation":"B describes what is visible on the rock - you could walk up and see it. A, C and D are all conclusions somebody built from what is visible. None of them was watched happening."},{"id":"e2","phase":"guided","type":"multi","prompt":"Select EVERY statement below that is an INFERENCE rather than an observation.","choices":[{"value":"A","text":"Some prints are three-toed and narrow."},{"value":"B","text":"Those prints were probably made by dinosaurs that walked on two legs."},{"value":"C","text":"Several trackways run roughly parallel to one another."},{"value":"D","text":"The animal with the longer stride was moving faster than its neighbour."},{"value":"E","text":"The parallel tracks were made by animals travelling as a group."}],"answer":["B","D","E"],"hint":"Three of these could be checked with your own eyes on the slope. The other three were worked out.","explanation":"A and C describe the prints themselves - anyone standing there could confirm them. B, D and E are conclusions built on those observations. The word 'probably' in B is a useful signal, but D and E carry no such word even though they are inferences too, which is exactly why you have to check every sentence rather than hunt for signal words.","distractor_note":"D and E deliberately omit hedging words so that the child cannot succeed by scanning for 'probably'."},{"id":"e3","phase":"guided","type":"choice","prompt":"In this passage, what does SEDIMENT mean?","choices":[{"value":"A","text":"A kind of dinosaur that walked on four legs"},{"value":"B","text":"Fine material that settles in layers and can harden into rock"},{"value":"C","text":"The gap between one footprint and the next"},{"value":"D","text":"A conclusion worked out from evidence"}],"answer":"B","hint":"Find the word in the passage and read the words immediately after it.","explanation":"The passage defines it in place: 'fine sediment - material that once settled in thin layers, then hardened.' C is the meaning of stride and D is the meaning of inference, both of which are also defined in the passage."},{"id":"e4","phase":"guided","type":"choice","prompt":"Which observation most directly supports the inference that one animal was moving faster than another?","choices":[{"value":"A","text":"Some of the prints are three-toed."},{"value":"B","text":"In one trackway the stride is much longer than in the trackway beside it."},{"value":"C","text":"The rock is made of fine sediment in thin layers."},{"value":"D","text":"The hills are near Enciso in La Rioja."}],"answer":"B","hint":"Which observation is actually about how far apart the steps are?","explanation":"Speed is inferred from stride, so the observation about stride length is the one doing the work. A, C and D are all true statements from the passage, but none of them has anything to do with how fast an animal was moving. True and relevant are two different tests."},{"id":"e5","phase":"independent","type":"structured","own_words_required":true,"prompt":"Write ONE of each, in your own words. Do not copy phrases from the passage - if you find yourself lifting a stretch of it, stop and say the idea your own way.","fields":[{"key":"observation","label":"An OBSERVATION from the passage - one sentence, your own words","kind":"open","own_words_required":true,"rubric":{"should_include":"Any statement that could be checked by looking directly at the rock: the prints come in two shapes, some run in lines, one trackway has wider gaps than another, the deeper prints are the round ones, the rock is layered. Must be in the child's own wording.","sample":"Some of the footprints are narrow with three toes, and others are wide, round and pressed in deeper.","acceptable_range":"Any genuine observation from the passage, reworded. Small borrowings of unavoidable nouns (footprint, trackway, stride) are fine; a copied clause is not.","insufficient":"Copies a sentence or long phrase from the passage; or gives an inference (speed, weight, herding) rather than an observation."}},{"key":"inference","label":"An INFERENCE from the passage - one sentence, your own words","kind":"open","own_words_required":true,"rubric":{"should_include":"Any conclusion built on the evidence: the round prints came from heavier animals, the two-legged / four-legged split, the longer-stride animal moved faster, or the herd reading of the parallel tracks. Must be in the child's own wording.","sample":"Scientists think the animals that made the deep round prints were much heavier, because heavy things push further into soft ground.","acceptable_range":"Any genuine inference from the passage, reworded. Adding the reasoning behind it is a strong answer.","insufficient":"Copies from the passage; or gives an observation rather than an inference; or invents a conclusion the passage does not contain."}}],"hint":"Cover the passage with your hand. Say the idea out loud in the way you would tell a friend. Then write down what you said."},{"id":"e6","phase":"independent","type":"open","prompt":"Two inferences from the passage: (1) the deep round prints were made by heavier animals, and (2) the parallel trackways were made by a group travelling together. One of these is much more secure than the other. In one or two sentences, say which one is weaker and explain what makes it weaker.","hint":"For the weaker one, the passage itself gives you a second explanation that fits the same evidence. What is it?","rubric":{"should_include":"Identifies the HERD inference as the weaker one, and explains that a rival explanation fits the same evidence equally well - animals crossing the same shore on many separate occasions would also leave parallel tracks - so the tracks cannot decide between the two. May contrast this with the weight inference, where depth and weight are reliably connected.","sample":"The herd one is weaker, because the passage says animals could have crossed the same muddy shore in different weeks and still left parallel tracks. The evidence fits two different stories, so it cannot show which one happened. The heavier-animal one is stronger because heavy things really do press deeper into soft ground.","acceptable_range":"Must name the herd inference as weaker and must identify the rival explanation as the reason. Explicit contrast with the weight inference strengthens the answer but is not required.","insufficient":"Names the weaker inference without explaining why; or says it is weaker because 'nobody saw it', which is true of BOTH inferences and therefore does not separate them."}},{"id":"e7","phase":"independent","type":"multi","prompt":"Select EVERY question below that CANNOT be answered from this passage alone.","choices":[{"value":"A","text":"Were the parallel trackways made on the same day?"},{"value":"B","text":"Do some of the prints have three toes?"},{"value":"C","text":"What colour were the dinosaurs?"},{"value":"D","text":"Are these footprint hills in Spain?"},{"value":"E","text":"Exactly how fast was the long-stride animal running?"}],"answer":["A","C","E"],"hint":"For each one, try to point to the sentence that answers it. If you cannot point at one, it cannot be answered.","explanation":"A is precisely the open question the passage describes as argued-about. C is never mentioned at all - footprints carry no colour. E cannot be answered exactly, because the passage says the speed is an estimate resting on another estimate. B and D are both stated plainly and can be pointed to."},{"id":"e8","phase":"challenge","type":"open","prompt":"CHALLENGE - three parts.\n\nHere is a sentence that has quietly fused an observation and an inference into one:\n\n    'The deep round prints sink further into the rock than the three-toed ones, which shows that the animals that made them were heavier.'\n\n(a) Split it into TWO clean sentences: one that is pure observation, and one that is pure inference. Use your own words.\n(b) Say what makes each of your two sentences the kind of statement it is.\n(c) Now a harder one. Near the start, the passage says the rock is made of fine sediment that 'once settled in thin layers, then hardened.' Nobody watched that happen either. Is that statement an observation or an inference? Defend your answer.","hint":"For (a), find the joining words - 'which shows that' is where one kind of statement turns into the other. For (c), ask what part of that sentence someone can see today, and what part is a story about the distant past.","rubric":{"should_include":"(a) Two separate sentences in the child's own words: an observation about the round prints being deeper than the three-toed ones, and an inference that the animals making them were heavier. (b) The observation is checkable by looking at the rock now; the inference was worked out and nobody witnessed it. (c) A defended answer. The strongest response recognises that it is an INFERENCE - the layers are visible today, but 'settled, then hardened' is a reconstruction of events nobody watched, exactly like the dinosaur conclusions - and notes that the passage presents it as plain fact without flagging it, which is what makes it easy to miss. An answer of 'partly both' is fully acceptable if the child separates the visible layering (observation) from the story of how it got that way (inference).","sample":"(a) The round prints are pressed deeper into the rock than the three-toed ones. Scientists think this means the animals that made the round prints were heavier.\n(b) The first one is an observation because anyone standing on the slope could look at the two prints and see which is deeper. The second is an inference because nobody ever weighed those animals - somebody worked it out from how deep the prints are.\n(c) I think it is an inference. You can see the thin layers in the rock today, and that part is an observation. But nobody was there to watch the material settle and harden - that is a story worked out from what the rock looks like now. What makes it tricky is that the passage says it like a plain fact, without any word like 'probably', so it slips past you.","acceptable_range":"(a) and (b) must be correct and in own words. In (c), either 'inference' or a well-argued 'partly both' counts as correct provided the child separates what is visible now from what is reconstructed about the past. Noticing that the passage presents it without hedging is a strong observation.","insufficient":"Copies the original sentence in (a) rather than rewording; gives two sentences without saying what makes each one what it is; or answers (c) with a bare 'observation' or 'inference' and no defence."},"challenge_justification":"Parts (a) and (b) already go beyond the practice items, which supply pre-sorted statements to label - here the child must find the seam inside a fused sentence and cut it. Part (c) is the genuinely hard move: it turns the lesson's tool back on a sentence the passage presents as settled fact, in a part of the text explicitly headed WHAT THE ROCK SHOWS. Nothing in the lesson flags it, and the child must notice that a statement can sit under an 'observation' heading and still be an inference. It rewards scepticism about the text itself rather than compliance with it."}],"today_you_learned":"Every statement has a history: it was either seen or worked out. An observation can be checked by looking; an inference is a conclusion built on top of observations and has to be checked by asking whether the evidence really leads there. Inferences are not guesses, and they are not all equally strong - the moment a rival explanation fits the same evidence just as well, the inference gets weak, however confidently it is written. And texts do not always warn you: a sentence can hold both kinds at once, or present an inference as if it were plain fact.","passage":{"title":"Reading the Ground","subtitle":"The footprint hills of Enciso, La Rioja, northern Spain","structure":"two_part_explainer_shows_vs_means","approx_words":300,"blocks":[{"kind":"heading","text":"WHAT THE ROCK SHOWS"},{"kind":"para","text":"In the hills around Enciso, in La Rioja in northern Spain, bare slopes of rock carry dinosaur footprints - not a few, but a great many. Some are three-toed and narrow, roughly the length of a shoe. Others are broad and rounded and sink deeper than the first kind. In several places the prints are not scattered at random. They run in a line, one after another, all pointing the same way. A line of prints like that is called a trackway."},{"kind":"para","text":"The rock holding these prints is made of fine sediment - material that once settled in thin layers, then hardened. On one slope, several trackways run roughly parallel to one another. In one of those trackways the gap between a print and the next print, which is called the stride, is much longer than the stride in the trackway beside it."},{"kind":"heading","text":"WHAT SCIENTISTS WORK OUT FROM IT"},{"kind":"para","text":"Nobody watched any of this happen. Everything in this part of the article is inference: a conclusion built on evidence rather than something seen."},{"kind":"para","text":"The narrow three-toed prints were probably made by dinosaurs that walked on two legs. The broad rounded ones were probably made by far heavier animals moving on four legs, which is why they pressed deeper into the ground."},{"kind":"para","text":"The long stride suggests that animal was moving faster than its neighbour. Researchers estimate speed by comparing stride with leg length - but leg length has itself to be estimated from the print, so the speed is an estimate resting on another estimate."},{"kind":"para","text":"The parallel trackways are the most argued-about of all. Some researchers read them as a group of animals travelling together. Others point out that animals crossing the same muddy shore over many separate weeks would also leave parallel tracks, without a single one of them ever meeting another. The rock cannot tell the difference between a herd and a well-used path."}]},"vocabulary":[{"term":"trackway","gloss":"a line of footprints made by one animal, one after another"},{"term":"stride","gloss":"the gap between one footprint and the next in a trackway"},{"term":"sediment","gloss":"fine material that settles in layers and can harden into rock"},{"term":"inference","gloss":"a conclusion worked out from evidence, rather than something directly seen"}]},{"machine_id":"caesar-math-017-equivalent-fractions-scaling","day":1,"subject":"math","sequence":"017","family_display_label":"Math 017","child_title":"Equivalent Fractions: Why Scaling Works","estimated_minutes":25,"sections":[{"heading":"Orientation","body":"Today the numbers get smaller and the thinking gets bigger. You have spent eight lessons on percent, and your calculating is strong. Fractions are the same idea wearing different clothes. By the end of this lesson you should be able to answer a question you have never been asked before: not just how to make an equivalent fraction, but why it works at all - and how to catch a method that only looks like it works."},{"heading":"Teach","body":"Take a chocolate bar split into 4 equal pieces. You take 3 of them: 3/4. Now score every piece down the middle. Nothing has been added and nothing taken away - the bar is the same size and your share is the same size - but now the bar is in 8 pieces and you are holding 6 of them. 3/4 and 6/8 are the same amount with different names.\n\nWhat happened in symbols: 3/4 = (3 x 2)/(4 x 2) = 6/8. The number of pieces you hold doubled, and the number of pieces in the whole doubled. Those two doublings cancel each other out.\n\nHere is the reason underneath. 2/2 = 1. Multiplying anything by 1 leaves it alone. So 3/4 x 2/2 is really 3/4 x 1, and 3/4 x 1 is just 3/4. Scaling a fraction is multiplying by 1 in disguise. That is the whole trick, and it is why the factor on the top and the factor on the bottom must be the same number. If they are different, you are no longer multiplying by 1, and the value moves."},{"heading":"Worked Example - three representations of one fact","body":"Claim: 2/3 = 8/12.\n\nArea model. Draw a rectangle in 3 equal columns and shade 2. Now cut it into 4 equal rows. You have not changed the shaded area, but the rectangle is now 12 small boxes and 8 of them are shaded. Same shading, new count.\n\nNumber line. Mark 0 and 1. Split into thirds; 2/3 sits at the second mark. Now split each third into 4; the line has 12 steps, and that same point is the 8th step. The point never moved - only the ruler got finer.\n\nEquation. 2/3 = (2 x 4)/(3 x 4) = 8/12, because 4/4 = 1.\n\nAll three say the same thing. The area model shows the pieces, the number line shows the position, the equation shows the reason."},{"heading":"Common Mistake","body":"Leo writes 3/4 = 4/5. His reason: 'I added 1 to the top and 1 to the bottom, so it is fair to both.'\n\nFair is not the test. Value is the test. 3/4 = 0.75 and 4/5 = 0.80, so these are different numbers - adding broke it. Multiplying does not break it because n/n = 1, and multiplying by 1 changes nothing. There is no similar rule for adding: n + 1 over n + 1 is not something you can factor out of a fraction. Adding the same number to top and bottom always moves a fraction closer to 1, which is exactly what happened to Leo: 0.75 moved up to 0.80."}],"items":[{"id":"m1","phase":"retrieval","type":"choice","prompt":"Spaced retrieval from an earlier lesson. A jacket price is multiplied by 0.80 to get the sale price. What is the discount rate?","choices":[{"value":"A","text":"80%"},{"value":"B","text":"20%"},{"value":"C","text":"0.80%"},{"value":"D","text":"120%"}],"answer":"B","hint":"The multiplier tells you how much is left. The rate tells you how much came off.","explanation":"0.80 is the multiplier: 80% of the price remains. The rate is what was taken off: 100% - 80% = 20%. The multiplier and the rate are never the same number for a discount.","verify":{"kind":"multiplier_to_rate","multiplier":0.8,"direction":"decrease","expect_rate_percent":20}},{"id":"m2","phase":"guided","type":"choice","prompt":"You have 3/4 and you cut every piece into 5 smaller pieces. Which fraction names the same amount?","choices":[{"value":"A","text":"15/20"},{"value":"B","text":"8/9"},{"value":"C","text":"3/20"},{"value":"D","text":"15/4"}],"answer":"A","hint":"Both the pieces you hold and the pieces in the whole get cut by 5.","explanation":"3/4 = (3 x 5)/(4 x 5) = 15/20. Choice B added 5 to only part of it. Choice C scaled only the denominator, which shrinks the value. Choice D scaled only the numerator, which grows it.","verify":{"kind":"scale_fraction","frac":[3,4],"factor":5,"expect":[15,20]}},{"id":"m3","phase":"guided","type":"numeric","prompt":"Fill in the missing numerator: 2/3 = ? / 12","answer":8,"hint":"What do you multiply 3 by to reach 12? Do the same to the 2.","explanation":"3 x 4 = 12, so the factor is 4. Then 2 x 4 = 8, giving 8/12.","verify":{"kind":"fill_numerator","frac":[2,3],"target_denominator":12,"expect":8}},{"id":"m4","phase":"guided","type":"open","prompt":"In ONE sentence, in your own words: why does multiplying the top and the bottom by the same number leave a fraction's value unchanged?","hint":"Think about what 4/4 equals, and what multiplying by that does.","rubric":{"should_include":"States that multiplying top and bottom by the same number is the same as multiplying by 1 (because n/n = 1), or that the whole is cut into more pieces of proportionally smaller size so the amount held is the same.","sample":"Because multiplying the top and bottom by 4 is really multiplying by 4/4, and 4/4 is just 1, so the fraction stays the same size.","acceptable_range":"Either the 'multiplying by 1' reason or a clear 'more pieces, each smaller, same total amount' reason is enough. Own wording expected; exact phrasing is not required.","insufficient":"Only restates the rule ('you do the same to both') without giving a reason, or describes the procedure without saying why the value is preserved."}},{"id":"m5","phase":"error_analysis","type":"choice","prompt":"Leo claims 3/4 = 4/5 because he added 1 to the top and 1 to the bottom. Which single check most clearly proves him wrong?","choices":[{"value":"A","text":"Both fractions are less than 1."},{"value":"B","text":"3/4 = 0.75 but 4/5 = 0.80, so they are different numbers."},{"value":"C","text":"Both fractions use small numbers."},{"value":"D","text":"In both fractions the bottom is 1 more than the top."}],"answer":"B","hint":"A check has to be able to come out 'no'. Which option could ever fail?","explanation":"Only B compares the actual values. A, C and D are true statements about both fractions, but a check that is true no matter what cannot prove anything. Note that D is exactly the pattern Leo trusted - and it is true of both fractions even though they are not equal, which shows the pattern is worthless as evidence.","verify":{"kind":"compare_decimals","left":[3,4],"right":[4,5],"expect_left":0.75,"expect_right":0.8,"expect_equal":false}},{"id":"m6","phase":"independent","type":"multi","prompt":"Select EVERY fraction below that equals 2/5.","choices":[{"value":"A","text":"4/10"},{"value":"B","text":"6/15"},{"value":"C","text":"2/10"},{"value":"D","text":"10/25"},{"value":"E","text":"4/7"}],"answer":["A","B","D"],"hint":"For each one, ask: is there a single number that multiplies BOTH the 2 and the 5 to give this pair?","explanation":"A is 2/5 scaled by 2. B is scaled by 3. D is scaled by 5. C scaled only the denominator (2/10 = 1/5). E added 2 to the top and 2 to the bottom, which is Leo's broken method again.","verify":{"kind":"equivalent_set","frac":[2,5],"candidates":{"A":[4,10],"B":[6,15],"C":[2,10],"D":[10,25],"E":[4,7]},"expect":["A","B","D"]}},{"id":"m7","phase":"independent","type":"structured","prompt":"Write 5/8 with a denominator of 40. You must fill in BOTH boxes - the answer is not finished without the check.","fields":[{"key":"value","label":"The missing numerator","kind":"numeric","answer":25,"verify":{"kind":"fill_numerator","frac":[5,8],"target_denominator":40,"expect":25}},{"key":"check","label":"Your check - how do you know this is right?","kind":"open","rubric":{"should_include":"Any genuine verification: dividing 25/40 back down by 5 to recover 5/8, or comparing decimals (5/8 = 0.625 and 25/40 = 0.625), or restating the factor used on both parts.","sample":"I multiplied 8 by 5 to get 40, so I multiplied 5 by 5 to get 25. Checking backwards, 25 divided by 5 is 5 and 40 divided by 5 is 8, which gives 5/8 again.","acceptable_range":"Any check that could have come out wrong is acceptable.","insufficient":"Writes 'it is right' or repeats the multiplication without any independent verification."}}],"hint":"8 x 5 = 40.","explanation":"8 x 5 = 40, so 5 x 5 = 25 and 5/8 = 25/40. Backward check: 25/40 divided top and bottom by 5 returns 5/8. Decimal check: both equal 0.625."},{"id":"m8","phase":"challenge","type":"open","prompt":"CHALLENGE. Mia invents her own rule: 'To make an equivalent fraction, multiply the top by 3 and the bottom by 2. Both parts get multiplied, so it is fair.' She tests it on 2/6 and gets 6/12, and says 'it works, because 2/6 and 6/12 both have a 6 in them.'\n\n(a) Use Mia's OWN example to show that her rule is broken.\n(b) Name the exact step in her reasoning that fails, and say what the rule must be instead.","hint":"Simplify 2/6 as far as it will go. Then simplify 6/12 as far as it will go. Compare.","rubric":{"should_include":"(a) Simplifies or converts both: 2/6 = 1/3 and 6/12 = 1/2, so they are not equal - Mia's rule changed the value. (b) Identifies that the two factors must be EQUAL, because only n/n equals 1; multiplying by 3/2 multiplies the fraction by 1.5. Also rejects her 'both have a 6 in them' evidence as meaningless.","sample":"(a) 2/6 simplifies to 1/3, and 6/12 simplifies to 1/2. 1/3 is not 1/2, so her rule changed the value. (b) The broken step is using two different factors. Multiplying by 3 on top and 2 on the bottom is multiplying by 3/2, which is 1.5, not 1. The factors have to be the same number so that they make n/n = 1. Also, both fractions containing a 6 proves nothing - that is a coincidence, not a check.","acceptable_range":"Any correct demonstration that the two results differ (simplifying, decimals 0.333 vs 0.5, or common denominators) plus a statement that the factors must be identical. Naming 3/2 = 1.5 explicitly is a strong answer but is not required.","insufficient":"Says only 'she is wrong' or 'you must do the same to both' without demonstrating the failure on her own numbers, or shows the failure without naming why equal factors are required."},"challenge_justification":"Cannot be solved by copying the practice procedure. Practice asks the child to APPLY scaling; this asks him to falsify a rule using its own example, diagnose the precise broken step, and reject a piece of false evidence. It requires error analysis plus the multiply-by-1 concept, not computation."}],"today_you_learned":"An equivalent fraction is the same amount with a different name. Scaling works because multiplying the top and bottom by the same number is multiplying by n/n, which is 1 - and multiplying by 1 changes nothing. That is also why the two factors must match: different factors mean you are no longer multiplying by 1, and the value moves. Adding the same number to the top and bottom is not scaling, and it always drags a fraction toward 1.","passage":null,"vocabulary":[]},{"machine_id":"caesar-eng-018-evidence-strength","day":2,"subject":"english","sequence":"018","family_display_label":"English 018","child_title":"The Jump That Changed the Rules","estimated_minutes":25,"sections":[{"heading":"Orientation","body":"Yesterday you sorted statements by how they were known. Today you sort them by how much WORK they do. Here is the uncomfortable idea: a piece of evidence can be a hundred percent true, famous, and completely convincing to most people - and still be weak support for the exact claim under discussion. Learning to see that is one of the most useful things reading can teach you."},{"heading":"Bridge From Yesterday","body":"Day 1: an inference gets weak the moment a rival explanation fits the same evidence just as well. Today that idea gets sharper. You will meet a piece of evidence with a rival explanation sitting right beside it - and you will meet another that quietly supports a completely different claim while looking like support for this one."},{"heading":"Teach","body":"Every piece of evidence has to be tested against ONE specific claim. Not 'is this true?' but 'does this make THIS claim more likely?'\n\nThree questions to ask.\n\nIS IT ABOUT THE MECHANISM, OR ABOUT THE OUTCOME? The claim here says the flop lets a jumper clear a higher bar for the same effort. That is a claim about HOW the technique works. Evidence that explains the how - the centre of mass passing under the bar - goes straight at the claim. Evidence about a result, like winning a medal, is one step removed.\n\nCOULD IT HAVE HAPPENED ANYWAY? A single win has rival explanations queueing up. Perhaps Fosbury was simply the strongest jumper in the field that day. Perhaps his rivals had a bad afternoon. One result cannot separate a good technique from a good athlete. That does not make the medal untrue - it makes it weak.\n\nDOES IT SUPPORT A DIFFERENT CLAIM INSTEAD? This is the sharpest test. The foam mats are true, important, and interesting. But they do not tell you the flop is more efficient. They tell you the flop became SAFE ENOUGH TO PRACTISE. That is a different claim - about why it spread, not about whether it works better. Evidence that supports a neighbouring claim is not weak evidence for yours. It is not evidence for yours at all.\n\nRanked by strength for this particular claim:\n\n    STRONGEST   the centre-of-mass explanation - it says why the technique works\n    MIDDLE      near-universal adoption - many independent experts, over years, but they could all follow a fashion\n    WEAK        the 1968 gold medal - one athlete, one afternoon, rival explanations available\n    NOT SUPPORT the foam mats - true, but about safety and spread, not about efficiency"},{"heading":"Worked Example","body":"Claim: 'Wearing a red shirt makes you run faster.'\n\nEvidence offered: 'The winner of last Saturday's race was wearing a red shirt.'\n\nTrue? Suppose it is. Does it support the claim? Barely. One runner, one race, and the obvious rival explanation is that the winner was simply the fastest runner and happened to own a red shirt. Nothing here connects the colour to the speed.\n\nWhat WOULD support it? Something that explains a mechanism - a reason red could affect speed - or a comparison in which the same runners raced in different colours and were timed. Notice that the weak evidence and the strong evidence can both be true. Truth is not the thing being measured. Connection to the claim is."}],"items":[{"id":"e1","phase":"retrieval","type":"choice","prompt":"Day 1 retrieval. Which of these is an OBSERVATION rather than an inference?","choices":[{"value":"A","text":"The flop is a more efficient way to cross a bar."},{"value":"B","text":"Fosbury won the gold medal at the Mexico City Olympics in 1968."},{"value":"C","text":"Jumpers switched to the flop because it works better."},{"value":"D","text":"The old techniques wasted effort."}],"answer":"B","hint":"Which one is a record of something that happened, rather than a conclusion about why?","explanation":"B is a recorded result - it was watched by a stadium full of people and written down. A, C and D are all conclusions somebody worked out. Notice that B, the only observation here, turns out later in this lesson to be WEAK evidence: being an observation and being strong support are two completely different things."},{"id":"e2","phase":"guided","type":"choice","prompt":"In this passage, what is a person's CENTRE OF MASS?","choices":[{"value":"A","text":"The middle of their chest"},{"value":"B","text":"The point their body balances around, which is the point they really have to lift"},{"value":"C","text":"The highest part of the body as it crosses the bar"},{"value":"D","text":"The amount of effort a jump takes"}],"answer":"B","hint":"Read the first two sentences of Evidence 1 again.","explanation":"The passage defines it as 'the point it balances around' and adds that lifting yourself really means lifting this point. C is the opposite of the key idea - the whole surprise of the flop is that the centre of mass is NOT the highest thing crossing the bar. In fact it can pass underneath it."},{"id":"e3","phase":"guided","type":"choice","prompt":"Which piece of evidence gives the STRONGEST support for the claim that the flop lets a jumper clear a higher bar for the same effort?","choices":[{"value":"A","text":"Evidence 1 - the arch lets the centre of mass pass below the bar, so it does not have to be lifted as high."},{"value":"B","text":"Evidence 2 - Fosbury won gold in 1968."},{"value":"C","text":"Evidence 3 - nearly every jumper adopted the flop within about ten years."},{"value":"D","text":"Evidence 4 - foam mats replaced sand and sawdust pits."}],"answer":"A","hint":"The claim is about HOW the technique works. Which evidence is also about how it works?","explanation":"Only Evidence 1 explains a mechanism - it gives a reason why less lifting is needed, which is exactly what the claim asserts. B is a single result, C is about how many people do it, and D is about safety. All are true; only A goes straight at the claim.","verify":{"kind":"evidence_rank","strongest":"A","weakest_of_supporting":"B","not_support":"D"}},{"id":"e4","phase":"guided","type":"multi","prompt":"Select EVERY statement below that is TRUE according to the passage but does NOT actually support the claim about efficiency.","choices":[{"value":"A","text":"Foam mats made it safe to land on your back."},{"value":"B","text":"The arch lets the centre of mass pass below the bar."},{"value":"C","text":"Fosbury turned his back on the bar and went over head first."},{"value":"D","text":"The technique is named after him."},{"value":"E","text":"Nearly every serious jumper adopted the flop."}],"answer":["A","C","D"],"hint":"Three of these are true facts that would still be true even if the flop were no better than the old way. Find those three.","explanation":"A explains why the flop became safe to practise, not why it works better. C simply describes what the technique looks like - a description is not an argument. D is about naming, which has nothing to do with efficiency. B is the mechanism, which does support the claim, and E gives real if imperfect support, since a great many expert jumpers chose it over years.","distractor_note":"C and D are deliberately included because descriptive and naming facts feel relevant while carrying no argumentative weight at all."},{"id":"e5","phase":"independent","type":"choice","prompt":"Put Evidence 1, 2 and 3 in order from STRONGEST support for the claim to WEAKEST support.","choices":[{"value":"A","text":"Evidence 1, then Evidence 3, then Evidence 2"},{"value":"B","text":"Evidence 2, then Evidence 1, then Evidence 3"},{"value":"C","text":"Evidence 3, then Evidence 2, then Evidence 1"},{"value":"D","text":"Evidence 1, then Evidence 2, then Evidence 3"}],"answer":"A","hint":"Mechanism beats many people agreeing, and many people agreeing beats one result on one afternoon.","explanation":"Evidence 1 explains why the technique works, so it is strongest. Evidence 3 comes next: many expert jumpers, choosing independently over about a decade, is much harder to explain away than a single result - though it is still possible that a fashion spread through coaching. Evidence 2 is weakest, because one win by one athlete on one day can just as easily mean he was the best jumper there.","verify":{"kind":"evidence_order","expect":["E1","E3","E2"]}},{"id":"e6","phase":"independent","type":"structured","own_words_required":true,"prompt":"Now write it. Do not copy from the passage.","fields":[{"key":"strongest","label":"Which evidence is strongest?","kind":"choice","choices":[{"value":"1","text":"Evidence 1 - centre of mass passes below the bar"},{"value":"2","text":"Evidence 2 - the 1968 gold medal"},{"value":"3","text":"Evidence 3 - nearly everyone adopted it"},{"value":"4","text":"Evidence 4 - foam landing mats"}],"answer":"1"},{"key":"why","label":"In your own words, one or two sentences: why is it stronger than Evidence 2 in particular?","kind":"open","own_words_required":true,"rubric":{"should_include":"Contrasts a mechanism with a single result: Evidence 1 explains WHY less lifting is needed, which is what the claim is about, while Evidence 2 is one athlete on one day and could equally be explained by him simply being the best jumper in the competition.","sample":"Evidence 1 actually explains why the jump takes less lifting, which is exactly what the claim says. Evidence 2 is just one person winning once, and he might have won because he was the best jumper there anyway, not because of how he jumped.","acceptable_range":"Any answer that names the mechanism-versus-single-result contrast, in own words. Naming the rival explanation for the medal is a strong addition.","insufficient":"Says Evidence 1 is 'more scientific' or 'better' without saying what it does that Evidence 2 does not; or copies the passage's wording."}}],"hint":"One of them tells you WHY the technique works. The other tells you WHAT happened once."},{"id":"e7","phase":"independent","type":"open","prompt":"Evidence 4 - the foam mats - is true and important, but it does not support the efficiency claim. In one or two sentences of your own, say what claim the foam mats DO support.","hint":"Ask what changed because of the mats. Not whether the flop works better, but what became possible.","rubric":{"should_include":"States that the mats support a claim about SAFETY or about why the technique spread and could be practised - landing on your back and shoulders is dangerous in sand but safe on deep foam, so the mats explain why jumpers were able to take the technique up, not whether it is more efficient.","sample":"The mats support the claim that the flop only became safe enough to practise once there was something soft to land on. That explains why people were able to start using it, but it says nothing about whether it gets you over a higher bar.","acceptable_range":"Any answer identifying safety or the possibility of practising and spreading as the supported claim, and keeping it separate from efficiency.","insufficient":"Says the mats 'helped the flop' without naming a different claim; or argues the mats do support the efficiency claim after all."}},{"id":"e8","phase":"challenge","type":"open","prompt":"CHALLENGE - two parts.\n\nEvidence 2 is completely true: Fosbury really did win the gold medal in 1968. Most people would treat that as the knockout argument.\n\n(a) Explain carefully why that true fact is WEAK support for the claim that the flop is a more efficient way to cross a bar. Give at least one rival explanation that fits the gold medal just as well.\n\n(b) Describe what evidence WOULD settle it - something that could be gathered, at least in principle, that would separate 'the technique is better' from 'he was the better athlete'. Say what result would support the claim and what result would count against it.","hint":"For (a), ask what else could make one person win one competition. For (b), you want the same jumpers, not different ones - so that the only thing changing is the technique.","rubric":{"should_include":"(a) Explains that a single result from a single athlete on a single day cannot separate the technique from the athlete; supplies at least one genuine rival explanation - Fosbury may simply have been the best jumper in that field, his rivals may have performed badly, or conditions may have favoured him. May add that the medal is about an outcome while the claim is about a mechanism. (b) Proposes a comparison that holds the athlete constant and varies the technique - for example the SAME jumpers trained in both techniques and measured, or many jumpers measured before and after switching - and states both directions: if the same people clear higher bars with the flop, the claim gains support; if they clear the same height or lower, the claim is undermined.","sample":"(a) Winning one competition only shows that he beat the other people who were there that day. He might simply have been the strongest jumper in that field, and he would then have won with the old technique too. Or the others might have had a bad day. The medal is about who won, but the claim is about how the jump works, and one result cannot tell those apart.\n(b) I would take the same group of jumpers and measure how high each of them clears using the old technique, then train them in the flop and measure again. Because it is the same people both times, the only thing that changed is the technique. If most of them clear a higher bar with the flop, that supports the claim. If they clear the same height or less, it goes against it.","acceptable_range":"(a) must contain at least one concrete rival explanation, not merely 'it is only one event'. (b) must hold the athlete or athletes constant in some way and must state what would count AGAINST the claim as well as for it. Any reasonable comparison design counts.","insufficient":"(a) answered only as 'it is just one competition' with no rival explanation offered; (b) proposing 'more research' or 'ask an expert' with no design; or (b) giving only the supporting result and never saying what would count against the claim."},"challenge_justification":"The practice items ask the child to rank evidence he has been given. This item requires him to argue AGAINST the most emotionally convincing fact in the passage, generate his own rival explanation rather than pick one from a list, and then design a comparison that isolates one variable. Part (b) also demands that he state a falsifying result - what would count against the claim - which no earlier item in the pack has asked for and which is a genuinely harder move than supporting a claim."}],"today_you_learned":"Truth and strength are different tests. A statement can be completely true and still barely support the claim it is offered for. Evidence about a MECHANISM - why something works - is stronger than evidence about a single OUTCOME, because one result always has rival explanations standing beside it. Many experts choosing the same thing over years is real support, but it is not proof, because fashions spread too. And the sharpest trap of all is evidence that quietly supports a DIFFERENT claim: the foam mats are true, important, and simply not about efficiency.","passage":{"title":"The Jump That Changed the Rules","structure":"argument_claim_then_four_supports_of_unequal_quality","approx_words":320,"blocks":[{"kind":"heading","text":"THE CLAIM"},{"kind":"para","text":"For a long time, high jumpers crossed the bar face down, rolling their bodies over it. Then a young American called Dick Fosbury started doing something that looked wrong. He ran at the bar, turned his back on it, and went over backwards, head first, arching his spine, landing on his shoulders. At the Mexico City Olympics in 1968 he won the gold medal doing it. Today almost every high jumper in the world jumps that way, and the technique carries his name: the Fosbury Flop."},{"kind":"para","text":"The claim to be tested is this: THE FLOP LETS A JUMPER CLEAR A HIGHER BAR THAN THE OLDER TECHNIQUES, FOR THE SAME AMOUNT OF EFFORT."},{"kind":"heading","text":"FOUR THINGS PEOPLE OFFER AS EVIDENCE"},{"kind":"para","text":"EVIDENCE 1. Every object has a point called its centre of mass - roughly, the point it balances around. When you lift yourself, it is really this point you have to lift, and lifting it higher costs more effort. In the old face-down techniques the whole body, centre of mass included, had to travel above the bar. In the flop, the jumper arches backwards so much that the body curls around the bar: head and shoulders cross first, then the hips, then the legs. Because the arch keeps the body curved around the bar rather than heaped above it, the centre of mass can pass BELOW the bar even while every part of the body passes above it. The jumper therefore does not have to lift that point as high."},{"kind":"para","text":"EVIDENCE 2. Fosbury won the gold medal in Mexico City in 1968."},{"kind":"para","text":"EVIDENCE 3. Within about ten years of those Games, nearly every serious high jumper had adopted the flop, and the older techniques almost disappeared from top competition."},{"kind":"para","text":"EVIDENCE 4. At around the same period, thick foam landing mats replaced the pits of sand and sawdust that jumpers had previously landed in. Landing flat on your back and shoulders is dangerous in sand. On deep foam it is not."},{"kind":"para","text":"All four of those statements are true. They are not all equally useful, and one of them is not really about the claim at all."}]},"vocabulary":[{"term":"technique","gloss":"a particular way of doing something"},{"term":"centre of mass","gloss":"the single point an object balances around; the point you are really lifting when you jump"},{"term":"adopt","gloss":"to start using something that someone else began"},{"term":"claim","gloss":"a statement someone is asking you to accept, which evidence has to support"}]},{"machine_id":"caesar-math-018-comparing-fractions-reasoning","day":2,"subject":"math","sequence":"018","family_display_label":"Math 018","child_title":"Comparing Fractions Without Grinding","estimated_minutes":25,"sections":[{"heading":"Orientation","body":"Yesterday you learned why an equivalent fraction is equivalent. Today you use that to compare fractions - but the point of the lesson is not getting the right order. The point is getting there cheaply. A strong mathematician looks at a pair of fractions and picks the least work that will settle it. Sometimes that is one glance. Grinding out a common denominator every time is like walking to a shop that is across the street by going round the block."},{"heading":"Bridge From Yesterday","body":"Day 1: scaling multiplies the top and bottom by the same factor, which is multiplying by n/n = 1, so the value is unchanged. You will use that today whenever you do choose to rewrite a fraction - and you will also learn when not to bother."},{"heading":"Teach","body":"Three routes. Learn all three and then choose.\n\nRoute 1 - BENCHMARK. Compare each fraction to a landmark, usually 1/2 or 1. A fraction is more than half when the top is more than half the bottom. 7/12 beats a half because 7 is more than 6. 5/11 does not, because 5 is less than 5.5. If one fraction lands above the landmark and the other lands below, you are already finished. This is the cheapest route when it works.\n\nRoute 2 - SAME NUMERATOR. If the tops match, the fraction with the SMALLER bottom is bigger. 3/5 beats 3/7 because you are holding three pieces either way, and fifths are bigger pieces than sevenths. Cutting a cake into more slices makes each slice smaller. This route feels backwards, which is exactly why people get it wrong.\n\nRoute 3 - SAME DENOMINATOR. If the bottoms match, the bigger top wins, because you are counting pieces of identical size. If the bottoms do not match, Day 1 scaling can make them match - but this is the most expensive route, so save it for when the first two fail.\n\nThe skill today is not knowing the three routes. It is looking at a pair and deciding which one to reach for."},{"heading":"Worked Example - route choice in action","body":"Compare 4/9 and 5/8. Benchmark: half of 9 is 4.5, and 4 is below it, so 4/9 is under a half. Half of 8 is 4, and 5 is above it, so 5/8 is over a half. Decided in one glance: 5/8 is larger. No scaling needed.\n\nCompare 3/7 and 3/11. Same numerator. Sevenths are bigger pieces than elevenths, and you hold three of them either way, so 3/7 is larger. Decided in one glance.\n\nCompare 5/8 and 7/12. Benchmark: half of 8 is 4 and 5 is above it; half of 12 is 6 and 7 is above it. Both are over a half - the benchmark cannot separate them. The tops do not match and the bottoms do not match. This is exactly when Route 3 earns its keep: 5/8 = 15/24 and 7/12 = 14/24, so 5/8 is larger. Notice that you only paid for the expensive route once you had checked that the cheap ones would not work.\n\nA note on the trick some people are taught: cross-multiplying 5/8 and 7/12 to get 60 against 56 gives the right answer, but if you cannot say why it works you have learned a hand movement, not a piece of mathematics. It works because it is the same-denominator route with the common denominator left out - 5 x 12 and 7 x 8 are the two numerators you would get over 96. Use it only when you can say that."},{"heading":"Common Mistake","body":"Sam says 4/5 is smaller than 4/9, 'because 9 is bigger than 5, so 4/9 must be bigger.'\n\nSam is reading the denominator as an amount. It is not - it is a piece size, and it counts backwards. A bigger denominator means the whole was cut into more pieces, so each piece is smaller. Sam holds 4 pieces in both cases, but his pieces are fifths in one and ninths in the other. 4/5 = 0.8 and 4/9 is about 0.44, so 4/5 is nearly twice as big. This is the single most common fraction error there is, and it is the reason Route 2 has to be practised rather than just read."}],"items":[{"id":"m1","phase":"retrieval","type":"choice","prompt":"Spaced retrieval. A ticket price is multiplied by 1.15. Which statement is exactly right?","choices":[{"value":"A","text":"The multiplier is 1.15 and the rate of increase is 15%."},{"value":"B","text":"The multiplier is 1.15 and the rate of increase is 115%."},{"value":"C","text":"The multiplier is 15 and the rate of increase is 1.15%."},{"value":"D","text":"The multiplier and the rate are both 1.15."}],"answer":"A","hint":"The rate is the distance from 1, not the multiplier itself.","explanation":"The multiplier 1.15 means the new price is 115% of the old one. The rate is how far the multiplier sits from 1: 1.15 - 1 = 0.15 = 15%. The multiplier and the rate are different numbers describing the same change.","verify":{"kind":"multiplier_to_rate","multiplier":1.15,"direction":"increase","expect_rate_percent":15}},{"id":"m2","phase":"retrieval","type":"numeric","prompt":"Day 1 retrieval. Fill in the missing numerator: 3/5 = ? / 20","answer":12,"hint":"5 x 4 = 20.","explanation":"The factor is 4, so 3 x 4 = 12 and 3/5 = 12/20.","verify":{"kind":"fill_numerator","frac":[3,5],"target_denominator":20,"expect":12}},{"id":"m3","phase":"guided","type":"choice","prompt":"Which is larger, 3/7 or 3/5 - and for the right reason?","choices":[{"value":"A","text":"3/7, because 7 is bigger than 5."},{"value":"B","text":"3/5, because fifths are bigger pieces than sevenths and you hold three of each."},{"value":"C","text":"They are equal, because both have 3 on top."},{"value":"D","text":"You cannot tell without a common denominator."}],"answer":"B","hint":"The tops match. So the only thing that differs is the size of one piece.","explanation":"Same-numerator route. Both fractions hold 3 pieces, so the winner is whichever has the larger piece. Cutting into 5 gives bigger pieces than cutting into 7, so 3/5 wins. Choice A is Sam's mistake. Choice D is true-but-wasteful: a common denominator would work, and it is not needed.","verify":{"kind":"compare_fractions","left":[3,7],"right":[3,5],"expect":"right"}},{"id":"m4","phase":"guided","type":"choice","prompt":"Exactly one of these fractions is greater than 1/2. Which one?","choices":[{"value":"A","text":"3/8"},{"value":"B","text":"4/9"},{"value":"C","text":"5/11"},{"value":"D","text":"7/12"}],"answer":"D","hint":"For each one, halve the denominator and compare that with the numerator.","explanation":"Half of 8 is 4 and 3 < 4. Half of 9 is 4.5 and 4 < 4.5. Half of 11 is 5.5 and 5 < 5.5. Half of 12 is 6 and 7 > 6, so only 7/12 clears the benchmark. Notice how close 4/9 and 5/11 are to a half - the benchmark still decides them, but only just.","verify":{"kind":"benchmark_half","candidates":{"A":[3,8],"B":[4,9],"C":[5,11],"D":[7,12]},"expect_greater":["D"]}},{"id":"m5","phase":"guided","type":"structured","prompt":"Compare 5/8 and 7/12. Answer both parts.","fields":[{"key":"value","label":"Which is larger?","kind":"choice","choices":[{"value":"A","text":"5/8"},{"value":"B","text":"7/12"},{"value":"C","text":"They are equal"}],"answer":"A","verify":{"kind":"compare_fractions","left":[5,8],"right":[7,12],"expect":"left"}},{"key":"route","label":"Why does the 1/2 benchmark NOT settle this pair, and which route did you use instead?","kind":"open","rubric":{"should_include":"States that BOTH fractions are greater than 1/2, so the benchmark puts them on the same side and cannot separate them; then names the route actually used (common denominator 24 giving 15/24 vs 14/24, or decimals 0.625 vs about 0.583, or a valid distance-from-1 comparison).","sample":"The benchmark does not work because 5/8 and 7/12 are both bigger than a half, so it puts them in the same group. I used a common denominator of 24: 5/8 = 15/24 and 7/12 = 14/24, so 5/8 is larger.","acceptable_range":"Any correct second route is fine. The required insight is that the benchmark fails because both land on the same side of 1/2.","insufficient":"Gives the larger fraction without explaining why the benchmark was not enough, or claims the benchmark did decide it."}},{"key":"check","label":"Your check - now confirm your answer using a DIFFERENT route from the one you just used.","kind":"open","rubric":{"should_include":"A second, genuinely different verification of the same comparison. If the child used a common denominator above, the check might be decimals (0.625 against about 0.583) or distance from 1 (5/8 is 3/8 short of 1, 7/12 is 5/12 short, and 3/8 is the smaller gap). If decimals were used above, the check might be the common denominator 24.","sample":"I used 24ths above, so for my check I turned them into decimals: 5 divided by 8 is 0.625 and 7 divided by 12 is about 0.583. 0.625 is bigger, which is the same answer, so it agrees.","acceptable_range":"Any second route that is genuinely different from the first and reaches the same conclusion.","insufficient":"Repeats the same route with the same numbers; or writes 'it is correct' with no second method. Two routes agreeing is what makes a check worth doing."}}],"hint":"Check both against 1/2 first, and notice what happens. For the last box, deliberately pick a route you have not already used.","explanation":"Half of 8 is 4 and 5 > 4; half of 12 is 6 and 7 > 6. Both clear the benchmark, so it cannot separate them. Scaling to 24ths gives 15/24 against 14/24, so 5/8 is larger by 1/24."},{"id":"m6","phase":"error_analysis","type":"open","prompt":"Sam writes: '4/5 is smaller than 4/9, because 9 is bigger than 5.' In one or two sentences, say what Sam has misunderstood about the bottom number, and give one number check that settles it.","hint":"What does the bottom number actually count?","rubric":{"should_include":"Identifies that the denominator gives PIECE SIZE, not amount, and that a larger denominator means smaller pieces - so with equal numerators the larger denominator gives the smaller fraction. Supplies a check (0.8 vs about 0.44, or 4/5 = 36/45 and 4/9 = 20/45, or a drawing described in words).","sample":"Sam is treating the bottom number like an amount, but it tells you how many pieces the whole was cut into, so a bigger bottom means smaller pieces. Check: 4/5 = 0.8 and 4/9 is about 0.44, so 4/5 is actually much bigger.","acceptable_range":"Any clear statement of the piece-size idea plus any correct numerical or common-denominator check.","insufficient":"Says only 'Sam is wrong' or gives the correct order without explaining what the denominator means, or explains without any check."}},{"id":"m7","phase":"independent","type":"multi","prompt":"Select EVERY fraction below that is LESS than 1/2.","choices":[{"value":"A","text":"3/8"},{"value":"B","text":"5/9"},{"value":"C","text":"4/10"},{"value":"D","text":"6/11"},{"value":"E","text":"7/15"}],"answer":["A","C","E"],"hint":"Compare each numerator with half of its own denominator.","explanation":"3 < 4 so 3/8 is under. 5 > 4.5 so 5/9 is over. 4 < 5 so 4/10 is under. 6 > 5.5 so 6/11 is over. 7 < 7.5 so 7/15 is under - only just, and that is the one worth double-checking.","verify":{"kind":"benchmark_half","candidates":{"A":[3,8],"B":[5,9],"C":[4,10],"D":[6,11],"E":[7,15]},"expect_less":["A","C","E"]}},{"id":"m8","phase":"challenge","type":"open","prompt":"CHALLENGE - three parts.\n\n    3/10        4/7        7/8        5/12\n\nRULE for the whole challenge: you may use a common denominator for AT MOST ONE comparison. Everything else must be settled by a benchmark, by same-numerator reasoning, or by distance from 1.\n\n(a) Put the four fractions in order from SMALLEST to LARGEST.\n(b) Give a short reason for each comparison you made, naming the route you used each time.\n(c) Say whether you needed your one common denominator at all - and if you did not use it, say which route saved you.","hint":"Start by splitting the four into 'under a half' and 'over a half'. Then handle each pair. For the two large ones, ask how far each is from 1.","rubric":{"should_include":"Correct order 3/10, 5/12, 4/7, 7/8. Uses the 1/2 benchmark to split {3/10, 5/12} from {4/7, 7/8}. Separates 3/10 from 5/12 by a cheap route - for example against the 1/3 benchmark, since 3/10 is below 1/3 and 5/12 is above 4/12 = 1/3 - or by a single permitted common denominator. Separates 4/7 from 7/8 by distance from 1: 7/8 is 1/8 short of 1 while 4/7 is 3/7 short, and 1/8 is a much smaller gap. Names the route at each step.","sample":"Order: 3/10, 5/12, 4/7, 7/8.\nBenchmark: 3 < 5 so 3/10 is under a half; 5 < 6 so 5/12 is under a half; 4 > 3.5 so 4/7 is over; 7 > 4 so 7/8 is over. That splits them into two pairs.\n3/10 against 5/12: 1/3 is 4/12, and 5/12 is above it. 1/3 is also 0.333, and 3/10 is 0.3, which is below it. So 3/10 is smaller. Route: a second benchmark, 1/3.\n4/7 against 7/8: 7/8 is only 1/8 away from 1, and 4/7 is 3/7 away from 1. 1/8 is much smaller than 3/7, so 7/8 is closer to 1 and therefore larger. Route: distance from 1.\nI did not need my common denominator at all.","acceptable_range":"The order must be exactly 3/10, 5/12, 4/7, 7/8. Reasoning routes may differ, but at most one comparison may use a common denominator and each step must carry a stated reason. Using the single permitted common denominator on the 3/10 vs 5/12 pair is fully acceptable.","insufficient":"Correct order with no reasons; or converting everything to a common denominator, which breaks the rule; or a stated route that does not actually decide the pair it is applied to."},"challenge_justification":"Not the practice procedure with bigger numbers. Practice items each hand the child a route; this item withholds the route, caps the expensive one at a single use, and forces a strategy decision at every step. It also requires a route the lesson only gestures at - distance from 1 - to be reconstructed for the 4/7 vs 7/8 pair. Ordering is the easy half; justification by cheapest route is the assessed skill."}],"today_you_learned":"Comparing fractions is a choice of route, not one procedure. Benchmark against 1/2 or 1 first, because when it works it costs one glance. If the tops match, the smaller bottom wins - bigger denominator, smaller pieces. If the bottoms match, the bigger top wins. Scale to a common denominator only when the cheap routes have failed, as they do when both fractions land on the same side of a benchmark. And distance from 1 is a fourth route worth remembering: whichever fraction has less missing is the larger one.","passage":null,"vocabulary":[]},{"machine_id":"caesar-eng-019-source-attribution","day":3,"subject":"english","sequence":"019","family_display_label":"English 019","child_title":"Who Saw It First","estimated_minutes":25,"sections":[{"heading":"Orientation","body":"Today's question is not 'is this true?' or 'how strong is this?' It is 'who is telling me, and how do they know?' That question decides more arguments than people realise - and this lesson is about a case where the most qualified people in Europe got it completely wrong, for twenty years, for a reason you will be able to name by the end."},{"heading":"Bridge From Yesterday","body":"Day 2: evidence is strong when it is tightly tied to the claim, and weak when rival explanations fit just as well. Today the same test gets applied to PEOPLE. A statement from someone who was there is tied to the world directly. A statement from someone working out of a report has a chain of other people in between - and every link in that chain is somewhere the information can go wrong."},{"heading":"Teach","body":"FIRSTHAND means the person was there. Maria looked up and saw painted bison on the ceiling. Nobody stands between her and the fact. If you want to know what was on that ceiling in 1879, she is as close to it as anybody can get.\n\nSECONDHAND means the knowledge arrived through somebody else. The experts in Paris and London read Sautuola's report and looked at drawings copied from the originals. Everything they knew about Altamira had passed through at least one other person first.\n\nSecondhand is not the same as untrue. Most of what you know is secondhand and perfectly reliable - you have not personally measured the distance to the Moon. What secondhand knowledge does is add links to a chain, and each link is a place where something can be lost or altered. A drawing copied from a painting is not the painting. A description of a colour is not the colour.\n\nNow the hard part, and the whole point of this lesson.\n\nBEING QUALIFIED AND HAVING ACCESS ARE TWO DIFFERENT THINGS. The prehistorians of 1880 knew far more about ancient tools and ancient bones than Sautuola ever would. Their expertise was real. But expertise operates on the information you feed it, and they were feeding theirs a copied drawing and a stranger's report. Sautuola knew less - and he had stood in the room.\n\nOne more distinction, and it is subtle. Being firsthand about a THING is not the same as being firsthand about a CLAIM about that thing. Sautuola saw the paintings firsthand. But 'these were made in prehistoric times' was not something he saw. It was something he worked out - an inference, in yesterday's language, built on firsthand observation."},{"heading":"Worked Example","body":"Statement: 'The bison are painted in red and black.'\n\nWho says so? Sautuola and his daughter, and anyone who has since stood in the cave. How do they know? They looked at the ceiling. FIRSTHAND.\n\nStatement: 'The Altamira paintings are a forgery.'\n\nWho says so? Leading prehistorians in the 1880s. How did they know? They read a report and studied copied drawings, and they discussed it among themselves. SECONDHAND - and, as it turned out, wrong.\n\nStatement: 'The paintings were made in the distant prehistoric past.'\n\nWho says so? Sautuola. How did he know? He saw the paintings firsthand, then reasoned about their age. So this one is an INFERENCE built on firsthand observation - stronger than the same claim from someone who had never been, but still not the same as having watched them being painted. Attribution is rarely a single word. The precise answer is usually a short sentence."}],"items":[{"id":"e1","phase":"retrieval","type":"choice","prompt":"Day 2 retrieval - evidence strength. Which of these gives the STRONGEST support for the claim that the Altamira paintings really were ancient?","choices":[{"value":"A","text":"Sautuola was certain they were ancient."},{"value":"B","text":"His daughter was the first person to notice them."},{"value":"C","text":"In the 1890s, painted caves were found in France by other people, in caves that had been sealed shut."},{"value":"D","text":"The paintings were beautifully made."}],"answer":"C","hint":"Which one would be hardest to explain away if you wanted to keep believing in a forgery?","explanation":"C is strongest because it removes the rival explanation. A single decorated cave belonging to one accused man can be dismissed as a fake; several caves, found by different people, sealed shut so that no forger could have entered, cannot. A is just confidence. B is about who noticed. D was actually used as an argument AGAINST the paintings - the experts thought they were too skilful to be ancient."},{"id":"e2","phase":"guided","type":"choice","prompt":"What does FIRSTHAND knowledge mean?","choices":[{"value":"A","text":"Knowledge that turns out to be correct"},{"value":"B","text":"Knowledge you have because you were there and saw it yourself"},{"value":"C","text":"Knowledge held by an expert"},{"value":"D","text":"Knowledge that was written down at the time"}],"answer":"B","hint":"The word is about where the knowledge came from, not about whether it is right.","explanation":"Firsthand is about ACCESS, not about correctness or status. A is wrong because firsthand accounts can still be mistaken. C is the trap this whole lesson is built on: the experts were experts and their knowledge was still secondhand. D describes a written record, which may itself be firsthand or secondhand depending on who wrote it."},{"id":"e3","phase":"guided","type":"choice","prompt":"According to the passage, who first noticed the painted animals on the ceiling?","choices":[{"value":"A","text":"The hunter who found the entrance in the 1860s"},{"value":"B","text":"Marcelino Sanz de Sautuola"},{"value":"C","text":"Maria, his daughter, who was about eight"},{"value":"D","text":"A prehistorian visiting from France"}],"answer":"C","hint":"Who looked up?","explanation":"Maria noticed them in 1879. The detail the passage lingers on is that her father had been working directly beneath the paintings for months without looking up - the paintings were not hidden, only unnoticed. Being in the right place is not enough if you ar
